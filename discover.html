<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0F172A">
<title>Discover Shops — DukanList</title>
<meta name="description" content="Swipe through local shops, restaurants, and services in your city. TikTok-style discovery for Bharat.">
<link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{ height:100%; overflow:hidden; font-family:'Manrope',sans-serif; background:#0F172A; color:#fff; overscroll-behavior:none }
  .feed{
    height:100vh; height:100dvh;
    overflow-y:scroll; scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{ display:none }

  .card{
    height:100vh; height:100dvh;
    scroll-snap-align:start; scroll-snap-stop:always;
    position:relative; overflow:hidden;
    background:#0F172A;
  }
  .card .bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    /* Brighter, less faded — small saturation boost so photos pop */
    filter:brightness(.92) saturate(1.08);
  }
  .card.no-photo .bg{ background:linear-gradient(135deg,#1E3A8A,#7C3AED) }

  .card .gradient{
    position:absolute; inset:0;
    /* Lighter gradient — only darken the BOTTOM area where text sits */
    background:linear-gradient(to top, rgba(15,23,42,.92) 0%, rgba(15,23,42,.75) 18%, rgba(15,23,42,.25) 42%, rgba(15,23,42,0) 65%);
    pointer-events:none;
  }
  /* Tiny top vignette so the top-nav chips stay readable */
  .card .gradient-top{
    position:absolute; top:0; left:0; right:0; height:120px;
    background:linear-gradient(to bottom, rgba(15,23,42,.55) 0%, rgba(15,23,42,0) 100%);
    pointer-events:none; z-index:1;
  }

  /* Top bar with category chips */
  .top-nav{
    position:fixed; top:env(safe-area-inset-top, 8px); left:0; right:0;
    z-index:10; padding:8px 12px;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(to bottom, rgba(15,23,42,.7), transparent);
  }
  .top-nav .home-btn, .top-nav .fav-btn{
    background:rgba(255,255,255,.16); backdrop-filter:blur(12px);
    color:#fff; text-decoration:none;
    padding:7px 12px; border-radius:99px;
    font-size:12px; font-weight:800;
    border:1px solid rgba(255,255,255,.2);
    flex-shrink:0;
    cursor:pointer;
  }
  .top-nav .logo{
    background:rgba(255,255,255,.12); backdrop-filter:blur(10px);
    border-radius:99px; padding:6px 11px;
    font-size:12px; font-weight:800; color:#fff;
    flex-shrink:0;
  }
  .top-nav .logo em{ color:#FBBF24; font-style:normal }

  /* Filter chips row (scrolls horizontally) */
  .chips{
    position:fixed; top:calc(env(safe-area-inset-top, 8px) + 48px); left:0; right:0;
    z-index:9;
    display:flex; gap:6px; overflow-x:auto; padding:0 12px 8px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none }
  .chip{
    flex-shrink:0; background:rgba(255,255,255,.1); backdrop-filter:blur(10px);
    color:#fff; padding:6px 12px; border-radius:99px;
    font-size:12px; font-weight:700; cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap;
  }
  .chip.active{ background:linear-gradient(135deg,#FBBF24,#F59E0B); color:#78350F; border-color:transparent }

  .card .body{
    position:absolute; bottom:0; left:0; right:0;
    padding:0 18px 92px;
    z-index:2;
  }
  .card .badges{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;
  }
  .badge{
    background:rgba(255,255,255,.15); backdrop-filter:blur(10px);
    padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700;
    color:#fff;
  }
  .badge.verified{ background:rgba(245,158,11,.25); color:#FBBF24; border:1px solid rgba(245,158,11,.4) }
  .badge.open{ background:rgba(16,185,129,.28); color:#6EE7B7; border:1px solid rgba(16,185,129,.45) }
  .badge.closed{ background:rgba(239,68,68,.25); color:#FCA5A5; border:1px solid rgba(239,68,68,.4) }
  .badge.walkins{ background:rgba(236,72,153,.25); color:#FBCFE8; border:1px solid rgba(236,72,153,.4) }
  .badge.featured{ background:linear-gradient(135deg,#F59E0B,#D97706); color:#fff; border:none }
  .badge.fresh{ background:rgba(124,58,237,.3); color:#DDD6FE; border:1px solid rgba(124,58,237,.5) }

  .card h2{
    font-family:'Manrope',sans-serif;
    font-size:28px; font-weight:900; line-height:1.05;
    letter-spacing:-.02em; margin-bottom:6px;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .card .meta{
    font-size:14px; font-weight:700; color:rgba(255,255,255,.85); margin-bottom:8px;
  }
  .card .usp{
    font-size:14px; line-height:1.45;
    color:rgba(255,255,255,.94); margin-bottom:6px;
    background:rgba(255,255,255,.08); border-left:3px solid rgba(251,191,36,.7);
    padding:8px 10px; border-radius:6px;
    backdrop-filter:blur(6px);
    max-width:84%;
    font-style:italic;
  }
  .card .addr{
    font-size:12px; color:rgba(255,255,255,.7); margin-bottom:14px;
    display:flex; align-items:center; gap:5px;
  }

  /* Right rail action buttons */
  .actions{
    position:absolute; right:12px; bottom:110px;
    display:flex; flex-direction:column; gap:14px; z-index:3;
  }
  .act{
    position:relative;
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.12); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18);
    display:grid; place-items:center;
    font-size:22px; color:#fff;
    cursor:pointer; transition:.15s;
    text-decoration:none;
  }
  .act:active{ transform:scale(.9) }
  .act:hover{ background:rgba(255,255,255,.22) }
  .act.call{ background:linear-gradient(135deg,#10B981,#059669); border-color:transparent }
  .act.wa{ background:linear-gradient(135deg,#25D366,#1da851); border-color:transparent }
  .act .lbl{
    position:absolute; bottom:-16px; font-size:9px; color:#fff; font-weight:800;
    white-space:nowrap; text-shadow:0 1px 3px rgba(0,0,0,.6); letter-spacing:.04em;
  }
  .act .heart-fill{ display:none }
  .act.faved .heart-fill{ display:inline }
  .act.faved .heart-out{ display:none }
  .act.faved{ background:linear-gradient(135deg,#EF4444,#DC2626); border-color:transparent }

  /* VIRAL Love button — public count, shopkeepers compete */
  .act.love{ background:linear-gradient(135deg,#FB923C,#F97316); border-color:transparent }
  .act.love.loved{ background:linear-gradient(135deg,#DC2626,#7C2D12); animation:lovePulse .6s ease }
  .act.love .love-emoji{ font-size:24px; display:block; line-height:1 }
  @keyframes lovePulse{
    0%{ transform:scale(1) }
    30%{ transform:scale(1.4) rotate(-8deg) }
    60%{ transform:scale(.9) }
    100%{ transform:scale(1) }
  }
  /* Sparkle pop on love */
  .love-spark{ position:absolute; inset:0; pointer-events:none; z-index:5 }
  .love-spark span{
    position:absolute; left:50%; top:50%; width:6px; height:6px; border-radius:50%;
    animation:sparkBurst .7s ease-out forwards;
  }
  @keyframes sparkBurst{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1.4) }
    100%{ opacity:0; transform:translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(.2) }
  }

  /* Main CTA buttons */
  .cta-row{
    position:absolute; bottom:24px; left:18px; right:78px;
    display:flex; gap:10px; z-index:3;
  }
  .cta{
    flex:1; padding:13px; border-radius:14px;
    background:#fff; color:#0F172A;
    font-weight:800; font-size:14px;
    text-decoration:none; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .cta.primary{
    background:linear-gradient(135deg,#FBBF24,#F59E0B);
    color:#78350F;
  }

  /* Loading + empty states */
  .center{
    height:100vh; display:grid; place-items:center;
    color:#94a3b8; font-size:14px;
  }
  .spinner{
    width:36px; height:36px; border:3px solid rgba(255,255,255,.18);
    border-top-color:#FBBF24; border-radius:50%;
    animation:spin .9s linear infinite;
    margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }

  /* Swipe hint (only first card, fades out) */
  .swipe-hint{
    position:absolute; bottom:170px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.85); font-size:12px; font-weight:700;
    background:rgba(0,0,0,.4); padding:8px 14px; border-radius:99px;
    backdrop-filter:blur(8px);
    animation:bounce 1.6s infinite;
    pointer-events:none; z-index:4;
  }
  @keyframes bounce{
    0%,100%{ transform:translateX(-50%) translateY(0) }
    50%{ transform:translateX(-50%) translateY(-8px) }
  }
  .swipe-hint.hide{ opacity:0; transition:opacity .4s }

  /* Toast for save/share confirmation */
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(15,23,42,.95); color:#fff; backdrop-filter:blur(10px);
    padding:10px 18px; border-radius:99px; font-size:13px; font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }

  /* ===== ANIMATIONS — wonderful UX ===== */

  /* Ken Burns slow zoom on photo background */
  .card.active .bg{
    animation:kenBurns 18s ease-in-out infinite alternate;
  }
  @keyframes kenBurns{
    0%   { transform:scale(1.0) translate(0, 0) }
    100% { transform:scale(1.12) translate(-2%, 1%) }
  }

  /* Body content slide up + fade on activation */
  .card .body, .card .actions, .card .cta-row{
    opacity:0; transform:translateY(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.85,.3,1.1);
  }
  .card.active .body{ opacity:1; transform:translateY(0); transition-delay:.10s }
  .card.active .actions{ opacity:1; transform:translateY(0); transition-delay:.25s }
  .card.active .cta-row{ opacity:1; transform:translateY(0); transition-delay:.35s }

  /* Badges pop in with stagger */
  .card.active .badge{
    animation:badgePop .45s cubic-bezier(.2,.9,.4,1.4) backwards;
  }
  .card.active .badge:nth-child(1){ animation-delay:.20s }
  .card.active .badge:nth-child(2){ animation-delay:.27s }
  .card.active .badge:nth-child(3){ animation-delay:.34s }
  .card.active .badge:nth-child(4){ animation-delay:.41s }
  .card.active .badge:nth-child(5){ animation-delay:.48s }
  .card.active .badge:nth-child(6){ animation-delay:.55s }
  .card.active .badge:nth-child(7){ animation-delay:.62s }
  @keyframes badgePop{
    0%   { opacity:0; transform:scale(.7) translateY(8px) }
    60%  { opacity:1; transform:scale(1.08) translateY(0) }
    100% { opacity:1; transform:scale(1) translateY(0) }
  }

  /* Featured badge shimmer */
  .badge.featured{
    background:linear-gradient(135deg,#F59E0B 0%,#FBBF24 50%,#F59E0B 100%);
    background-size:200% 100%;
    animation:shimmer 2.5s linear infinite;
  }
  @keyframes shimmer{
    0%{ background-position:200% 0 }
    100%{ background-position:-200% 0 }
  }

  /* Action button ripple on tap */
  .act{ position:relative; overflow:hidden }
  .act::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at center, rgba(255,255,255,.5) 0%, transparent 60%);
    opacity:0; transform:scale(0);
    pointer-events:none;
  }
  .act.tapped::after{ animation:ripple .55s ease-out }
  @keyframes ripple{
    0%{ opacity:.7; transform:scale(0) }
    100%{ opacity:0; transform:scale(2.5) }
  }

  /* Heart burst — emits sparkles around */
  .heart-burst{
    position:absolute; inset:0; pointer-events:none; z-index:5;
  }
  .heart-burst span{
    position:absolute; left:50%; top:50%;
    width:6px; height:6px; border-radius:50%;
    background:#fda4af;
    animation:burst .7s ease-out forwards;
  }
  @keyframes burst{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1) }
    100%{
      opacity:0;
      transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2);
    }
  }

  /* Heart bounce when toggled on */
  .act.fav.faved{ animation:heartBeat .6s ease }
  @keyframes heartBeat{
    0%{ transform:scale(1) }
    25%{ transform:scale(1.35) }
    50%{ transform:scale(.9) }
    75%{ transform:scale(1.15) }
    100%{ transform:scale(1) }
  }

  /* CTA gentle glow pulse */
  .cta.primary{
    box-shadow:0 6px 18px rgba(245,158,11,.35), 0 0 0 0 rgba(251,191,36,.5);
    animation:ctaGlow 2.8s ease-in-out infinite;
  }
  @keyframes ctaGlow{
    0%,100%{ box-shadow:0 6px 18px rgba(245,158,11,.35), 0 0 0 0 rgba(251,191,36,.5) }
    50%   { box-shadow:0 8px 22px rgba(245,158,11,.5),  0 0 0 8px rgba(251,191,36,0) }
  }

  /* Chip click pop */
  .chip{ transition:transform .15s, background .2s }
  .chip:active{ transform:scale(.92) }
  .chip.active{ animation:chipPop .35s cubic-bezier(.2,.9,.4,1.4) }
  @keyframes chipPop{
    0%{ transform:scale(.85) }
    60%{ transform:scale(1.1) }
    100%{ transform:scale(1) }
  }

  /* CTA-row click press */
  .cta:active{ transform:scale(.96); transition:transform .1s }

  /* Card swipe arrow finger animation */
  .swipe-hint{
    animation:bounce 1.6s infinite, pillGlow 2.4s ease-in-out infinite;
  }
  @keyframes pillGlow{
    0%,100%{ background:rgba(0,0,0,.4) }
    50%   { background:rgba(124,58,237,.55) }
  }

  /* Toast slide+scale */
  .toast.show{
    opacity:1; transform:translateX(-50%) translateY(0) scale(1);
    animation:toastIn .35s cubic-bezier(.2,.9,.4,1.4);
  }
  @keyframes toastIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(20px) scale(.8) }
    60%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1.06) }
    100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1) }
  }

  /* Respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce){
    .card.active .bg{ animation:none }
    .card .body, .card .actions, .card .cta-row{
      opacity:1; transform:none; transition:none;
    }
    .card.active .badge{ animation:none }
    .cta.primary{ animation:none }
    .badge.featured{ animation:none }
  }

  html[data-lang="hi"] body, html[data-lang="hi"] .card h2, html[data-lang="hi"] .card .meta{ font-family:'Noto Sans Devanagari','Manrope',sans-serif }
</style>
</head>
<body>

<div id="loadingScreen" class="center">
  <div>
    <div class="spinner"></div>
    <div style="color:#cbd5e1;font-weight:700">Loading shops near you…</div>
  </div>
</div>

<div id="topNav" class="top-nav" style="display:none">
  <a href="/" class="home-btn">← Home</a>
  <div class="logo">Dukan<em>List</em></div>
  <button id="cityBtn" class="fav-btn" onclick="openCityPicker()" type="button" aria-label="Choose city" style="border:0;font-size:12px;display:flex;align-items:center;gap:4px">📍 <span id="cityBtnLabel">All</span> ▾</button>

  <button id="muteBtn" class="fav-btn" onclick="toggleMute()" type="button" aria-label="Toggle sound" style="border:0;font-size:14px">🔊</button>

</div>

<!-- City picker overlay — opens on tap, closes without disturbing feed -->
<div id="cityPickerOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.75);backdrop-filter:blur(8px);z-index:100;padding:20px;align-items:center;justify-content:center" onclick="if(event.target===this)closeCityPicker()">
  <div style="background:#1E293B;border-radius:16px;padding:18px;max-width:380px;width:100%;max-height:70vh;overflow-y:auto;border:1px solid rgba(255,255,255,.15)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:15px;font-weight:800;color:#fff">📍 Choose City</div>
      <button onclick="closeCityPicker()" style="background:rgba(255,255,255,.1);color:#fff;border:0;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer">×</button>
    </div>
    <div id="cityList" style="display:flex;flex-direction:column;gap:4px"></div>

</div>

<div id="chips" class="chips" style="display:none"></div>

  <div style="text-align:center;padding:0 24px">

    <a href="/" style="display:inline-block;margin-top:14px;margin-left:8px;background:rgba(255,255,255,.12);color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;text-decoration:none;border:1px solid rgba(255,255,255,.2)">← Home</a>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(ch){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];}); }

// === VIRAL Love button — session-stable id for dedup ===
function getLoveSessionId(){
  try {
    var sid = localStorage.getItem('dl_love_sid');
    if (sid && sid.length >= 16) return sid;
    sid = (Date.now().toString(36) + Math.random().toString(36).slice(2,12) + Math.random().toString(36).slice(2,10));
    localStorage.setItem('dl_love_sid', sid);
    return sid;
  } catch(_){
    // private mode — fallback to in-memory
    if (!window._tmpSid) window._tmpSid = Date.now().toString(36) + Math.random().toString(36).slice(2,12);
    return window._tmpSid;
  }
}

// Track which shops user already loved this device (UX feedback)
function getLovedSet(){ try { return new Set(JSON.parse(localStorage.getItem('dl_loved')||'[]')); } catch(_){ return new Set(); } }
function markLoved(id){ try { var s = getLovedSet(); s.add(id); localStorage.setItem('dl_loved', JSON.stringify(Array.from(s))); } catch(_){} }

function spawnLoveSparkles(btn){
  var burst = document.createElement('div');
  burst.className = 'love-spark';
  var colors = ['#FBBF24','#F59E0B','#FB923C','#F472B6','#EF4444','#FDE68A'];
  for (var i = 0; i < 10; i++){
    var s = document.createElement('span');
    var angle = (i / 10) * Math.PI * 2;
    var dist = 30 + Math.random() * 18;
    s.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 0.05) + 's';
    burst.appendChild(s);
  }
  btn.appendChild(burst);
  setTimeout(function(){ burst.remove(); }, 800);
}

async function bumpLove(btn){
  var bizId = btn.getAttribute('data-id');
  if (!bizId) return;
  if (getLovedSet().has(bizId)){
    showToast('Already loved 🔥');
    return;
  }
  // Optimistic UI
  btn.classList.remove('loved'); void btn.offsetWidth; btn.classList.add('loved');
  spawnLoveSparkles(btn);
  var countEl = btn.querySelector('.love-count');
  var current = parseInt(btn.getAttribute('data-count') || '0', 10);
  var optimistic = current + 1;
  btn.setAttribute('data-count', optimistic);
  if (countEl) countEl.textContent = optimistic;
  markLoved(bizId);
  // Server call
  try {
    var sid = getLoveSessionId();
    var r = await ShopDB.client.rpc('bump_shop_like', { p_business_id: bizId, p_session_id: sid });
    if (!r.error && typeof r.data === 'number'){
      btn.setAttribute('data-count', r.data);
      if (countEl) countEl.textContent = r.data;
    }
    showToast('🔥 Loved! Share with friends to grow this shop');
  } catch(e){
    console.warn('bump_shop_like failed:', e);
  }
}

// ============================================================
// Web Audio whoosh — subtle swipe sound on card change
// ============================================================
var _audioCtx = null;
var _soundEnabled = true;
// Read user preference (mute persists across visits)
try {
  if (localStorage.getItem('dl_discover_mute') === '1') _soundEnabled = false;
} catch(_){}

function getAudioCtx(){
  if (_audioCtx) return _audioCtx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    _audioCtx = new AC();
    return _audioCtx;
  } catch(_){ return null; }
}

// Subtle "whoosh" — quick downward sweep on a sine + noise burst
function playSwipeSound(){
  if (!_soundEnabled) return;
  var ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended'){ ctx.resume().catch(function(){}); }
  var now = ctx.currentTime;

  // Main tone — pleasant downward swoosh (800Hz → 220Hz over 200ms)
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(220, now + 0.18);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.12, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.25);

  // Subtle high-end shimmer — 1.6kHz quick blip
  var osc2 = ctx.createOscillator();
  var gain2 = ctx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(1600, now);
  osc2.frequency.exponentialRampToValueAtTime(900, now + 0.08);
  gain2.gain.setValueAtTime(0, now);
  gain2.gain.linearRampToValueAtTime(0.035, now + 0.01);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
  osc2.connect(gain2).connect(ctx.destination);
  osc2.start(now);
  osc2.stop(now + 0.12);
}

function toggleMute(){
  _soundEnabled = !_soundEnabled;
  try { localStorage.setItem('dl_discover_mute', _soundEnabled ? '0' : '1'); } catch(_){}
  var btn = document.getElementById('muteBtn');
  if (btn) btn.textContent = _soundEnabled ? '🔊' : '🔇';
  if (_soundEnabled){
    // Play once to confirm + unlock iOS audio
    try { var c = getAudioCtx(); if (c && c.state === 'suspended') c.resume(); } catch(_){}
    playSwipeSound();
  }
}

// Normalize Indian mobile to exactly 10 digits (no country code).
// Handles: "9876543210", "+919876543210", "919876543210", "09876543210",
//          "+91 98765-43210", "91-9876543210", etc.
function normIN(raw){
  var d = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
  if (!d) return '';
  // Strip leading "91" if number is 12 digits (i.e., country code prepended)
  if (d.length === 12 && d.charAt(0) === '9' && d.charAt(1) === '1') d = d.slice(2);
  // Strip leading "0" if number is 11 digits (e.g., "09876543210")
  else if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1);
  // Strip leading "+" already removed; for safety strip another "91" only if d starts with "91" AND length still 12 (extreme edge)
  // Final length sanity
  return d.length === 10 ? d : d;
}
// tel: href — use raw 10-digit, dialer will accept it
function telHref(raw){
  var d = normIN(raw);
  return d ? 'tel:' + d : '';
}
// wa.me href — needs 91 country code prefix, exactly once
function waHref(raw){
  var d = normIN(raw);
  return d ? 'https://wa.me/91' + d : '';
}
function getFavs(){ try { return JSON.parse(localStorage.getItem('dl_favs')||'[]'); } catch(_){return []} }
function setFavs(a){ try { localStorage.setItem('dl_favs', JSON.stringify(a)); } catch(_){} }
function isFav(id){ return getFavs().indexOf(id) > -1 }
function toggleFav(id){ var f=getFavs(); var i=f.indexOf(id); if(i>-1) f.splice(i,1); else f.push(id); setFavs(f); return f.indexOf(id)>-1 }
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

// Open/Closed check (light — uses hours_json if present)
function isOpenNow(hours){
  if (!hours || typeof hours !== 'object') return null;
  try {
    var d = new Date();
    var day = ['sun','mon','tue','wed','thu','fri','sat'][d.getDay()];
    var entry = hours[day];
    if (!entry || !entry.open || !entry.close) return null;
    var now = d.getHours()*60 + d.getMinutes();
    function toMin(t){ var p = t.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1]||0,10); }
    var o = toMin(entry.open), cl = toMin(entry.close);
    return now >= o && now <= cl;
  } catch(_){ return null; }
}

// Build filter chips from data
function buildChips(allRows, catMap, activeFilter){
  var byCat = {};
  allRows.forEach(function(b){
    var k = b.sub_category_id || b.category_id;
    if (!k) return;
    byCat[k] = (byCat[k] || 0) + 1;
  });
  var sorted = Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; }).slice(0, 12);
  var chips = '<div class="chip '+(!activeFilter?'active':'')+'" data-cat="all">🌟 All</div>';
  sorted.forEach(function(id){
    var c = catMap[id] || {};
    var label = (c.icon || '🏪') + ' ' + (c.name || 'Shop');
    chips += '<div class="chip '+(activeFilter===id?'active':'')+'" data-cat="'+esc(id)+'">'+esc(label)+'</div>';
  });
  return chips;
}

var STATE = { allRows: [], catMap: {}, cityMap: {}, filter: null, cityFilter: null };

// City picker — opens overlay, lets user pick a city to filter without reloading
function openCityPicker(){
  var box = document.getElementById('cityList');
  if (!box) return;
  // Build city list from loaded data (counts per city)
  var counts = {};
  STATE.allRows.forEach(function(b){
    var cid = b.city_id;
    if (!cid) return;
    counts[cid] = (counts[cid] || 0) + 1;
  });
  var sorted = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
  var html = '<button data-cid="" style="background:' + (STATE.cityFilter ? 'rgba(255,255,255,.08)' : 'linear-gradient(135deg,#FBBF24,#F59E0B)') + ';color:' + (STATE.cityFilter ? '#fff' : '#78350F') + ';border:0;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center">🌟 All Cities <span style="opacity:.7;font-size:12px">' + STATE.allRows.length + '</span></button>';
  sorted.forEach(function(cid){
    var cname = STATE.cityMap[cid] || 'Unknown';
    var sel = STATE.cityFilter === cid;
    // Use data-cid attribute + click handler instead of inline onclick to avoid quote-escaping issues
    html += '<button data-cid="' + esc(cid) + '" style="background:' + (sel ? 'linear-gradient(135deg,#FBBF24,#F59E0B)' : 'rgba(255,255,255,.08)') + ';color:' + (sel ? '#78350F' : '#fff') + ';border:0;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;width:100%;display:flex;justify-content:space-between;align-items:center">📍 ' + esc(cname) + ' <span style="opacity:.7;font-size:12px">' + counts[cid] + '</span></button>';
  });
  box.innerHTML = html;
  // Wire click handlers (no inline onclick — avoids quote escaping issues with UUIDs)
  box.querySelectorAll('button[data-cid]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var cid = btn.getAttribute('data-cid') || null;
      setCity(cid || null);
    });
  });
  document.getElementById('cityPickerOverlay').style.display = 'flex';
}
function closeCityPicker(){
  document.getElementById('cityPickerOverlay').style.display = 'none';
}
function setCity(cid){
  STATE.cityFilter = cid;
  var label = document.getElementById('cityBtnLabel');
  if (label) label.textContent = cid ? (STATE.cityMap[cid] || 'City') : 'All';
  closeCityPicker();
  renderFiltered();
}

async function init(){
  try {
    var c = ShopDB.client;
    // Pull a randomised mix of recent active shops
    var r = await c.from('businesses')
      .select('id, slug, name, photos, mobile, whatsapp, usp_text, address_line1, pincode, rating_avg, rating_count, verified_score, walk_ins_today, sub_category_id, category_id, city_id, hours_json, featured_until, created_at, likes_count')
      .eq('status', 'active')
      .order('updated_at', { ascending: false })
      .limit(200);
    if (r.error) throw r.error;
    var rows = r.data || [];
    if (rows.length === 0){
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('emptyScreen').style.display = '';
      return;
    }
    // Shuffle for variety
    rows = rows.sort(function(){ return Math.random() - 0.5; });

    // Look up city + cat names in batch
    var cityIds = Array.from(new Set(rows.map(function(r){return r.city_id}).filter(Boolean)));
    var catIds  = Array.from(new Set(rows.map(function(r){return r.sub_category_id || r.category_id}).filter(Boolean)));
    if (cityIds.length){
      var cr = await c.from('geo_cities').select('id,name').in('id', cityIds);
      (cr.data||[]).forEach(function(x){ STATE.cityMap[x.id] = x.name; });
    }
    if (catIds.length){
      var kr = await c.from('categories').select('id,name,icon').in('id', catIds);
      (kr.data||[]).forEach(function(x){ STATE.catMap[x.id] = x; });
    }
    STATE.allRows = rows;
    renderFiltered();
  } catch(e){
    document.getElementById('loadingScreen').innerHTML = '<div style="color:#FCA5A5;text-align:center;padding:24px"><h2>Could not load shops</h2><p style="margin-top:8px;font-size:13px">'+esc(e.message||String(e))+'</p><a href="/" style="display:inline-block;margin-top:14px;background:#FBBF24;color:#78350F;padding:10px 16px;border-radius:8px;font-weight:800;text-decoration:none">← Back</a></div>';
  }
}

function renderFiltered(){
  var rows = STATE.allRows;
  if (STATE.filter){
    rows = rows.filter(function(b){ return (b.sub_category_id||b.category_id) === STATE.filter; });
  }
  if (STATE.cityFilter){
    rows = rows.filter(function(b){ return b.city_id === STATE.cityFilter; });
  }
  if (rows.length === 0){
    document.getElementById('feed').style.display = 'none';
    document.getElementById('emptyScreen').style.display = '';
    return;
  }
  document.getElementById('emptyScreen').style.display = 'none';

  var nowDate = new Date();
  var sevenDaysAgo = new Date(nowDate.getTime() - 7*24*60*60*1000);

  var html = rows.map(function(b, idx){
    var photo = (b.photos && b.photos[0]) || '';
    var cat = STATE.catMap[b.sub_category_id || b.category_id] || {};
    var city = STATE.cityMap[b.city_id] || '';
    var verified = b.verified_score >= 1;
    var rating = (b.rating_avg||0).toFixed(1);
    var rc = b.rating_count || 0;
    var fav = isFav(b.id);
    var walks = b.walk_ins_today || 0;
    // Build a complete readable address: full address_line1 + pincode + city
    var rawAddr = (b.address_line1 || '').trim();
    var addrShort = '';
    if (rawAddr){
      addrShort = rawAddr;
      // Append city if not already in the address
      if (city && rawAddr.toLowerCase().indexOf(city.toLowerCase()) === -1){
        addrShort += ', ' + city;
      }
      // Append pincode if present and not already in address
      if (b.pincode && rawAddr.indexOf(String(b.pincode)) === -1){
        addrShort += ' - ' + b.pincode;
      }
      // Soft truncate to keep card clean
      if (addrShort.length > 110) addrShort = addrShort.slice(0, 107) + '…';
    }
    if (!addrShort) addrShort = city;
    var uspText = typeof b.usp_text === 'string' ? b.usp_text : '';
    var openStatus = isOpenNow(b.hours_json);
    var isFeatured = b.featured_until && new Date(b.featured_until) > nowDate;
    var isFresh = b.created_at && new Date(b.created_at) > sevenDaysAgo;

    return ''+
    '<div class="card '+(photo?'':'no-photo')+'" data-id="'+b.id+'" data-idx="'+idx+'">'+
      '<div class="bg" style="'+(photo?'background-image:url('+esc(photo)+')':'')+'"></div>'+
      '<div class="gradient-top"></div>'+
      '<div class="gradient"></div>'+
      '<div class="body">'+
        '<div class="badges">'+
          (isFeatured ? '<span class="badge featured">⭐ Featured</span>' : '')+
          (cat.icon ? '<span class="badge">'+esc(cat.icon)+' '+esc(cat.name||'')+'</span>' : '')+
          (verified ? '<span class="badge verified">✓ Verified</span>' : '')+
          (openStatus === true ? '<span class="badge open">🟢 Open now</span>' : '')+
          (openStatus === false ? '<span class="badge closed">🔴 Closed</span>' : '')+
          (rc > 0 ? '<span class="badge">⭐ '+rating+' ('+rc+')</span>' : '')+
          (walks > 0 ? '<span class="badge walkins">🚶 '+walks+' today</span>' : '')+
          (isFresh ? '<span class="badge fresh">✨ New</span>' : '')+
        '</div>'+
        '<h2>'+esc(b.name||'')+'</h2>'+
        (city ? '<div class="meta">📍 '+esc(city)+'</div>' : '')+
        (uspText ? '<div class="usp">"'+esc(uspText.slice(0,140))+(uspText.length>140?'…':'')+'"</div>' : '')+
        (addrShort && addrShort!==city ? '<div class="addr">📌 '+esc(addrShort)+'</div>' : '')+
      '</div>'+
      '<div class="actions">'+
        // VIRAL: public Love button with live count — shopkeepers compete for likes
        '<div class="act love" data-id="'+esc(b.id)+'" data-count="'+(b.likes_count||0)+'">'+
          '<span class="love-emoji">🔥</span>'+
          '<span class="love-count" style="position:absolute;bottom:-18px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)">'+(b.likes_count||0)+'</span>'+
        '</div>'+
        '<div class="act fav '+(fav?'faved':'')+'" data-id="'+esc(b.id)+'">'+
          '<span class="heart-out">🤍</span><span class="heart-fill">❤️</span>'+
          '<span class="lbl">Save</span>'+
        '</div>'+
        '<div class="act share" data-name="'+esc(b.name||'')+'" data-slug="'+esc(b.slug||'')+'" data-loves="'+(b.likes_count||0)+'">📤<span class="lbl">Share</span></div>'+
        (telHref(b.mobile) ? '<a class="act call" href="'+esc(telHref(b.mobile))+'">📞<span class="lbl">Call</span></a>' : '')+
        (waHref(b.whatsapp || b.mobile) ? '<a class="act wa" href="'+esc(waHref(b.whatsapp || b.mobile))+'" target="_blank" rel="noopener">💬<span class="lbl">Chat</span></a>' : '')+
      '</div>'+
      '<div class="cta-row">'+
        '<a class="cta primary" href="/business.html?slug='+esc(b.slug||'')+'">View Shop →</a>'+
      '</div>'+
      (idx===0 ? '<div class="swipe-hint" id="swipeHint">⬆️ Swipe up for next</div>' : '')+
    '</div>';
  }).join('');

  var feed = document.getElementById('feed');
  feed.innerHTML = html;
  feed.scrollTop = 0;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('topNav').style.display = '';

  var chipsEl = document.getElementById('chips');
  chipsEl.innerHTML = buildChips(STATE.allRows, STATE.catMap, STATE.filter);
  chipsEl.style.display = '';
  chipsEl.querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click', function(){
      var cat = ch.getAttribute('data-cat');
      STATE.filter = (cat === 'all' ? null : cat);
      renderFiltered();
    });
  });

  feed.style.display = '';

  feed.querySelectorAll('.act.fav').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      var on = toggleFav(btn.getAttribute('data-id'));
      btn.classList.toggle('faved', on);
      if (on){
        btn.classList.remove('faved');
        void btn.offsetWidth;
        btn.classList.add('faved');
        spawnHeartBurst(btn);
      }
      showToast(on ? '❤️ Saved' : '💔 Removed');
    });
  });
  // VIRAL Love button wiring — public count + share encouragement
  feed.querySelectorAll('.act.love').forEach(function(btn){
    var bizId = btn.getAttribute('data-id');
    if (bizId && getLovedSet().has(bizId)){ btn.classList.add('loved'); }
    btn.addEventListener('click', function(e){
      e.preventDefault();
      bumpLove(btn);
    });
  });
  feed.querySelectorAll('.act').forEach(function(btn){
    btn.addEventListener('pointerdown', function(){
      btn.classList.remove('tapped');
      void btn.offsetWidth;
      btn.classList.add('tapped');
    });
  });

  feed.querySelectorAll('.act.share').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      var name = btn.getAttribute('data-name') || '';
      var slug = btn.getAttribute('data-slug') || '';
      var url  = location.origin + '/business.html?slug=' + slug;
      var msg  = name + '\n' + url + '\n\nFound on DukanList — Bharat ki local directory.';
      if (navigator.share){
        navigator.share({ title:name, text:msg, url:url }).catch(function(){});
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      }
    });
  });

  feed.addEventListener('scroll', function(){
    var h = document.getElementById('swipeHint');
    if (h) h.classList.add('hide');
  }, { once:true });

  var cards = feed.querySelectorAll('.card');
  for (var i = 1; i <= 3 && i < cards.length; i++){
    var bg = cards[i].querySelector('.bg');
    var style = bg && bg.getAttribute('style') || '';
    var m = style.match(/url\(([^)]+)\)/);
    if (m){ var img = new Image(); img.src = m[1]; }
  }

  // Track whether the user has interacted (touched the feed)
  var _hasInteracted = false;
  var _firstActivation = true;
  var _lastActiveIdx = -1;
  function unlockAudio(){
    _hasInteracted = true;
    try { var c = getAudioCtx(); if (c && c.state === 'suspended') c.resume(); } catch(_){}
  }
  feed.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
  feed.addEventListener('wheel',      unlockAudio, { passive: true, once: true });
  feed.addEventListener('scroll',     unlockAudio, { passive: true, once: true });

  if ('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.intersectionRatio > 0.5){
          en.target.classList.add('active');
          var idx = parseInt(en.target.getAttribute('data-idx') || '0', 10);
          if (!_firstActivation && _hasInteracted && idx !== _lastActiveIdx){
            playSwipeSound();
          }
          _firstActivation = false;
          _lastActiveIdx = idx;
          var nxt = feed.querySelector('.card[data-idx="'+(idx+2)+'"]');
          if (nxt){
            var bg2 = nxt.querySelector('.bg');
            var style2 = bg2 && bg2.getAttribute('style') || '';
            var m2 = style2.match(/url\(([^)]+)\)/);
            if (m2){ var im = new Image(); im.src = m2[1]; }
          }
        }
      });
    }, { root: feed, threshold: [0.5] });
    cards.forEach(function(card){ obs.observe(card); });
    if (cards[0]) cards[0].classList.add('active');
  } else {
    cards.forEach(function(card){ card.classList.add('active'); });
  }
}

function spawnHeartBurst(btn){
  var burst = document.createElement('div');
  burst.className = 'heart-burst';
  var colors = ['#fda4af','#fbbf24','#f472b6','#a78bfa','#fde68a','#86efac'];
  for (var i = 0; i < 8; i++){
    var s = document.createElement('span');
    var angle = (i / 8) * Math.PI * 2;
    var dist = 32 + Math.random() * 14;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 0.05) + 's';
    burst.appendChild(s);
  }
  btn.appendChild(burst);
  setTimeout(function(){ burst.remove(); }, 800);
}

init();
</script>
