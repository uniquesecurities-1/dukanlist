<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1080" height="1080" fill="url(#bg2)"/>

  <!-- Decorative bubbles -->
  <circle cx="120" cy="160" r="180" fill="rgba(255,255,255,0.10)"/>
  <circle cx="950" cy="940" r="220" fill="rgba(255,255,255,0.08)"/>
  <circle cx="980" cy="100" r="60" fill="rgba(255,255,255,0.15)"/>
  <circle cx="100" cy="1000" r="40" fill="rgba(255,255,255,0.18)"/>

  <!-- Top label -->
  <g transform="translate(540, 110)">
    <rect x="-180" y="-32" width="360" height="56" rx="28" fill="rgba(0,0,0,0.18)"/>
    <text text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" letter-spacing="3" y="8">🏪 SHOPKEEPERS · DABWALI</text>
  </g>

  <!-- Big headline -->
  <g transform="translate(540, 270)">
    <text text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-weight="900" font-size="96" letter-spacing="-3">Apni Dukaan</text>
    <text text-anchor="middle" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-weight="900" font-size="96" letter-spacing="-3" y="100">FREE Karein.</text>
  </g>

  <!-- Hindi sub -->
  <g transform="translate(540, 500)">
    <text text-anchor="middle" fill="rgba(255,255,255,0.95)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="42">100% मुफ़्त लिस्टिंग</text>
    <text text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="28" y="50">No paid ranking · No commission · No hidden cost</text>
  </g>

  <!-- Benefits card -->
  <g transform="translate(540, 650)">
    <rect x="-420" y="-30" width="840" height="220" rx="22" fill="url(#cardGrad)" filter="url(#softGlow)"/>
    <g transform="translate(-380, 30)">
      <text fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30">✓ FREE WhatsApp poster generator</text>
      <text fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30" y="50">✓ FREE printable QR card</text>
      <text fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30" y="100">✓ Direct WhatsApp customer leads</text>
      <text fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="30" y="150">✓ Verified by DukanList team</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(540, 920)">
    <rect x="-300" y="-40" width="600" height="80" rx="40" fill="#0F172A" filter="url(#softGlow)"/>
    <text text-anchor="middle" fill="#FBBF24" font-family="'Manrope', sans-serif" font-weight="900" font-size="38" y="14">🚀 dukanlist.com/register</text>
  </g>

  <!-- Bottom tagline -->
  <g transform="translate(540, 1020)">
    <text text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="22" letter-spacing="2">SIRSA–BATHINDA ka APNA local directory</text>
  </g>
</svg>