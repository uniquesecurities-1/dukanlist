<meta name="description" content="An organisation of Mandi Dabwali — office bearers, members and history on Dabwali Parivar.">
<!-- v355: a sanstha in Dabwali Parivar (db/251) — office bearers of the current session,
     members, past presidents. Served at /sanstha/<slug>. -->
<link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><img class="brand-wordmark" src="/assets/brand/wordmark-dark.webp" alt="DukanList" width="154" height="36" style="height:36px;width:auto;display:block"></a>
    <nav class="nav-links">
      <div class="lang-toggle">
        <button onclick="setLang('en')" id="langBtnEn">EN</button>
        <button onclick="setLang('hi')" id="langBtnHi" class="keep-en">हिं</button>
      </div>
      <a href="/parivar"><span data-i18n-en>Dabwali Parivar</span><span data-i18n-hi>डबवाली परिवार</span></a>
      <a href="/browse.html"><span data-i18n-en>Shops</span><span data-i18n-hi>दुकानें</span></a>
    </nav>
  </div>
</header>

<main class="pv-wrap" id="root"><div class="pv-empty">…</div></main>

<script src="/assets/js/dl-config.js"></script>
<script src="/assets/js/parivar-common.js?v=20261013a"></script>
<script>
(function(){
  var esc = PV.esc, bi = PV.bi;
  var slug = (location.pathname.match(/^\/sanstha\/([a-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('slug') || '';
  var root = document.getElementById('root');
  var MEMBERS = [], SESS_START = 0, ORG_NAME = '';
  function notFound(){
    root.innerHTML = '<div class="pv-empty">' + bi('This organisation is not available.', 'यह संस्था उपलब्ध नहीं है।') + '<br><a href="/parivar">' + bi('← Dabwali Parivar', '← डबवाली परिवार') + '</a></div>';
  }
  // v367: Call / WhatsApp right on the card — only when the member allows it (same rule as their own page)
  function memberActs(m){
    var d = String(m.mobile || '').replace(/\D/g, '').slice(-10);
    if (d.length !== 10 || (m.contact_mode !== 'show' && m.contact_mode !== 'whatsapp')) return '';
    var wa = 'https://wa.me/91' + d + '?text=' + encodeURIComponent('Namaste ' + (m.name || '') + ' ji, ' + (ORG_NAME ? ORG_NAME + ' ke ' : '') + 'Dabwali Parivar (DukanList) page se aapka number mila.');
    return '<div class="mc-acts">'
      + (m.contact_mode === 'show' ? '<a class="mc-call" href="tel:+91' + d + '" onclick="event.stopPropagation()">📞 ' + bi('Call', 'कॉल') + '</a>' : '')
      + '<a class="mc-wa" href="' + wa + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">💬 WhatsApp</a></div>';
  }
  function drawMembers(q){
    q = String(q || '').trim().toLowerCase();
    // v365: search name, profession and business
    var list = q ? MEMBERS.filter(function(m){
      return [m.name, m.profession, m.firm && m.firm.name].join(' ').toLowerCase().indexOf(q) !== -1;
    }) : MEMBERS;
    var el = document.getElementById('pvMembers'); if (!el) return;
    var now = new Date().getFullYear();
    el.innerHTML = list.length ? list.map(function(m){
      var firm = m.firm && m.firm.name
        ? '<div class="mc-f">🏪 ' + (m.firm.slug ? '<a href="/' + encodeURIComponent(m.firm.slug) + '" onclick="event.stopPropagation()">' + esc(m.firm.name) + '</a>' : esc(m.firm.name))
          + ((m.firm.role_label || m.firm.role) ? ' <span>· ' + PV.firmRoleHtml(m.firm.role, m.firm.role_label) + '</span>' : '') + '</div>' : '';
      // only show a real joining year — a year equal to the current session just means 'added this year'
      var since = m.since && m.since <= now && (!SESS_START || m.since < SESS_START) ? '<div class="mc-s">' + bi('Member since', 'सदस्य') + ' ' + esc(m.since) + (now - m.since >= 2 ? ' · ' + (now - m.since) + ' ' + bi('yrs', 'साल') : '') + '</div>' : '';
      return '<div class="pv-mcard" onclick="location.href=\'/parivar/' + encodeURIComponent(m.slug) + '\'">' + PV.avatar(m.photo, m.name, 46)
        + '<div class="mc-b"><div class="mc-n"><a href="/parivar/' + encodeURIComponent(m.slug) + '">' + esc(m.name) + '</a>' + (m.verified ? ' <span class="pv-ok" title="Confirmed by the member">✓</span>' : '') + '</div>'
        + (m.role && m.role !== 'member' ? '<span class="pv-role" style="font-size:.66rem;padding:1px 8px">' + PV.roleHtml(m.role, m.role_label) + '</span> ' : '')
        + (m.profession ? '<div class="mc-p">' + esc(m.profession) + '</div>' : '')
        + firm + since + memberActs(m) + '</div></div>';
    }).join('') : '<div class="pv-note" style="padding:10px 4px">' + bi('No member matches that.', 'कोई सदस्य नहीं मिला।') + '</div>';
  }
  if (!slug){ notFound(); return; }
  PV.rpc('parivar_get_org', { p_slug: slug }).then(function(o){
    if (!o){ notFound(); return; }
    document.title = o.name + ' — Dabwali Parivar | DukanList';
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', o.name + (o.city ? ', ' + o.city : '') + ' — office bearers ' + o.session + ', members and past presidents on Dabwali Parivar.');
    MEMBERS = o.members || [];
    SESS_START = parseInt(String(o.session || ''), 10) || 0;
    ORG_NAME = o.name || '';
    var cm = String(o.contact_mobile || '').replace(/\D/g, '').slice(-10);
    var h = '<div class="pv-box"><div class="pv-head">' + PV.avatar(o.logo, o.name, 64, false)
      + '<div><h1>' + esc(o.name) + '</h1>' + (o.name_hi ? '<div class="sub">' + esc(o.name_hi) + '</div>' : '')
      + '<div class="sub">' + PV.kindHtml(o.kind) + (o.city ? ' · ' + esc(o.city) : '') + ' · ' + MEMBERS.length + ' ' + bi('members', 'सदस्य') + ' · ' + bi('Session', 'सत्र') + ' ' + esc(o.session) + '</div></div></div>'
      + ((o.founded_year || o.address) ? '<div class="sub" style="margin-top:10px">'
          + (o.founded_year ? '🏛 ' + bi('Founded', 'स्थापना') + ' ' + esc(o.founded_year) + ((new Date().getFullYear() - o.founded_year) >= 2 ? ' · ' + (new Date().getFullYear() - o.founded_year) + ' ' + bi('years', 'साल') : '') : '')
          + (o.founded_year && o.address ? ' &nbsp;·&nbsp; ' : '')
          + (o.address ? '📍 ' + esc(o.address) : '') + '</div>' : '')
      + (o.about ? '<p style="margin:12px 0 0;color:var(--ink-2);line-height:1.55;white-space:pre-wrap">' + esc(o.about) + '</p>' : '')
      // v359: the contact person — designation, their own page, their shop (db/253)
      + (o.contact_name
          ? '<div class="pv-row" style="margin:14px 0 0;background:#F8FAFC"><div><div class="m">' + bi('Contact person', 'संपर्क व्यक्ति') + '</div>'
            + '<div class="n">' + (o.contact_slug ? '<a href="/parivar/' + encodeURIComponent(o.contact_slug) + '" style="color:inherit">' + esc(o.contact_name) + '</a>' : esc(o.contact_name)) + '</div>'
            + (o.contact_shop && o.contact_shop.slug ? '<div class="m">🏪 <a href="/' + encodeURIComponent(o.contact_shop.slug) + '">' + esc(o.contact_shop.name) + '</a></div>' : '')
            + '</div>' + (o.contact_role ? '<span class="pv-role">' + PV.roleHtml(o.contact_role) + '</span>' : '') + '</div>'
          : '')
      + (cm.length === 10
          ? '<div class="pv-acts"><a class="pv-btn pv-wa" target="_blank" rel="noopener" href="https://wa.me/91' + cm + '?text=' + encodeURIComponent('Namaste, Dabwali Parivar (DukanList) par ' + o.name + ' ka page dekha.') + '">💬 '
            + bi('Contact the organisation', 'संस्था से संपर्क') + '</a>'
            + '<a class="pv-btn pv-call" href="tel:+91' + cm + '">📞 ' + bi('Call', 'कॉल') + '</a></div>'
          : '')
      + '</div>';
    if ((o.bearers || []).length){
      h += '<h2 class="pv-h2">' + bi('Office bearers', 'पदाधिकारी') + ' ' + esc(o.session) + '</h2><div class="pv-bearers">' + o.bearers.map(function(b){
        return '<a class="pv-bearer" href="/parivar/' + encodeURIComponent(b.slug) + '">' + PV.avatar(b.photo, b.name, 40)
          + '<div><div class="r">' + PV.roleHtml(b.role, b.role_label) + '</div><div class="n">' + esc(b.name) + (b.verified ? ' <span class="pv-ok">✓</span>' : '') + '</div></div></a>';
      }).join('') + '</div>';
    }
    h += '<h2 class="pv-h2">' + bi('Members', 'सदस्य') + ' (' + MEMBERS.length + ')</h2>';
    if (MEMBERS.length > 8){
      h += '<div class="pv-search" style="margin:0 0 6px;max-width:none"><input type="search" id="mq" placeholder="Search by name, profession or business" data-ph-en="Search by name, profession or business" data-ph-hi="नाम, पेशा या दुकान से खोजें"></div>';
    }
    if (MEMBERS.some(function(m){ return m.added_by_sanstha; })){
      h += '<div class="pv-note" style="margin:0 0 8px">' + bi('Members added by the organisation · ✓ = confirmed by the member', 'सदस्य संस्था द्वारा जोड़े गए · ✓ = सदस्य ने खुद पुष्टि की') + '</div>';
    }
    h += '<div class="pv-mgrid" id="pvMembers"></div>';
    if ((o.past_presidents || []).length){
      h += '<div class="pv-past"><b>' + bi('Past presidents', 'पूर्व अध्यक्ष') + ':</b> ' + o.past_presidents.map(function(p){
        return esc(p.session) + ' <a href="/parivar/' + encodeURIComponent(p.slug) + '">' + esc(p.name) + '</a>';
      }).join(' · ') + '</div>';
    }
    h += '<p class="pv-note" style="margin-top:18px">' + bi('Office bearers changed or a name is wrong? ', 'पदाधिकारी बदल गए या कोई नाम गलत है? ')
      + '<a href="/contact">' + bi('Tell the DukanList helpline', 'DukanList हेल्पलाइन को बताएं') + '</a></p>';
    root.innerHTML = h;
    drawMembers('');
    try { PVsyncPlaceholders(); } catch(_){}
    var mq = document.getElementById('mq'); if (mq) mq.addEventListener('input', function(){ drawMembers(mq.value); });
  }).catch(function(){ root.innerHTML = '<div class="pv-empty">' + bi('Could not load — try again.', 'लोड नहीं हुआ — फिर कोशिश करें।') + '</div>'; });
})();
</script>
