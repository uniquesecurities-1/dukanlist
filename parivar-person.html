<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<meta name="theme-color" content="#FF6B1A">
<title>Dabwali Parivar | DukanList</title>
<meta name="description" content="Dabwali Parivar — the people of Mandi Dabwali, their firms and organisations.">
<meta name="robots" content="noindex, follow" id="metaRobots">
<!-- v355: a person in Dabwali Parivar (db/251) — firms, sansthas, roles. Served at /parivar/<slug>. -->
<link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v=20261009b">
<link rel="stylesheet" href="/assets/css/parivar.css?v=20261015a">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><img class="brand-wordmark" src="/assets/brand/wordmark-dark.webp" alt="DukanList" width="154" height="36" style="height:36px;width:auto;display:block"></a>
    <nav class="nav-links">
      <div class="lang-toggle">
        <button onclick="setLang('en')" id="langBtnEn">EN</button>
        <button onclick="setLang('hi')" id="langBtnHi" class="keep-en">हिं</button>
      </div>
      <a href="/parivar"><span data-i18n-en>Dabwali Parivar</span><span data-i18n-hi>डबवाली परिवार</span></a>
      <a href="/browse.html"><span data-i18n-en>Shops</span><span data-i18n-hi>दुकानें</span></a>
    </nav>
  </div>
</header>

<main class="pv-wrap" id="root"><div class="pv-empty">…</div></main>

<script src="/assets/js/dl-config.js"></script>
<script src="/assets/js/parivar-common.js?v=20261013c"></script>
<script src="/assets/js/parivar-events.js?v=20261015a"></script>
<script>
(function(){
  var esc = PV.esc, bi = PV.bi;
  var slug = (location.pathname.match(/^\/parivar\/([a-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('slug') || '';
  var root = document.getElementById('root');
  function notFound(){
    root.innerHTML = '<div class="pv-empty">' + bi('This page is not available.', 'यह पेज उपलब्ध नहीं है।') + '<br><a href="/parivar">' + bi('← Dabwali Parivar', '← डबवाली परिवार') + '</a></div>';
  }
  // v372: who they are at a glance — their firm(s) and every organisation, office positions first
  function idLine(p, cur){
    var firms = (p.firms || []).map(function(f){
      var nm = f.slug ? '<a href="/' + encodeURIComponent(f.slug) + '">' + esc(f.name) + '</a>' : esc(f.name);
      return '<div class="pf">🏪 ' + nm + (f.role ? ' <span>· ' + PV.firmRoleHtml(f.role, f.role_label) + '</span>' : '') + '</div>';
    }).join('');
    var seen = {}, orgs = cur.slice().sort(function(a, b){ return (a.role === 'member') - (b.role === 'member'); }).filter(function(r){
      if (seen[r.org_slug]) return false; seen[r.org_slug] = 1; return true;
    }).map(function(r){
      var off = r.role !== 'member';
      return '<a class="pv-oc' + (off ? ' o' : '') + '" href="/sanstha/' + encodeURIComponent(r.org_slug) + '">' + (off ? PV.roleHtml(r.role, r.role_label) + ' · ' : '') + esc(r.org) + '</a>';
    }).join('');
    return firms + (orgs ? '<div class="pv-ocs">' + orgs + '</div>' : '');
  }
  // v373: firm cards like "Recently viewed" — photo, category, rating, verified, city, call/WhatsApp.
  // Shop details are the shop's own public listing (same as its DukanList page).
  function thumb(u){ return /res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u || '') ? u.replace(/\/upload\/(?:[^/]*\/)?(v\d+\/)/, '/upload/w_144,h_144,c_fill,q_auto,f_auto/$1') : u; }
  function firmCard(f, b){
    var role = (f.role || f.role_label) ? '<span class="pv-role f">' + PV.firmRoleHtml(f.role, f.role_label) + '</span>' : '';
    var photo = b && Array.isArray(b.photos) && b.photos[0];
    var icon = (b && b.cat_icon) || '🏪';
    var strict = b && b.is_professional_listing === true && b.professional_tier === 'strict';
    var bits = [];
    var cat = (b && b.cat_name) || f.category;
    if (cat) bits.push('<span class="fc-cat">' + (b && b.cat_icon ? esc(b.cat_icon) + ' ' : '') + esc(cat) + '</span>');
    if (strict) bits.push('<span style="color:#0EA5E9;font-weight:800">🛡 ' + bi('Professional', 'प्रोफेशनल') + '</span>');
    else if (b && b.rating_avg > 0) bits.push('<span class="fc-rate">⭐ ' + Number(b.rating_avg).toFixed(1) + '</span>');
    if (b && (b.verified_visit || b.verified_score >= 1)) bits.push('<span class="fc-ok">✓ ' + bi('Verified', 'वेरिफाइड') + '</span>');
    var city = b && b.geo_cities && b.geo_cities.name;
    var mob = b ? String(b.mobile || '').replace(/\D/g, '').slice(-10) : '';
    var wa = b ? String(b.whatsapp || b.mobile || '').replace(/\D/g, '').slice(-10) : '';
    var acts = (mob.length === 10 ? '<a class="fc-btn call" href="tel:+91' + mob + '" aria-label="Call" title="Call">📞</a>' : '')
      + (wa.length === 10 ? '<a class="fc-btn wa" href="https://wa.me/91' + wa + '?text=' + encodeURIComponent('नमस्ते, DukanList पर आपकी दुकान ' + (b.name || f.name) + ' देखी।') + '" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp">💬</a>' : '');
    var body = '<div class="fc-th">' + (photo ? '<img src="' + esc(thumb(photo)) + '" alt="" loading="lazy" width="72" height="72">' : esc(icon)) + '</div>'
      + '<div class="fc-mid"><div class="fc-n">' + esc((b && b.name) || f.name) + '</div>'
      + (bits.length ? '<div class="fc-l2">' + bits.join('<span>·</span>') + '</div>' : '')
      + '<div class="fc-l3">' + (city ? '📍 ' + esc(city) : '') + (role ? ' ' + role : '') + '</div></div>';
    return '<div class="pv-fc">' + (f.slug ? '<a class="fc-main" href="/' + encodeURIComponent(f.slug) + '">' + body + '</a>' : '<div class="fc-main">' + body + '</div>')
      + (acts ? '<div class="fc-acts">' + acts + '</div>' : '') + '</div>';
  }
  function enrichFirms(firms){
    var slugs = firms.map(function(f){ return f.slug; }).filter(function(x){ return x && /^[a-z0-9-]+$/.test(x); });
    var C = (window.DL_CONFIG || {}).supabase; if (!slugs.length || !C) return;
    var H = { apikey: C.anon_key, Authorization: 'Bearer ' + C.anon_key };
    var sel = 'slug,name,photos,rating_avg,rating_count,mobile,whatsapp,verified_visit,verified_score,is_professional_listing,professional_tier,category_id,sub_category_id,geo_cities(name)';
    fetch(C.url + '/rest/v1/businesses?status=eq.active&slug=in.(' + slugs.join(',') + ')&select=' + encodeURIComponent(sel), { headers: H })
      .then(function(r){ return r.ok ? r.json() : []; })
      .then(function(list){
        if (!list || !list.length) return;
        var ids = []; list.forEach(function(b){ var c = b.sub_category_id || b.category_id; if (c && ids.indexOf(c) === -1) ids.push(c); });
        var catP = ids.length ? fetch(C.url + '/rest/v1/categories?id=in.(' + ids.join(',') + ')&select=id,name,icon', { headers: H }).then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; }) : Promise.resolve([]);
        return catP.then(function(cats){
          var cm = {}; (cats || []).forEach(function(c){ cm[c.id] = c; });
          var bm = {}; list.forEach(function(b){ var c = cm[b.sub_category_id || b.category_id]; if (c){ b.cat_name = c.name; b.cat_icon = c.icon; } bm[b.slug] = b; });
          var el = document.getElementById('pvFirms'); if (!el) return;
          el.innerHTML = firms.map(function(f){ return firmCard(f, f.slug ? bm[f.slug] : null); }).join('');
        });
      }).catch(function(){});
  }
  // v388: "Save contact" — a vCard the phone adds to its contacts (only when the person shows their number)
  function vEsc(x){ return String(x || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, ' '); }
  function saveContact(p){
    var m = String(p.mobile || '').replace(/\D/g, '').slice(-10); if (m.length !== 10) return;
    var firm = (p.firms || [])[0];
    var v = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + vEsc(p.name), 'N:' + vEsc(p.name) + ';;;;', 'TEL;TYPE=CELL:+91' + m]
      .concat(firm ? ['ORG:' + vEsc(firm.name)] : []).concat(p.profession ? ['TITLE:' + vEsc(p.profession)] : [])
      .concat(['URL:' + location.origin + '/parivar/' + p.slug, 'NOTE:' + vEsc('Dabwali Parivar — DukanList'), 'END:VCARD']).join('\r\n');
    var name = String(p.name || 'contact').replace(/[^A-Za-z0-9\u0900-\u097F ]+/g, '').trim().replace(/\s+/g, '-') || 'contact';
    try {
      var blob = new Blob([v], { type: 'text/vcard;charset=utf-8' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name + '.vcf'; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    } catch(_){ location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(v); }
  }
  function shareProfile(p){
    var url = location.origin + '/parivar/' + p.slug;
    var line = [p.profession, (p.firms || [])[0] && p.firms[0].name].filter(Boolean).join(' · ');
    var text = p.name + (line ? ' — ' + line : '') + '\nडबवाली परिवार (DukanList) पर देखें: ' + url;
    if (navigator.share){ navigator.share({ title: p.name, text: text, url: url }).catch(function(){}); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }
  if (!slug){ notFound(); return; }
  PV.rpc('parivar_get_person', { p_slug: slug }).then(function(p){
    if (!p){ notFound(); return; }
    document.title = p.name + ' — Dabwali Parivar | DukanList';
    // verified people (they confirmed their own number) may be indexed; others stay out of search engines
    if (p.verified){ var mr = document.getElementById('metaRobots'); if (mr) mr.setAttribute('content', 'index, follow'); }
    var cur = (p.roles || []).filter(function(r){ return r.current; }), order = [];
    var past = (p.roles || []).filter(function(r){ return !r.current && r.role !== 'member'; });
    var sub = [];
    if (p.profession) sub.push('<b style="color:var(--ink-2)">' + esc(p.profession) + '</b>');
    if (p.city) sub.push(esc(p.city));
    // v388: only the positive label — "added by an organisation" read as a weakness
    if (p.verified) sub.push('<span class="pv-ok">✓ ' + bi('Verified', 'वेरिफाइड') + '</span>');
    var h = '<div class="pv-box"><div class="pv-head">' + PV.avatar(p.photo, p.name, 64)
      + '<div><h1>' + esc(p.name) + '</h1>' + (p.name_hi ? '<div class="sub">' + esc(p.name_hi) + '</div>' : '')
      + '<div class="sub">' + sub.join(' · ') + '</div>' + idLine(p, cur) + '</div></div>'
      + (p.bio ? '<p style="margin:12px 0 0;color:var(--ink-2);line-height:1.55">' + esc(p.bio) + '</p>' : '')
      + PV.contactHtml(p.contact_mode, p.mobile, p.name)
      + '<div class="pv-acts pv-acts2">'
      + (p.contact_mode === 'show' && p.mobile ? '<button type="button" class="pv-btn pv-call" id="pvSave">📇 ' + bi('Save contact', 'कॉन्टैक्ट सेव करें') + '</button>' : '')
      + '<button type="button" class="pv-btn pv-call" id="pvShare">🔗 ' + bi('Share profile', 'प्रोफ़ाइल भेजें') + '</button></div>'
      + '</div>';
    if ((p.firms || []).length){
      h += '<h2 class="pv-h2">' + bi('Firms', 'फर्में') + '</h2><div class="pv-fcs" id="pvFirms">' + p.firms.map(function(f){ return firmCard(f, null); }).join('') + '</div>';
    }
    if (cur.length){
      // v388: "Member of", one row per organisation (office position first), logo, session, member since
      var byOrg = {};
      cur.forEach(function(r){ var k = r.org_slug; if (!byOrg[k]){ byOrg[k] = r; order.push(k); } else if (byOrg[k].role === 'member' && r.role !== 'member') byOrg[k] = r; });
      var nowY = new Date().getFullYear();
      h += '<h2 class="pv-h2">' + bi('Member of', 'इन संस्थाओं से जुड़े हैं') + '</h2>' + order.map(function(k){
        var r = byOrg[k], off = r.role !== 'member';
        var meta = (off ? PV.roleHtml(r.role, r.role_label) + ' ' + esc(r.session) : bi('Session', 'सत्र') + ' ' + esc(r.session))
          + (r.since && r.since < parseInt(r.session, 10) ? ' · ' + bi('Member since', 'सदस्य') + ' ' + esc(r.since) + (nowY - r.since >= 2 ? ' (' + (nowY - r.since) + ' ' + bi('yrs', 'साल') + ')' : '') : '');
        return '<a class="pv-row pv-orow" href="/sanstha/' + encodeURIComponent(r.org_slug) + '">' + PV.logo(r.org_logo || null, r.org, 44)
          + '<div style="flex:1;min-width:0"><div class="n">' + esc(r.org) + '</div><div class="m">' + meta + '</div></div>'
          + '<span class="pv-role' + (off ? '' : ' m') + '">' + PV.roleHtml(r.role, r.role_label) + '</span></a>';
      }).join('');
      h += '<div id="pvEv" style="display:none"></div>';
    }
    if (past.length){
      h += '<div class="pv-past">' + bi('Earlier: ', 'पहले: ') + past.map(function(r){
        return PV.roleHtml(r.role, r.role_label) + ', <a href="/sanstha/' + encodeURIComponent(r.org_slug) + '">' + esc(r.org) + '</a> (' + esc(r.session) + ')';
      }).join(' · ') + '</div>';
    }
    if (!(p.firms || []).length && !cur.length && !past.length){
      h += '<div class="pv-empty">' + bi('No firms or organisations added yet.', 'अभी कोई फर्म या संस्था नहीं जोड़ी गई।') + '</div>';
    }
    // v388: "Is this you?" — straight to the helpline on WhatsApp with this page's link
    var help = ((window.DL_CONFIG || {}).support || {}).whatsapp || '';
    var claim = 'नमस्ते, डबवाली परिवार पर मेरा पेज है: ' + location.origin + '/parivar/' + p.slug + '\nमुझे अपनी फोटो और जानकारी ठीक करने का लिंक भेज दीजिए।';
    h += '<div class="pv-claim"><div><b>' + bi('Is this you?', 'यह आप हैं?') + '</b><div class="pv-note">' + bi('Add your photo, fix your details or choose how your number shows.', 'अपनी फोटो लगाइए, जानकारी ठीक कीजिए या चुनिए कि आपका नंबर कैसे दिखे।') + '</div></div>'
      + (help ? '<a class="pv-btn pv-wa" style="flex:0 0 auto" target="_blank" rel="noopener" href="https://wa.me/91' + help + '?text=' + encodeURIComponent(claim) + '">💬 ' + bi('Update my page', 'मेरा पेज ठीक करवाएं') + '</a>'
             : '<a class="pv-btn pv-call" style="flex:0 0 auto" href="/contact">' + bi('Contact us', 'संपर्क करें') + '</a>') + '</div>';
    root.innerHTML = h;
    enrichFirms(p.firms || []);
    var sv = document.getElementById('pvSave'); if (sv) sv.onclick = function(){ saveContact(p); };
    var sh = document.getElementById('pvShare'); if (sh) sh.onclick = function(){ shareProfile(p); };
    // upcoming events of their organisations
    if (window.PVE && order && order.length) PVE.load().then(function(ev){
      ev = ev.filter(function(e){ return order.indexOf(e.org_slug) !== -1; });
      PVE.strip(document.getElementById('pvEv'), ev);
    });
  }).catch(function(){ root.innerHTML = '<div class="pv-empty">' + bi('Could not load — try again.', 'लोड नहीं हुआ — फिर कोशिश करें।') + '</div>'; });
})();
</script>
