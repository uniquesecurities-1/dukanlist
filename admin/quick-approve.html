<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Quick Approve — DukanList Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;color:#0F172A;padding:20px;line-height:1.5}
  .container{max-width:1100px;margin:0 auto}
  h1{font-size:24px;font-weight:800;margin-bottom:6px}
  .sub{color:#64748b;margin-bottom:18px;font-size:14px}
  .nav{margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap}
  .nav a{padding:8px 14px;background:#0F172A;color:white;text-decoration:none;border-radius:8px;font-size:13px;font-weight:600}
  .nav a:hover{background:#1E293B}
  .diag{background:white;border:1.5px solid #E2E8F0;border-radius:10px;padding:14px 18px;margin-bottom:18px;font-size:13px;line-height:1.7}
  .diag b{color:#0F172A}
  .err-box{background:#FEF2F2;border-left:3px solid #DC2626;padding:10px 14px;border-radius:6px;margin-top:8px;color:#991B1B}
  .ok-box{background:#F0FDF4;border-left:3px solid #16A34A;padding:10px 14px;border-radius:6px;margin-top:8px;color:#166534}
  table{width:100%;background:white;border-collapse:collapse;border-radius:10px;overflow:hidden;border:1px solid #E2E8F0}
  th{background:#F1F5F9;padding:10px;text-align:left;font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em}
  td{padding:12px 10px;border-top:1px solid #F1F5F9;font-size:13px;vertical-align:top}
  .status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase}
  .status-pending{background:#FEF3C7;color:#92400E}
  .status-active{background:#DCFCE7;color:#166534}
  .status-banned{background:#FEE2E2;color:#991B1B}
  .status-flagged{background:#FFEDD5;color:#9A3412}
  .btn{padding:6px 12px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:4px;margin-bottom:4px}
  .btn-approve{background:#16A34A;color:white}
  .btn-approve:hover{background:#15803D}
  .btn-reject{background:#EF4444;color:white}
  .btn-reject:hover{background:#DC2626}
  .btn-delete{background:#7F1D1D;color:white}
  .btn-delete:hover{background:#450A0A}
  .btn-wa{background:#25D366;color:white}
  .btn-wa:hover{background:#128C7E}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .loader{text-align:center;padding:40px;color:#64748b}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:8px;color:white;font-weight:600;font-size:14px;z-index:1000;display:none}
  .toast.show{display:block}
  .toast.success{background:#16A34A}
  .toast.error{background:#DC2626}
  .filter-bar{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filter-bar select{padding:8px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:13px;background:white}
</style>

<!-- Premium banking-class polish — shared CSS file applied site-wide. Load LAST so it overrides earlier inline styles. -->
<link rel="stylesheet" href="/assets/css/admin-premium.css">
<!-- Admin error monitor (auto-injected) -->
<script src="/assets/js/admin-error-monitor.js"></script>
</head>
<body>

<div class="container">
  <h1>⚡ Quick Approve Panel</h1>
  <p class="sub">Barebones admin panel — direct database queries, no fancy abstractions.</p>

  <div class="nav">
    <a href="/admin/dashboard">📊 Dashboard</a>
    <a href="/admin/moderation">⚖️ Full Moderation</a>
    <a href="/admin/professional-verify.html">🛡 Professional</a>
    <a href="/admin/health.html" style="background:linear-gradient(135deg,#FF6B1A,#EA580C);color:#fff;font-weight:800;border-radius:8px">🛡 Health</a>
    <a href="/admin/pucho-moderation.html">💬 Pucho Bhai</a>
    <a href="/admin/bulk-upload">📥 Bulk Add</a>
    <a href="/admin/admins">👥 Admins</a>
    <a href="#" onclick="logout();return false" style="background:#DC2626">⎋ Logout</a>
    <a href="#" onclick="loadAll();return false" style="background:#6366F1">🔄 Refresh</a>
  </div>

  <div id="diagPanel" class="diag">Loading diagnostic info...</div>

  <div class="filter-bar">
    <label><b>Show:</b></label>
    <select id="statusFilter" onchange="loadAll()">
      <option value="pending" selected>⏳ Pending (need approval)</option>
      <option value="active">✅ Active (live)</option>
      <option value="banned">🚫 Banned/Rejected</option>
      <option value="flagged">🚩 Flagged</option>
      <option value="">📋 All statuses</option>
    </select>
    <span id="resultCount" style="margin-left:auto;color:#64748b;font-size:13px"></span>
  </div>

  <div id="shopList"><div class="loader">Loading shops...</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script>
'use strict';
let C = null;
let CURRENT_USER = null;

async function init(){
  C = ShopDB.client;
  if (!C){
    document.getElementById('diagPanel').innerHTML = '<b style="color:#DC2626">⚠ Supabase client missing</b>';
    return;
  }

  // Get user
  const { data: u, error: uErr } = await C.auth.getUser();
  if (uErr || !u || !u.user){
    document.getElementById('diagPanel').innerHTML =
      '<b style="color:#DC2626">⚠ Not logged in.</b> <a href="/admin/login">Login here</a>';
    return;
  }
  CURRENT_USER = u.user;

  // Show diagnostic info
  await fillDiag();

  // Load default tab (pending)
  await loadAll();
}

async function fillDiag(){
  const panel = document.getElementById('diagPanel');

  // is_admin check
  let isAdminRes = '—';
  try {
    const { data, error } = await C.rpc('is_admin');
    isAdminRes = error ? ('<span style="color:#DC2626">error: ' + error.message + '</span>') : (data ? '<span style="color:#16A34A">YES ✓</span>' : '<span style="color:#DC2626">NO ✗</span>');
  } catch(e){ isAdminRes = 'EXCEPTION: ' + e.message; }

  // admin_users row
  let myRow = '—';
  try {
    const { data, error } = await C.from('admin_users')
      .select('role, email, display_name, assigned_city_ids')
      .eq('auth_user_id', CURRENT_USER.id)
      .maybeSingle();
    if (error) myRow = '<span style="color:#DC2626">error: ' + error.message + '</span>';
    else if (!data) myRow = '<span style="color:#DC2626">NO ROW in admin_users — you are not an admin</span>';
    else myRow = '<b>role:</b> ' + data.role + ' · <b>cities:</b> ' + (data.assigned_city_ids ? '[' + data.assigned_city_ids.join(',') + ']' : 'NULL (all)');
  } catch(e){ myRow = 'EXCEPTION: ' + e.message; }

  // count by status
  let counts = '—';
  try {
    const { data, error } = await C.from('businesses').select('status');
    if (error){ counts = '<span style="color:#DC2626">error: ' + error.message + '</span>'; }
    else {
      const tally = {};
      (data || []).forEach(b => { tally[b.status] = (tally[b.status]||0)+1; });
      counts = Object.entries(tally).map(([k,v]) => k + '=' + v).join(' · ') || 'no businesses';
      counts += ' · <b>total: ' + (data?.length || 0) + '</b>';
    }
  } catch(e){ counts = 'EXCEPTION: ' + e.message; }

  panel.innerHTML = `
    <div><b>👤 Logged in:</b> ${CURRENT_USER.email || '?'} <code style="background:#F1F5F9;padding:1px 5px;border-radius:3px;font-size:11px">${(CURRENT_USER.id||'').slice(0,8)}...</code></div>
    <div><b>🛡 is_admin() returns:</b> ${isAdminRes}</div>
    <div><b>📜 Your admin_users row:</b> ${myRow}</div>
    <div><b>📊 DB business counts:</b> ${counts}</div>
  `;
}

async function loadAll(){
  const status = document.getElementById('statusFilter').value;
  const list = document.getElementById('shopList');
  list.innerHTML = '<div class="loader">Loading shops...</div>';

  // DIRECT QUERY — no RPC, no scope filter, just raw data
  let q = C.from('businesses')
    .select('id, name, owner_name, mobile, whatsapp, status, pincode, city_id, created_at, geo_cities(name)')
    .order('created_at', { ascending: false });
  if (status) q = q.eq('status', status);

  const { data, error } = await q;
  if (error){
    list.innerHTML = '<div class="err-box"><b>Query failed:</b> ' + escapeHtml(error.message) + '<br><br>Possible: RLS policy denying you. Make sure you are admin.</div>';
    return;
  }

  document.getElementById('resultCount').textContent = (data?.length || 0) + ' shop(s) found';

  if (!data || !data.length){
    list.innerHTML = '<div class="ok-box"><b>🎉 No shops in this status</b></div>';
    return;
  }

  list.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Shop / Owner</th>
          <th>Mobile</th>
          <th>City / Pincode</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(b => row(b)).join('')}
      </tbody>
    </table>
  `;
}

function row(b){
  const city = (b.geo_cities && b.geo_cities.name) ? b.geo_cities.name : ('city_id:' + b.city_id);
  const wa = (b.whatsapp || b.mobile || '').replace(/[^\d]/g,'');
  const tenDig = wa.length === 12 && wa.startsWith('91') ? wa.slice(2) : wa;
  const fullWa = wa.length === 10 ? '91' + wa : wa;
  const waMsg = encodeURIComponent('Namaste ' + (b.owner_name || '') + ' ji! DukanList se verify call.');
  const waLink = 'https://wa.me/' + fullWa + '?text=' + waMsg;

  return `
    <tr id="row-${b.id}">
      <td>
        <b>${escapeHtml(b.name || '?')}</b><br>
        <span style="color:#64748b;font-size:12px">👤 ${escapeHtml(b.owner_name || '—')}</span>
      </td>
      <td><code style="font-size:12px">${escapeHtml(b.mobile || '—')}</code></td>
      <td>${escapeHtml(city)}<br><small style="color:#94a3b8">${escapeHtml(b.pincode || '')}</small></td>
      <td><span class="status status-${b.status}">${b.status}</span></td>
      <td><small>${new Date(b.created_at).toLocaleString('en-IN', { dateStyle:'short', timeStyle:'short' })}</small></td>
      <td>
        ${b.status === 'pending' ? `<button class="btn btn-approve" onclick="quickApprove('${b.id}','${escapeJs(b.name)}')">✓ Approve</button>` : ''}
        ${b.status !== 'banned' ? `<button class="btn btn-reject" onclick="quickReject('${b.id}','${escapeJs(b.name)}')">✕ Ban</button>` : ''}
        <a class="btn btn-wa" href="${waLink}" target="_blank">💬 WA</a>
        <button class="btn btn-delete" onclick="quickDelete('${b.id}','${escapeJs(b.name)}')">🗑 Delete</button>
      </td>
    </tr>
  `;
}

async function quickApprove(id, name){
  if (!confirm('Approve "' + name + '" and make it LIVE?')) return;
  // Direct UPDATE (bypasses RPC scope check — using table directly with RLS)
  const { error } = await C.from('businesses')
    .update({ status: 'active', verified_visit: true })
    .eq('id', id);
  if (error){ toast('Approve failed: ' + error.message, 'error'); return; }
  toast('✓ ' + name + ' approved & LIVE', 'success');
  document.getElementById('row-' + id)?.remove();
  await fillDiag();
}

async function quickReject(id, name){
  // Capture rejection reason (MUST provide one) for audit trail
  const reason = prompt('Reason for banning "' + name + '"?\n(min 5 chars — logged for audit)');
  if (reason === null) return; // cancelled
  if (!reason || reason.trim().length < 5){
    toast('Reason is required (min 5 chars)', 'error');
    return;
  }
  if (!confirm('Confirm BAN "' + name + '"?\n\nReason: ' + reason.trim() + '\n\n(Soft delete — reversible from shop detail page)')) return;
  // Try to log reason in admin_notes via admin_update_shop (best-effort)
  try {
    await C.rpc('admin_update_shop', {
      p_business_id: id,
      p_patch: { admin_notes: '[BAN-REASON ' + new Date().toISOString() + '] ' + reason.trim() }
    });
  } catch(_){}
  const { error } = await C.from('businesses').update({ status: 'banned' }).eq('id', id);
  if (error){ toast('Ban failed: ' + error.message, 'error'); return; }
  toast('✕ ' + name + ' banned', 'success');
  document.getElementById('row-' + id)?.remove();
  await fillDiag();
}

async function quickDelete(id, name){
  if (!confirm('PERMANENTLY DELETE "' + name + '"?\n\nThis cannot be undone.\nType the shop name in next dialog to confirm.')) return;
  const typed = prompt('Type the exact shop name to confirm:');
  if (typed !== name){ toast('Name mismatch — delete cancelled', 'error'); return; }
  const { error } = await C.from('businesses').delete().eq('id', id);
  if (error){ toast('Delete failed: ' + error.message, 'error'); return; }
  toast('🗑 ' + name + ' permanently deleted', 'success');
  document.getElementById('row-' + id)?.remove();
  await fillDiag();
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeJs(s){
  return String(s||'').replace(/['"\\]/g, '\\$&');
}
function toast(msg, kind){
  const t = document.getElementById('toast');
  t.className = 'toast show ' + (kind || 'success');
  t.textContent = msg;
  setTimeout(() => t.classList.remove('show'), 3500);
}
async function logout(){
  await C.auth.signOut();
  window.location.href = '/admin/login';
}

init().catch(e => {
  document.getElementById('diagPanel').innerHTML = '<b style="color:#DC2626">init crashed:</b> ' + e.message;
});
</script>
<script src="/assets/js/admin-auto-logout.js"></script>
</body>
</html>
