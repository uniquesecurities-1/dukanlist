<style>
  body { background:#F8FAFC; font-family:'Manrope',sans-serif }
  .admin-nav { background:#0F172A; color:#fff; padding:12px 24px; display:flex;gap:16px;align-items:center;flex-wrap:wrap }
  .admin-nav a { color:#cbd5e1; text-decoration:none; font-weight:600; font-size:14px; padding:6px 10px; border-radius:6px }
  .admin-nav a.active, .admin-nav a:hover { background:#1E293B; color:#fff }
  .admin-nav .logo { font-weight:800; color:#fff; font-size:18px }
  .admin-nav .badge { background:#7C3AED; color:#fff; font-size:10px; padding:2px 7px; border-radius:99px; font-weight:800 }
  .wrap { max-width:1200px; margin:24px auto; padding:0 20px }
  h1 { font-size:1.8rem; font-weight:800; margin:0 0 6px; color:#0F172A }
  .sub { color:#64748b; margin:0 0 18px }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px }
  .chip { background:#F1F5F9; color:#475569; border:none; padding:7px 14px; border-radius:99px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit }
  .chip.active { background:#1E3A8A; color:#fff }
  .rev-card { background:#fff; border:1px solid #E2E8F0; border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 2px rgba(15,23,42,.03) }
  .rev-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px }
  .rev-shop { font-size:13px; font-weight:700; color:#1E3A8A; text-decoration:none }
  .rev-shop:hover { text-decoration:underline }
  .rev-time { color:#94a3b8; font-size:11px }
  .stars { color:#F59E0B; font-size:14px; font-weight:700; margin-right:6px }
  .customer { font-size:12px; color:#475569; font-weight:700 }
  .rev-text { font-size:13px; color:#334155; line-height:1.5; margin:6px 0 }
  .rev-actions { display:flex; gap:6px; margin-top:8px }
  .rev-actions button { padding:5px 11px; border-radius:6px; border:none; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit }
  .badge-flagged { background:#FEE2E2; color:#991B1B; font-size:10px; padding:2px 6px; border-radius:4px; font-weight:800; margin-left:6px }
  .toast { position:fixed; bottom:24px; right:24px; background:#0F172A; color:#fff; padding:11px 18px; border-radius:8px; font-size:13px; font-weight:600; z-index:1000; opacity:0; transition:opacity .2s }
  .toast.show { opacity:1 }
  .err { background:#FEF2F2; color:#B91C1C; padding:10px 14px; border-radius:9px; font-size:13px; font-weight:600; margin-bottom:14px }
</style>

<!-- Premium banking-class polish — shared CSS file applied site-wide. Load LAST so it overrides earlier inline styles. -->
<link rel="stylesheet" href="/assets/css/admin-premium.css">

<script src="/assets/js/admin-error-monitor.js"></script>

</head>
<body>

<nav class="admin-nav">
  <span class="logo">DukanList <span class="badge">ADMIN</span></span>
  <a href="/admin/dashboard.html">Dashboard</a>
  <a href="/admin/moderation.html">Moderation</a>
  <a href="/admin/health.html" style="background:linear-gradient(135deg,#FF6B1A,#EA580C);color:#fff;font-weight:800;border-radius:8px">🛡 Health</a>
  <a href="/admin/categories.html">Categories</a>
  <a href="/admin/cities.html">Cities</a>
  <a href="/admin/reviews.html" class="active">Reviews</a>
  <a href="/admin/announcements.html">Announcements</a>
  <a href="/admin/pucho-moderation.html">Pucho Bhai</a>
  <a href="/admin/golden-pages-manage.html" style="background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#7c2d12;font-weight:800;padding:6px 10px;border-radius:6px;text-decoration:none">🥇 Golden Pages</a> <a href="/admin/owner-invites.html" style="background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;font-weight:800;padding:6px 11px;border-radius:7px;text-decoration:none">📧 Owner Invites</a>
  <a href="/admin/settings.html">⚙️ Settings</a>
  <a href="javascript:logout()" style="margin-left:auto">Logout</a>
</nav>

<div class="wrap">
  <h1>⭐ Site-Wide Reviews</h1>
  <p class="sub">Moderate reviews across all shops. Edit typos, remove spam, handle flagged content.</p>

  <div id="err" class="err" style="display:none"></div>

  <div class="toolbar">
    <button class="chip active" data-filter="all" onclick="setFilter('all')">All Reviews</button>
    <button class="chip" data-filter="recent" onclick="setFilter('recent')">📅 Last 7 days</button>
    <button class="chip" data-filter="low" onclick="setFilter('low')">⚠️ Low (1-2★)</button>
    <button class="chip" data-filter="flagged" onclick="setFilter('flagged')">🚩 Flagged</button>
    <button class="chip" data-filter="pending" onclick="setFilter('pending')" style="background:#FEF3C7;color:#92400E">
      🛑 Spam Hold <span id="pendingCountBadge" style="background:#DC2626;color:#fff;border-radius:99px;padding:1px 8px;margin-left:4px;font-size:10px;display:none">0</span>
    </button>
  </div>

  <div id="list"><div style="padding:40px;text-align:center;color:#94a3b8">Loading reviews…</div></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script src="/assets/js/admin-common.js"></script>
<script>AdminCommon.requireAdmin();</script>
<script>
'use strict';
const c = ShopDB.client;
let CURRENT_FILTER = 'all';

function toast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#DC2626' : '#0F172A';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function logout(){ c.auth.signOut().then(()=>location.href='/admin/login.html'); }
function timeAgo(iso){
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  if (s<86400*7) return Math.floor(s/86400)+'d ago';
  return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

async function init(){
  const { data: { session } } = await c.auth.getSession();
  if (!session) { location.href = '/admin/login.html'; return; }
  const { data: isAdm } = await c.rpc('is_admin');
  if (!isAdm) { alert('Admin access required'); location.href='/'; return; }
  loadReviews();
  refreshPendingBadge();
}

// Refresh the red badge on the "Spam Hold" chip showing current pending count
async function refreshPendingBadge(){
  try {
    const { data: cnt, error } = await c.rpc('admin_pending_reviews_count');
    if (error) return;
    const badge = document.getElementById('pendingCountBadge');
    if (!badge) return;
    if (cnt && cnt > 0){
      badge.textContent = cnt;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  } catch(_){ /* silent — RPC not deployed yet */ }
}

function setFilter(f){
  CURRENT_FILTER = f;
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  loadReviews();
}

async function loadReviews(){
  document.getElementById('list').innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8">Loading…</div>';
  // Pending queue uses a dedicated RPC so we can show hash_recent_count + approve/reject buttons
  if (CURRENT_FILTER === 'pending'){
    return loadPendingReviews();
  }
  try {
    const { data, error } = await c.rpc('admin_list_all_reviews', {
      p_limit: 100, p_offset: 0, p_filter: CURRENT_FILTER, p_min_rating: null
    });
    if (error) throw error;
    render(data || []);
  } catch(e){
    document.getElementById('err').textContent = 'Failed: ' + e.message + ' (Run db/67 in Supabase if RPC missing)';
    document.getElementById('err').style.display = 'block';
    document.getElementById('list').innerHTML = '';
  }
}

// Pending (rate-limited) reviews — held when same phone submitted 5+ in 24h
async function loadPendingReviews(){
  try {
    const { data, error } = await c.rpc('admin_pending_reviews', { p_limit: 100, p_offset: 0 });
    if (error) throw error;
    renderPending(data || []);
  } catch(e){
    document.getElementById('err').textContent = 'Failed to load held reviews: ' + e.message + ' (deploy db/156)';
    document.getElementById('err').style.display = 'block';
    document.getElementById('list').innerHTML = '';
  }
}

function renderPending(rows){
  document.getElementById('err').style.display = 'none';
  if (!rows.length){
    document.getElementById('list').innerHTML =
      '<div style="padding:40px;text-align:center;color:#94a3b8">'
      + '✅ No held reviews. Everything\'s clean.'
      + '</div>';
    return;
  }
  document.getElementById('list').innerHTML = rows.map(r => {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const spamRisk = (r.hash_recent_count >= 8)
      ? '<span style="background:#7F1D1D;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;margin-left:8px">🚨 HIGH RISK</span>'
      : (r.hash_recent_count >= 5)
        ? '<span style="background:#F59E0B;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:800;margin-left:8px">⚠ ' + r.hash_recent_count + ' in 24h</span>'
        : '';
    const hashShort = (r.customer_phone_hash || '').slice(0,12) + '…';
    return '<div class="rev-card" style="border-left:4px solid #F59E0B">'
      + '<div class="rev-head">'
        + '<div>'
          + '<a class="rev-shop" href="/admin/shop.html?id=' + esc(r.business_id) + '" target="_blank">🏪 ' + esc(r.business_name) + '</a>'
          + spamRisk
        + '</div>'
        + '<span class="rev-time">' + timeAgo(r.created_at) + '</span>'
      + '</div>'
      + '<div><span class="stars">' + stars + '</span>'
        + '<span class="customer">' + esc(r.customer_name || 'Anonymous') + '</span>'
        + '<span style="color:#94a3b8;font-size:10px;margin-left:8px;font-family:monospace" title="' + esc(r.customer_phone_hash) + '">hash:' + hashShort + '</span>'
      + '</div>'
      + '<div class="rev-text">' + esc(r.text || '(empty)') + '</div>'
      + '<div class="rev-actions">'
        + '<button style="background:#10B981;color:#fff" onclick="approvePending(\'' + esc(r.review_id) + '\')">✓ Approve</button>'
        + '<button style="background:#EF4444;color:#fff" onclick="rejectPending(\'' + esc(r.review_id) + '\')">✗ Reject (spam)</button>'
        + '<a href="/admin/shop.html?id=' + esc(r.business_id) + '" target="_blank" style="background:#F1F5F9;color:#475569;text-decoration:none;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700">View Shop →</a>'
      + '</div>'
    + '</div>';
  }).join('');
}

async function approvePending(id){
  try {
    const { error } = await c.rpc('admin_approve_pending_review', { p_review_id: id });
    if (error) throw error;
    toast('✓ Approved — now live');
    loadPendingReviews();
    refreshPendingBadge();
  } catch(e){ alert('Approve failed: ' + e.message); }
}

async function rejectPending(id){
  if (!confirm('Reject this review as spam? It will not be shown publicly.')) return;
  try {
    const { error } = await c.rpc('admin_reject_pending_review', { p_review_id: id });
    if (error) throw error;
    toast('✓ Rejected');
    loadPendingReviews();
    refreshPendingBadge();
  } catch(e){ alert('Reject failed: ' + e.message); }
}

function render(rows){
  if (!rows.length) {
    document.getElementById('list').innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8">No reviews match this filter.</div>';
    return;
  }
  document.getElementById('list').innerHTML = rows.map(r => {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const flagged = r.status === 'flagged' ? '<span class="badge-flagged">FLAGGED</span>' : '';
    const reply = r.owner_reply ? '<div style="margin-top:8px;padding:8px 11px;background:#F8FAFC;border-left:3px solid #1E3A8A;border-radius:5px;font-size:12px;color:#475569"><b>Owner reply:</b> ' + esc(r.owner_reply) + '</div>' : '';
    return '<div class="rev-card">'
      + '<div class="rev-head">'
        + '<div>'
          + '<a class="rev-shop" href="/admin/shop.html?id=' + esc(r.business_id) + '" target="_blank">🏪 ' + esc(r.business_name) + '</a>'
          + flagged
        + '</div>'
        + '<span class="rev-time">' + timeAgo(r.created_at) + '</span>'
      + '</div>'
      + '<div><span class="stars">' + stars + '</span>'
        + '<span class="customer">' + esc(r.customer_name || 'Anonymous') + '</span>'
        + (r.helpful_count > 0 ? '<span style="color:#94a3b8;font-size:11px;margin-left:8px">👍 ' + r.helpful_count + '</span>' : '')
      + '</div>'
      + '<div class="rev-text">' + esc(r.text) + '</div>'
      + reply
      + '<div class="rev-actions">'
        + '<button style="background:#EEF2FF;color:#3730A3" onclick="editReview(\'' + esc(r.id) + '\', ' + r.rating + ', ' + JSON.stringify(r.text || '').replace(/"/g,'&quot;') + ', ' + JSON.stringify(r.customer_name || '').replace(/"/g,'&quot;') + ')">✏️ Edit</button>'
        + '<button style="background:#FEE2E2;color:#991B1B" onclick="deleteReview(\'' + esc(r.id) + '\')">🗑 Delete</button>'
        + '<a href="/admin/shop.html?id=' + esc(r.business_id) + '" target="_blank" style="background:#F1F5F9;color:#475569;text-decoration:none;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700">View Shop →</a>'
      + '</div>'
    + '</div>';
  }).join('');
}

async function editReview(id, rating, text, name){
  const newRating = parseInt(prompt('New rating (1-5):', rating), 10);
  if (isNaN(newRating) || newRating < 1 || newRating > 5) return;
  const newText = prompt('New review text:', text);
  if (newText === null) return;
  const newName = prompt('Customer name (optional):', name || '');
  if (newName === null) return;
  try {
    const { error } = await c.rpc('admin_edit_review', {
      p_review_id: id, p_rating: newRating, p_text: newText, p_reviewer_name: newName
    });
    if (error) throw error;
    toast('✓ Updated'); loadReviews();
  } catch(e){ alert('Edit failed: ' + e.message); }
}

async function deleteReview(id){
  if (!confirm('Delete this review permanently?')) return;
  try {
    const { error } = await c.rpc('admin_delete_review', { p_review_id: id });
    if (error) throw error;
    toast('✓ Deleted'); loadReviews();
  } catch(e){ alert('Delete failed: ' + e.message); }
}

init();
</script>
<script src="/assets/js/admin-auto-logout.js"></script>
</body>
