<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Golden Pages Manage — DukanList Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans','Manrope',sans-serif;background:#FFFBEB;color:#0F172A;min-height:100vh;padding-bottom:60px}

  .topbar{background:linear-gradient(135deg,#78350F,#92400E);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-wrap:wrap;gap:10px}
  .topbar .brand{font-weight:900;font-size:1rem;display:flex;align-items:center;gap:8px}
  .topbar .badge{background:#FBBF24;color:#78350F;font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:5px;letter-spacing:.04em}
  .topbar a{color:#FED7AA;text-decoration:none;font-size:.85rem;font-weight:700}
  .topbar a:hover{color:#fff}
  .topbar nav{display:flex;gap:8px;flex-wrap:wrap}
  .topbar nav a{background:rgba(255,255,255,.1);padding:6px 11px;border-radius:7px;font-size:.78rem;font-weight:800}
  .topbar nav a.active{background:#FBBF24;color:#78350F}

  .container{max-width:1100px;margin:0 auto;padding:16px}

  /* Filter bar */
  .filters{background:#fff;border-radius:14px;padding:14px;border:1.5px solid #FDE68A;margin-bottom:14px;box-shadow:0 4px 12px rgba(217,119,6,.06)}
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .filters input, .filters select{padding:9px 12px;border:1.5px solid #FCD34D;border-radius:9px;font-family:inherit;font-size:.88rem;background:#FFFBEB;color:#0F172A;outline:0;min-width:120px}
  .filters input:focus, .filters select:focus{border-color:#D97706;background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.12)}
  .filters .search-input{flex:1;min-width:200px}
  .filter-chip{background:#FFFBEB;border:1.5px solid #FCD34D;color:#78350F;padding:7px 13px;border-radius:99px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:5px}
  .filter-chip:hover{background:#FEF3C7}
  .filter-chip.active{background:linear-gradient(135deg,#D97706,#92400E);color:#fff;border-color:transparent}

  /* Result count */
  .count-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px;flex-wrap:wrap;gap:8px}
  .count-bar .total{font-size:.92rem;color:#78350F;font-weight:800}
  .count-bar .actions{display:flex;gap:6px}
  .count-bar button{background:transparent;border:1.5px solid #FCD34D;color:#92400E;padding:6px 12px;border-radius:8px;font-weight:800;font-size:.78rem;cursor:pointer;font-family:inherit}
  .count-bar button:hover{background:#FEF3C7}

  /* Listing row */
  .list-grid{display:grid;gap:8px}
  .row{background:#fff;border:1.5px solid #FDE68A;border-radius:11px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;transition:.12s}
  .row:hover{border-color:#D97706;box-shadow:0 4px 12px rgba(217,119,6,.12)}

  .row-info{min-width:0}
  .row-name{font-size:1rem;font-weight:800;color:#0F172A;margin-bottom:4px;letter-spacing:-.01em}
  .row-name .hindi{font-weight:600;color:#92400E;font-size:.85rem;margin-left:6px}
  .row-meta{font-size:.78rem;color:#78350F;font-weight:600;margin-bottom:6px;line-height:1.5}
  .row-meta .sep{color:#FCD34D;margin:0 4px}
  .row-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .row-badge{font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
  .badge-ok{background:#D1FAE5;color:#065F46}
  .badge-mid{background:#FEF3C7;color:#92400E}
  .badge-warn{background:#FEE2E2;color:#991B1B}
  .badge-info{background:#DBEAFE;color:#1E3A8A}

  .row-actions{display:flex;gap:5px;flex-direction:column;align-items:stretch}
  .row-actions button, .row-actions a{
    padding:6px 11px;border-radius:7px;font-size:.74rem;font-weight:800;
    cursor:pointer;font-family:inherit;border:0;white-space:nowrap;
    text-decoration:none;text-align:center;transition:.12s;
  }
  .btn-edit{background:#EFF6FF;color:#1E3A8A;border:1px solid #BFDBFE}
  .btn-edit:hover{background:#DBEAFE}
  .btn-promote{background:linear-gradient(135deg,#10B981,#059669);color:#fff}
  .btn-promote:hover{background:linear-gradient(135deg,#059669,#047857)}
  .btn-view{background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
  .btn-view:hover{background:#FDE68A}
  .btn-del{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
  .btn-del:hover{background:#FECACA}
  .btn-verify-phone{background:linear-gradient(135deg,#1E40AF,#1E3A8A);color:#fff}
  .btn-verify-phone:hover{background:linear-gradient(135deg,#1E3A8A,#1E1B4B)}
  .btn-unverify-phone{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}
  .btn-unverify-phone:hover{background:#E2E8F0}
  .badge-verified{background:linear-gradient(135deg,#1E40AF,#1E1B4B);color:#fff}

  /* Pagination */
  .pager{display:flex;justify-content:center;gap:8px;margin-top:18px}
  .pager button{background:#fff;border:1.5px solid #FCD34D;color:#92400E;padding:8px 14px;border-radius:9px;font-weight:800;font-size:.85rem;cursor:pointer;font-family:inherit;transition:.15s}
  .pager button:hover:not(:disabled){background:#FEF3C7}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .info{display:flex;align-items:center;padding:0 8px;color:#78350F;font-weight:700;font-size:.85rem}

  /* Loading + empty */
  .loading{text-align:center;padding:50px 20px;color:#92400E}
  .loading .sp{display:inline-block;width:36px;height:36px;border:3.5px solid rgba(217,119,6,.2);border-top-color:#D97706;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
  .loading.hidden{display:none!important}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{background:#fff;border:1.5px dashed #FCD34D;border-radius:14px;padding:40px 20px;text-align:center;color:#92400E}
  .empty .ico{font-size:3rem;margin-bottom:10px}

  /* Edit modal — flex column with scrollable body + sticky footer
     so Save/Cancel buttons are ALWAYS visible regardless of content length */
  .modal-bd{position:fixed;inset:0;background:rgba(15,23,42,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px 16px;animation:fadeIn .25s}
  .modal-bd.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:18px;max-width:540px;width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.16,1,.3,1);box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;pointer-events:auto;position:relative;z-index:9001}
  .modal > h3{padding:20px 24px 12px;margin:0;flex-shrink:0;border-bottom:1px solid #F1F5F9;position:relative;z-index:2}
  .modal-body-scroll{flex:1;overflow-y:auto;padding:14px 24px 18px;min-height:0;position:relative;z-index:1}
  .modal-footer-fixed{flex-shrink:0;padding:14px 24px;border-top:1px solid #F1F5F9;background:#FAFAFA;box-shadow:0 -2px 8px rgba(15,23,42,.04);position:relative;z-index:2}
  @keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal h3{font-size:1.2rem;font-weight:900;color:#0F172A;margin-bottom:12px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between}
  .modal .close-x{background:#F1F5F9;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1;color:#64748B;font-family:inherit}
  .modal label{display:block;font-size:.74rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;margin-top:11px}
  .modal label .opt{color:#94A3B8;font-weight:600;text-transform:none;font-size:.7rem;margin-left:6px}
  .modal input, .modal textarea, .modal select{width:100%;padding:10px 12px;font-size:.92rem;border:1.5px solid #E2E8F0;border-radius:9px;font-family:inherit;outline:0;background:#FAFAFA;color:#0F172A}
  .modal input:focus, .modal textarea:focus, .modal select:focus{border-color:#D97706;background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.12)}
  .modal .city-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .modal .city-chip{background:#FFFBEB;border:1.5px solid #FCD34D;color:#78350F;padding:6px 11px;border-radius:99px;font-weight:800;font-size:.78rem;cursor:pointer;font-family:inherit}
  .modal .city-chip.active{background:linear-gradient(135deg,#D97706,#92400E);color:#fff;border-color:transparent}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0}
  .modal-actions .btn-cancel{background:#F1F5F9;color:#64748B;border:0;padding:12px;border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer}
  .modal-actions .btn-save{background:linear-gradient(135deg,#D97706,#92400E);color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(217,119,6,.3)}
  .modal-err{background:#FEE2E2;border-left:4px solid #DC2626;color:#991B1B;padding:10px 13px;border-radius:8px;font-size:.85rem;font-weight:600;margin-top:10px;display:none}
  .modal-err.show{display:block}

  /* Cat picker (inside modal — same UX as quick-add-shop) */
  .modal .cat-search-results{display:none;background:#fff;border:1.5px solid #E2E8F0;border-radius:10px;padding:5px;max-height:200px;overflow-y:auto;margin-top:5px}
  .modal .cat-search-results.show{display:block}
  .modal .cat-result-chip{width:100%;text-align:left;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:7px 10px;margin-bottom:3px;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:8px}
  .modal .cat-result-chip:hover{background:#FEF3C7;border-color:#D97706}
  .modal .cat-result-chip .slug-code{font-size:.65rem;color:#78350F;background:#fff;padding:1px 5px;border-radius:3px;font-family:monospace}

  .modal .selected-cats{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border:1.5px solid #D97706;border-radius:10px;padding:8px;margin-top:6px;display:none}
  .modal .selected-cats.show{display:block}
  .modal .sel-cat-row{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #FCD34D;border-radius:7px;padding:6px 10px;margin-bottom:4px;font-size:.82rem;font-weight:700;cursor:pointer}
  .modal .sel-cat-row.is-primary{background:linear-gradient(135deg,#FFF7ED,#FFE4B5);border-color:#F59E0B}
  .modal .sel-cat-row .x{background:#fff;border:1.5px solid #DC2626;color:#DC2626;width:22px;height:22px;border-radius:50%;font-weight:900;cursor:pointer;font-family:inherit;font-size:.85rem;line-height:1;margin-left:auto}

  /* Toast — pointer-events:none so it NEVER blocks clicks on modal/page below
     even when invisible (opacity:0 still hit-tests by default) */
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:#0F172A;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:400;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:#10B981}
  .toast.error{background:#DC2626}

  @media (max-width:560px){
    .row{grid-template-columns:1fr}
    .row-actions{flex-direction:row;flex-wrap:wrap}
  }
</style>

  <nav>

<div class="container">

<!-- Edit modal — fixed-height with scrollable body + sticky footer.
     This guarantees the Save/Cancel buttons are ALWAYS visible no matter
     how long the form gets or how small the viewport is. -->
<div class="modal-bd" id="editModal" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <h3>
      <span>✏️ Edit Listing</span>
      <button class="close-x" onclick="closeEdit()">✕</button>

<script>
'use strict';

let C;
let ALL_CATEGORIES = [];
let CITY_LIST = [];
let CURRENT_PAGE = 0;
const PAGE_SIZE = 25;
let CURRENT_FILTER = 'all';
let CURRENT_SEARCH = '';
let CURRENT_CITY_ID = null;
let CURRENT_CAT_SLUG = null;
let TOTAL_COUNT = 0;
let LIST_DATA = [];
let EDITING = null;       // {id, currentRow, selectedCats: [], cityId}

// ============================================================
// INIT
// ============================================================
async function init(){
  const user = await AdminCommon.requireAdmin();
  if (!user) return;
  C = ShopDB.client;

  await Promise.all([loadCategories(), loadCities()]);
  populateFilters();
  wireFilters();
  loadList();
}

async function loadCategories(){
  try {
    const { data } = await C.from('categories')
      .select('id, slug, name, name_hi, icon, parent_id, keywords')
      .eq('active', true)
      .order('sort_order', { ascending: true })
      .limit(500);
    const all = data || [];
    const byId = {}; all.forEach(c => byId[c.id] = c);
    ALL_CATEGORIES = all.map(c => ({
      id: c.id, slug: c.slug, name: c.name, name_hi: c.name_hi || '',
      icon: c.icon || '·',
      parent_name: c.parent_id && byId[c.parent_id] ? byId[c.parent_id].name : '',
      keywords: (c.keywords || '').toLowerCase()
    }));
  } catch(e){ console.warn('cats:', e); }
}

async function loadCities(){
  try {
    const { data } = await C.from('geo_cities').select('id, name').eq('active', true).limit(80);
    CITY_LIST = data || [];
  } catch(_){ CITY_LIST = []; }
}

function populateFilters(){
  const citySel = document.getElementById('cityFilter');
  CITY_LIST.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    citySel.appendChild(o);
  });
  const catSel = document.getElementById('catFilter');
  ALL_CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c.slug;
    o.textContent = c.icon + ' ' + c.name;
    catSel.appendChild(o);
  });
}

function wireFilters(){
  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      CURRENT_SEARCH = e.target.value.trim();
      CURRENT_PAGE = 0;
      loadList();
    }, 250);
  });
  document.getElementById('cityFilter').addEventListener('change', e => {
    CURRENT_CITY_ID = e.target.value ? parseInt(e.target.value, 10) : null;
    CURRENT_PAGE = 0;
    loadList();
  });
  document.getElementById('catFilter').addEventListener('change', e => {
    CURRENT_CAT_SLUG = e.target.value || null;
    CURRENT_PAGE = 0;
    loadList();
  });
  document.querySelectorAll('.filter-chip').forEach(ch => {
    ch.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      ch.classList.add('active');
      CURRENT_FILTER = ch.dataset.filter;
      CURRENT_PAGE = 0;
      loadList();
    });
  });
  // Default to "all" chip active
  document.querySelector('.filter-chip[data-filter="all"]').classList.add('active');
}

// ============================================================
// LOAD LIST
// ============================================================
// Single helper. Uses CSS class (with !important) AND inline style — belt+suspenders.
function setLoading(on){
  const el = document.getElementById('loadingState');
  if (!el) return;
  if (on){
    el.classList.remove('hidden');
    el.style.display = '';
  } else {
    el.classList.add('hidden');
    el.style.display = 'none';
  }
}

async function loadList(){
  setLoading(true);
  document.getElementById('listGrid').innerHTML = '';
  document.getElementById('pager').style.display = 'none';

  const params = {
    p_city_id:        CURRENT_CITY_ID,
    p_category_slug:  CURRENT_CAT_SLUG,
    p_search:         CURRENT_SEARCH || null,
    p_only_no_mobile: CURRENT_FILTER === 'no-mobile',
    p_only_no_owner:  CURRENT_FILTER === 'no-owner',
    p_limit:          PAGE_SIZE,
    p_offset:         CURRENT_PAGE * PAGE_SIZE
  };

  try {
    const { data, error } = await C.rpc('admin_gp_list_all', params);
    if (error) throw error;
    LIST_DATA = data || [];
    TOTAL_COUNT = (LIST_DATA[0] && Number(LIST_DATA[0].total_count)) || 0;

    // Apply has-help filter client-side
    let display = LIST_DATA.slice();
    if (CURRENT_FILTER === 'has-help'){
      display = display.filter(r => (r.help_request_count || 0) > 0);
    }

    renderList(display);
    renderPager();
  } catch(e){
    document.getElementById('listGrid').innerHTML = '<div class="empty"><div class="ico">⚠️</div><h3>Could not load</h3><p>' + esc(e.message || 'Unknown') + '</p></div>';
  } finally {
    // Guaranteed hide — runs even if render throws, or RPC errors out
    setLoading(false);
  }
}

function renderList(rows){
  // Belt-and-suspenders: hide spinner whenever we're about to render anything.
  // Protects against any future code path that forgets to hide it.
  setLoading(false);

  document.getElementById('totalCount').textContent =
    TOTAL_COUNT === 0 ? 'No listings yet' :
    (TOTAL_COUNT === 1 ? '1 listing total' : TOTAL_COUNT + ' listings total');

  const grid = document.getElementById('listGrid');
  if (!rows.length){
    grid.innerHTML = '<div class="empty"><div class="ico">📭</div><h3>No matches</h3><p>Try different filters or search terms.</p></div>';
    return;
  }

  grid.innerHTML = rows.map(r => {
    const hasMobile = r.mobile && r.mobile.length === 10;
    const hasOwner = r.owner_name && r.owner_name.trim();
    const hasHelp = (r.help_request_count || 0) > 0;
    const addedAgo = timeAgo(r.pre_listed_at);

    const mobileVerified = !!r.mobile_verified;

    let badges = '';
    if (hasMobile){
      if (mobileVerified) badges += '<span class="row-badge badge-verified">✓ Phone Verified</span>';
      else                badges += '<span class="row-badge badge-ok">📱 Mobile</span>';
    } else {
      badges += '<span class="row-badge badge-mid">No mobile</span>';
    }
    if (hasOwner)   badges += '<span class="row-badge badge-ok">👤 Owner</span>';
    else            badges += '<span class="row-badge badge-mid">No owner</span>';
    if (r.name_hi)  badges += '<span class="row-badge badge-info">🌐 Hindi</span>';
    if (hasHelp)    badges += '<span class="row-badge badge-warn">📞 ' + r.help_request_count + ' request' + (r.help_request_count > 1 ? 's' : '') + '</span>';

    // Verify-Phone button only when listing HAS a mobile but not yet verified
    const verifyBtn = (hasMobile && !mobileVerified)
      ? '<button class="btn-verify-phone" onclick="setMobileVerified(\'' + esc(r.id) + '\',true,\'' + esc(r.name) + '\')">✓ Verify Phone</button>'
      : (hasMobile && mobileVerified
          ? '<button class="btn-unverify-phone" onclick="setMobileVerified(\'' + esc(r.id) + '\',false,\'' + esc(r.name) + '\')" title="Unverify phone (will mask publicly again)">↺ Unverify</button>'
          : '');

    return '<div class="row">' +
             '<div class="row-info">' +
               '<div class="row-name">🏪 ' + esc(r.name) +
                 (r.name_hi ? '<span class="hindi">· ' + esc(r.name_hi) + '</span>' : '') +
               '</div>' +
               '<div class="row-meta">' +
                 (r.category_icon || '·') + ' ' + esc(r.category_name || 'Uncategorised') +
                 (r.area ? '<span class="sep">·</span>📍 ' + esc(r.area) : '') +
                 (r.city_name ? '<span class="sep">·</span>' + esc(r.city_name) : '') +
                 '<span class="sep">·</span>' + esc(addedAgo) +
                 (r.owner_name ? '<span class="sep">·</span>👤 ' + esc(r.owner_name) : '') +
                 (r.mobile ? '<span class="sep">·</span>📞 ' + esc(r.mobile) : '') +
               '</div>' +
               '<div class="row-badges">' + badges + '</div>' +
             '</div>' +
             '<div class="row-actions">' +
               '<button class="btn-edit" onclick="openEdit(\'' + esc(r.id) + '\')">✏️ Edit</button>' +
               verifyBtn +
               '<button class="btn-promote" onclick="promote(\'' + esc(r.id) + '\',\'' + esc(r.name) + '\')">🚀 Promote</button>' +
               (r.claim_token ? '<a href="/claim.html?token=' + esc(r.claim_token) + '" target="_blank" class="btn-view">👋 Claim link</a>' : '') +
               '<button class="btn-del" onclick="deleteListing(\'' + esc(r.id) + '\',\'' + esc(r.name) + '\')">🗑 Delete</button>' +
             '</div>' +
           '</div>';
  }).join('');
}

function renderPager(){
  const totalPages = Math.ceil(TOTAL_COUNT / PAGE_SIZE);
  if (totalPages <= 1){
    document.getElementById('pager').style.display = 'none';
    return;
  }
  document.getElementById('pager').style.display = 'flex';
  document.getElementById('prevBtn').disabled = CURRENT_PAGE === 0;
  document.getElementById('nextBtn').disabled = CURRENT_PAGE >= totalPages - 1;
  document.getElementById('pageInfo').textContent = 'Page ' + (CURRENT_PAGE + 1) + ' of ' + totalPages;
}

function changePage(delta){
  CURRENT_PAGE = Math.max(0, CURRENT_PAGE + delta);
  loadList();
  window.scrollTo({ top: 0, behavior:'smooth' });
}

// ============================================================
// PROMOTE
// ============================================================
// ============================================================
// VERIFY PHONE — admin toggle to expose full mobile publicly
// ============================================================
async function setMobileVerified(id, verified, name){
  const action = verified ? 'verify' : 'unverify';
  const verb   = verified ? 'Verify' : 'Unverify';
  const note   = verified
    ? 'After verification, the FULL mobile number becomes publicly visible on Golden Pages and main DukanList.\n\nOnly verify when you have confirmed this number actually belongs to the business.'
    : 'Unverifying will MASK the mobile publicly again (only last-4 digits will show).';
  if (!confirm(verb + ' phone for "' + name + '"?\n\n' + note)) return;

  try {
    const { data, error } = await C.rpc('admin_set_mobile_verified', {
      p_business_id: id,
      p_verified:    verified
    });
    if (error) throw error;
    showToast('✓ Phone ' + (verified ? 'verified' : 'unverified') + ' for ' + name, 'success');
    loadList();
  } catch(e){
    showToast('⚠️ ' + (e.message || 'Failed'), 'error');
  }
}

async function promote(id, name){
  // One-click promote → goes to ACTIVE on main DukanList
  // (Admin already vetted the data via GP. If admin wants to send through
  // moderation instead, they can shift+click for the advanced dialog.)
  const useActive = !window.event || !window.event.shiftKey;
  let cleaned;

  if (useActive){
    if (!confirm('Promote "' + name + '" to MAIN DukanList NOW?\n\n• Listing goes live immediately in search & browse\n• Owner can still claim via WhatsApp\n• To send to moderation queue instead, hold Shift + click Promote\n\nProceed?')){
      return;
    }
    cleaned = 'active';
  } else {
    if (!confirm('Send "' + name + '" to MODERATION QUEUE?\n\n• Admin must approve before going live\n• Use when data needs review')){
      return;
    }
    cleaned = 'pending';
  }

  try {
    const { error } = await C.rpc('admin_gp_promote_to_full', {
      p_business_id:   id,
      p_target_status: cleaned
    });
    if (error) throw error;
    showToast('✓ Promoted to ' + (cleaned === 'active' ? 'DukanList (live)' : 'moderation queue'), 'success');
    loadList();
  } catch(e){
    showToast('⚠️ ' + (e.message || 'Failed'), 'error');
  }
}

// ============================================================
// DELETE
// ============================================================
async function deleteListing(id, name){
  if (!confirm('Delete "' + name + '" from Golden Pages?\n\nThis is permanent. The listing will be removed entirely.')) return;
  try {
    const { error } = await C.rpc('admin_gp_delete_soft', { p_business_id: id });
    if (error) throw error;
    showToast('✓ Deleted: ' + name, 'success');
    loadList();
  } catch(e){
    showToast('⚠️ ' + (e.message || 'Failed'), 'error');
  }
}

// ============================================================
// EDIT MODAL
// ============================================================
function openEdit(id){
  const row = LIST_DATA.find(r => r.id === id);
  if (!row) return;

  EDITING = {
    id: id,
    currentRow: row,
    selectedCats: [],   // populated below
    cityId: row.city_id
  };

  document.getElementById('e_name').value      = row.name || '';
  document.getElementById('e_name_hi').value   = row.name_hi || '';
  document.getElementById('e_owner_name').value = row.owner_name || '';
  document.getElementById('e_mobile').value    = row.mobile || '';
  document.getElementById('e_area').value      = row.area || '';
  document.getElementById('e_notes').value     = row.consent_notes || '';
  document.getElementById('editErr').classList.remove('show');
  document.getElementById('e_cat_search').value = '';
  document.getElementById('e_cat_results').classList.remove('show');

  // Pre-fill selected cats — start with the primary; admin can add more
  if (row.category_slug){
    const cat = ALL_CATEGORIES.find(c => c.slug === row.category_slug);
    if (cat){
      EDITING.selectedCats = [{ slug: cat.slug, name: cat.name, icon: cat.icon }];
    }
  }
  renderEditSelectedCats();

  // City chips
  const cityChipsHost = document.getElementById('e_city_chips');
  cityChipsHost.innerHTML = '';
  CITY_LIST.forEach(c => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'city-chip' + (c.id === EDITING.cityId ? ' active' : '');
    chip.textContent = c.name;
    chip.onclick = () => {
      cityChipsHost.querySelectorAll('.city-chip').forEach(x => x.classList.remove('active'));
      chip.classList.add('active');
      EDITING.cityId = c.id;
    };
    cityChipsHost.appendChild(chip);
  });

  // Wire cat search
  const catInput = document.getElementById('e_cat_search');
  catInput.oninput = () => {
    const q = catInput.value.trim().toLowerCase();
    const res = document.getElementById('e_cat_results');
    if (!q){ res.classList.remove('show'); res.innerHTML = ''; return; }
    const matches = ALL_CATEGORIES.filter(c => {
      const hay = (c.name + ' ' + c.name_hi + ' ' + c.slug + ' ' + c.keywords).toLowerCase();
      return hay.includes(q);
    }).slice(0, 15);
    if (!matches.length){
      res.innerHTML = '<div style="padding:8px;text-align:center;color:#94A3B8;font-size:.85rem">No matches</div>';
    } else {
      res.innerHTML = matches.map(c =>
        '<button type="button" class="cat-result-chip" data-slug="' + esc(c.slug) + '" data-name="' + esc(c.name) + '" data-icon="' + esc(c.icon) + '">' +
          '<span>' + esc(c.icon) + '</span>' +
          '<span style="flex:1">' + esc(c.name) + '</span>' +
          '<span class="slug-code">' + esc(c.slug) + '</span>' +
        '</button>'
      ).join('');
      res.querySelectorAll('.cat-result-chip').forEach(btn => {
        btn.onclick = () => {
          const slug = btn.getAttribute('data-slug');
          const name = btn.getAttribute('data-name');
          const icon = btn.getAttribute('data-icon');
          if (EDITING.selectedCats.some(c => c.slug === slug)) return;
          if (EDITING.selectedCats.length >= 5){ alert('Max 5 categories'); return; }
          EDITING.selectedCats.push({ slug, name, icon });
          renderEditSelectedCats();
          catInput.value = '';
          res.classList.remove('show');
          catInput.focus();
        };
      });
    }
    res.classList.add('show');
  };

  document.getElementById('editModal').classList.add('show');
}

function renderEditSelectedCats(){
  const host = document.getElementById('e_selected_cats');
  if (!EDITING.selectedCats.length){
    host.classList.remove('show');
    host.innerHTML = '';
    return;
  }
  host.classList.add('show');
  host.innerHTML = EDITING.selectedCats.map((c, i) => {
    const isPrimary = (i === 0);
    return '<div class="sel-cat-row' + (isPrimary ? ' is-primary' : '') + '" onclick="promoteEditCat(\'' + esc(c.slug) + '\')">' +
             '<span>' + esc(c.icon) + '</span>' +
             '<span>' + (isPrimary ? '⭐ ' : '') + esc(c.name) + '</span>' +
             '<span style="font-family:monospace;font-size:.7rem;color:#78350F">' + esc(c.slug) + '</span>' +
             '<button type="button" class="x" onclick="event.stopPropagation();removeEditCat(\'' + esc(c.slug) + '\')">×</button>' +
           '</div>';
  }).join('');
}

function promoteEditCat(slug){
  if (!EDITING) return;
  const idx = EDITING.selectedCats.findIndex(c => c.slug === slug);
  if (idx <= 0) return;
  const item = EDITING.selectedCats.splice(idx, 1)[0];
  EDITING.selectedCats.unshift(item);
  renderEditSelectedCats();
}

function removeEditCat(slug){
  if (!EDITING) return;
  EDITING.selectedCats = EDITING.selectedCats.filter(c => c.slug !== slug);
  renderEditSelectedCats();
}

function closeEdit(){
  document.getElementById('editModal').classList.remove('show');
  EDITING = null;
}

async function saveEdit(){
  console.log('[saveEdit] called', EDITING);
  if (!EDITING) {
    alert('Edit state missing. Close modal and re-open.');
    return;
  }
  const errEl = document.getElementById('editErr');
  errEl.classList.remove('show');

  const name = document.getElementById('e_name').value.trim();
  if (name.length < 2){
    errEl.textContent = 'Name is required (min 2 chars)';
    errEl.classList.add('show');
    return;
  }
  if (!EDITING.selectedCats || !EDITING.selectedCats.length){
    errEl.textContent = 'Pick at least one category';
    errEl.classList.add('show');
    return;
  }
  if (!EDITING.cityId){
    errEl.textContent = 'Pick a city';
    errEl.classList.add('show');
    return;
  }

  const mobileRaw = document.getElementById('e_mobile').value.trim();
  if (mobileRaw && !/^[6789]\d{9}$/.test(mobileRaw.replace(/\D/g,'').slice(-10))){
    errEl.textContent = 'Invalid mobile format (10 digits starting 6/7/8/9)';
    errEl.classList.add('show');
    return;
  }

  const slugs = EDITING.selectedCats.map(c => c.slug);
  const primary = slugs[0];

  const args = {
    p_business_id:           EDITING.id,
    p_name:                  name,
    p_name_hi:               document.getElementById('e_name_hi').value,
    p_owner_name:            document.getElementById('e_owner_name').value,
    p_mobile:                document.getElementById('e_mobile').value,
    p_area:                  document.getElementById('e_area').value,
    p_city_id:               EDITING.cityId,
    p_category_slugs:        slugs,
    p_primary_category_slug: primary,
    p_notes:                 document.getElementById('e_notes').value
  };
  console.log('[saveEdit] calling admin_gp_update_soft with', args);

  // Visually disable the Save button so user knows something's happening
  const btnSave = document.querySelector('.btn-save');
  const origLabel = btnSave ? btnSave.innerHTML : '';
  if (btnSave){ btnSave.disabled = true; btnSave.innerHTML = '⏳ Saving…'; }

  try {
    const { data, error } = await C.rpc('admin_gp_update_soft', args);
    console.log('[saveEdit] response', { data, error });
    if (error) throw error;
    showToast('✓ Updated', 'success');
    closeEdit();
    loadList();
  } catch(e){
    console.error('[saveEdit] failed', e);
    // Show the full PostgreSQL error message inline so admin sees the exact reason
    const msg = (e && (e.message || e.error_description || e.hint || e.details)) || 'Save failed (no error message)';
    errEl.textContent = '⚠️ ' + msg;
    errEl.classList.add('show');
    // Scroll error into view inside modal
    try { errEl.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(_){}
    // Also alert so user can't miss it
    alert('Save failed:\n\n' + msg + '\n\n(See browser console for full details: F12 → Console)');
  } finally {
    if (btnSave){ btnSave.disabled = false; btnSave.innerHTML = origLabel; }
  }
}

// ============================================================
// HELPERS
// ============================================================
function timeAgo(iso){
  if (!iso) return '—';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 7*86400) return Math.floor(diff/86400) + 'd ago';
  return new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function showToast(msg, kind){
  // For success/error we use a custom inline-styled ribbon so cross-page CSS
  // (admin-premium.css) cannot stretch or override it. The old #toast element
  // is kept for back-compat but bypassed here.
  // Remove any existing ribbon first
  const existing = document.getElementById('actionRibbon');
  if (existing) existing.remove();

  const ribbon = document.createElement('div');
  ribbon.id = 'actionRibbon';
  const isErr = kind === 'error';
  const grad = isErr
    ? 'linear-gradient(135deg,#DC2626,#991B1B)'
    : 'linear-gradient(135deg,#10B981,#059669)';
  const shadow = isErr
    ? '0 12px 32px rgba(220,38,38,.4)'
    : '0 12px 32px rgba(16,185,129,.4)';
  ribbon.textContent = msg;
  ribbon.style.cssText = [
    'position:fixed',
    'top:24px',
    'left:50%',
    'transform:translateX(-50%) translateY(-32px)',
    'background:' + grad,
    'color:#fff',
    'padding:14px 28px',
    'border-radius:99px',
    'font-weight:800',
    'font-size:1rem',
    'letter-spacing:.01em',
    'box-shadow:' + shadow,
    'z-index:99999',
    'pointer-events:none',
    'opacity:0',
    'transition:opacity .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1)',
    'white-space:nowrap',
    'max-width:90vw',
    'overflow:hidden',
    'text-overflow:ellipsis',
    'font-family:inherit'
  ].join(';') + ';';
  document.body.appendChild(ribbon);
  requestAnimationFrame(() => {
    ribbon.style.opacity = '1';
    ribbon.style.transform = 'translateX(-50%) translateY(0)';
  });
  setTimeout(() => {
    ribbon.style.opacity = '0';
    ribbon.style.transform = 'translateX(-50%) translateY(-32px)';
    setTimeout(() => { try { ribbon.remove(); } catch(_){} }, 400);
  }, 2400);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
