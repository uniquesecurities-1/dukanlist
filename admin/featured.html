<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F172A">
<meta name="robots" content="noindex,nofollow">
<title>Featured Listings — Admin · DukanList</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f9;color:#0F172A;font-size:14px;line-height:1.5}
  .topbar{background:#0F172A;color:#f1f5f9;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .badge{font-size:10px;font-weight:700;background:#FFC93D;color:#0F172A;padding:2px 7px;border-radius:5px}
  .topbar a{color:#cbd5e1;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600;transition:.15s}
  .topbar a:hover{background:rgba(255,255,255,.1);color:#fff}
  .topbar a.active{background:rgba(255,201,61,.18);color:#FFC93D}

  .main{max-width:1180px;margin:24px auto;padding:0 18px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .subtitle{font-size:13px;color:#64748b;margin-bottom:22px}

  /* KPI grid */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,23,42,.06)}
  .kpi.gold{background:linear-gradient(135deg,#FFFBEB 0%,#FEF3C7 100%);border-color:#FCD34D}
  .kpi.warn{background:linear-gradient(135deg,#FEF2F2 0%,#FEE2E2 100%);border-color:#FCA5A5}
  .kpi.good{background:linear-gradient(135deg,#ECFDF5 0%,#D1FAE5 100%);border-color:#6EE7B7}
  .kpi .label{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .kpi .num{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#0F172A;font-variant-numeric:tabular-nums}
  .kpi .num small{font-size:14px;font-weight:600;color:#64748b}
  .kpi .sub{font-size:12px;color:#64748b;margin-top:4px;font-weight:600}

  /* Section card */
  .section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:18px}
  .section h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .section h2 .count{font-size:11px;font-weight:700;background:#FFC93D;color:#0F172A;padding:2px 7px;border-radius:5px}

  /* Active list */
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .shop-card{display:flex;gap:12px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;text-decoration:none;color:inherit;transition:.15s;background:#fff;position:relative;overflow:hidden}
  .shop-card:hover{border-color:#FFC93D;background:#FFFBEB;transform:translateY(-1px);box-shadow:0 6px 14px rgba(255,201,61,.18)}
  .shop-card.urgent{border-color:#FCA5A5;background:#FEF2F2}
  .shop-card.urgent:hover{border-color:#EF4444;background:#FEE2E2}
  .shop-photo{width:64px;height:64px;border-radius:8px;background:#f1f5f9;flex-shrink:0;overflow:hidden;display:grid;place-items:center;font-size:26px;opacity:.8}
  .shop-photo img{width:100%;height:100%;object-fit:cover}
  .shop-info{flex:1;min-width:0}
  .shop-name{font-weight:800;font-size:14px;color:#0F172A;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
  .shop-city{font-size:11px;color:#64748b;font-weight:600;margin-top:2px}
  .shop-days{margin-top:6px;font-size:11px;font-weight:800;color:#92400E;background:rgba(252,211,77,.3);padding:2px 8px;border-radius:99px;display:inline-block}
  .shop-days.urgent{color:#991B1B;background:rgba(248,113,113,.25)}

  .empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px}
  .empty .ico{font-size:42px;margin-bottom:10px;opacity:.4}
  .loader{text-align:center;padding:50px 20px;color:#64748b}
  .err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:14px;border-radius:10px;font-size:13px;font-weight:600}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body,h1,h2,h3,h4,h5,h6,button,input,select,textarea{font-family:"Plus Jakarta Sans","Manrope","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif !important}</style>

<!-- Premium banking-class polish — shared CSS file applied site-wide. Load LAST so it overrides earlier inline styles. -->
<link rel="stylesheet" href="/assets/css/admin-premium.css">
<!-- Admin error monitor (auto-injected) -->
<script src="/assets/js/admin-error-monitor.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="/admin/dashboard" style="display:flex;align-items:center;gap:10px;color:#fff;padding:0">🛡️ <strong>Admin</strong> <span class="badge">Featured</span></a>
  </div>
  <nav style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/moderation">Moderation</a>
    <a href="/admin/health.html" style="background:linear-gradient(135deg,#FF6B1A,#EA580C);color:#fff;font-weight:800;border-radius:8px">🛡 Health</a>
    <a href="/admin/pucho-moderation.html">💬 Pucho Bhai</a>
    <a href="/admin/featured.html" class="active">⭐ Featured</a>
    <a href="/admin/deals.html">🎁 Deals</a>
    <a href="/admin/activity.html">📋 Activity</a>
    <a href="/admin/announcements">Announcements</a>
    <a class="logout" onclick="logout()" style="cursor:pointer;color:#FCA5A5">Logout</a>
  </nav>
</header>

<main class="main">
  <h1>⭐ Featured Listings</h1>
  <div class="subtitle">Manage paid promotions and track revenue across active campaigns.</div>

  <div id="content"><div class="loader">Loading featured listings…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script src="/assets/js/admin-common.js"></script>
<script>AdminCommon.requireAdmin();</script>
<script>
const ROOT = document.getElementById('content');

async function init(){
  const c = ShopDB.client;
  const { data: sess } = await c.auth.getSession();
  if (!sess.session){
    location.href = '/admin/login.html?next=/admin/featured.html';
    return;
  }
  const r = await c.rpc('admin_featured_summary');
  if (r.error){
    ROOT.innerHTML = '<div class="err">Failed to load: ' + esc(r.error.message) + '<br><small style="font-weight:500;margin-top:6px;display:block">If you see "function does not exist", run db/37-featured-listings.sql in Supabase SQL Editor first.</small></div>';
    return;
  }
  render(r.data);
}

function render(d){
  const monthRev   = Number(d.revenue_this_month || 0);
  const yearRev    = Number(d.revenue_this_year  || 0);
  const allRev     = Number(d.revenue_all_time   || 0);
  const activeCt   = d.active_count || 0;
  const expiringCt = d.expiring_7days || 0;
  const activeList = d.active_list || [];

  // KPI cards
  let html = '<div class="kpi-grid">'
    + kpiCard('gold', 'Active Featured', activeCt, '★ Currently promoted')
    + kpiCard(expiringCt > 0 ? 'warn' : '', 'Expiring This Week', expiringCt, expiringCt > 0 ? '⚠ Renew soon' : 'No urgency')
    + kpiCard('good', 'Revenue · This Month', '₹' + monthRev.toLocaleString('en-IN'), 'Active payments')
    + kpiCard('', 'Revenue · This Year', '₹' + yearRev.toLocaleString('en-IN'), 'YTD')
    + kpiCard('', 'Revenue · All Time', '₹' + allRev.toLocaleString('en-IN'), 'Total earned')
    + '</div>';

  // Active list section
  html += '<div class="section">'
    + '<h2>★ Currently Featured <span class="count">' + activeCt + '</span></h2>';

  if (activeList.length === 0){
    html += '<div class="empty"><div class="ico">⭐</div>No featured shops yet. Mark shops from the Moderation panel.</div>';
  } else {
    html += '<div class="shop-grid">';
    activeList.forEach(s => {
      const urgent = s.days_left <= 7;
      const photo = s.photo
        ? `<img src="${esc(s.photo)}" alt="">`
        : '🏪';
      const expiryText = s.featured_until
        ? new Date(s.featured_until).toLocaleDateString('en-IN',{day:'numeric',month:'short'})
        : 'No expiry';
      html += `<a class="shop-card${urgent ? ' urgent' : ''}" href="/admin/shop.html?id=${esc(s.id)}">
        <div class="shop-photo">${photo}</div>
        <div class="shop-info">
          <div class="shop-name">${esc(s.name)}</div>
          <div class="shop-city">📍 ${esc(s.city_name || '—')}</div>
          <div class="shop-days${urgent ? ' urgent' : ''}">${s.days_left} days left · ${esc(expiryText)}</div>
        </div>
      </a>`;
    });
    html += '</div>';
  }
  html += '</div>';

  ROOT.innerHTML = html;
}

function kpiCard(klass, label, num, sub){
  return `<div class="kpi ${klass}">
    <div class="label">${label}</div>
    <div class="num">${num}</div>
    <div class="sub">${sub}</div>
  </div>`;
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function logout(){
  await ShopDB.client.auth.signOut();
  location.href = '/admin/login.html';
}

init();
</script>
<script src="/assets/js/admin-auto-logout.js"></script>
</body>
</html>
