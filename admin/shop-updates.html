<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Updates — DukanList Admin</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@500;700;800;900&display=swap" rel="stylesheet">
<!--
  v348: what shopkeepers sent through the "page sudhaaro" link (db/249).
  Nothing from the link is live until it is approved here. Approve copies
  the answers onto the shop and adds the ticked photos (max 8 per shop).
-->
<style>
  *,*::before,*::after{ box-sizing:border-box }
  body{ margin:0; font-family:'Plus Jakarta Sans',-apple-system,sans-serif; background:#f4f6fb; color:#0F172A; line-height:1.55 }
  .topbar{ background:linear-gradient(180deg,#0A1226 0%,#0B1530 100%); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px }
  .topbar a.brand{ color:#fff; font-weight:900; font-size:1.05rem; text-decoration:none }
  .topbar a.brand .badge{ background:linear-gradient(135deg,#C2A05A,#8C6A1F); color:#FFF8E6; font-size:.6rem; font-weight:800; padding:3px 8px; border-radius:6px; margin-left:6px; letter-spacing:.12em }
  .topbar .nav a{ color:#C5CDDA; text-decoration:none; font-size:.85rem; margin-left:10px; padding:6px 10px; border-radius:7px }
  .topbar .nav a.active{ background:rgba(99,140,255,.16); color:#DBEAFE }
  .page{ max-width:980px; margin:0 auto; padding:22px 16px 60px }
  h1{ font-family:'Manrope',sans-serif; font-size:1.5rem; margin:0 0 4px }
  .sub{ color:#64748B; font-size:.86rem; margin-bottom:16px }
  .tabs{ display:flex; gap:8px; margin-bottom:16px }
  .tab{ background:#fff; border:1px solid #E2E8F0; padding:7px 14px; border-radius:99px; font-weight:700; font-size:.82rem; cursor:pointer; font-family:inherit; color:#475569 }
  .tab.on{ background:#0F172A; color:#fff; border-color:#0F172A }
  .card{ background:#fff; border:1px solid #E2E8F0; border-radius:14px; padding:16px; margin-bottom:14px }
  .card h2{ font-size:1.05rem; margin:0 0 2px }
  .card h2 a{ color:inherit; text-decoration:none }
  .meta{ font-size:.76rem; color:#64748B; margin-bottom:10px }
  .row{ display:grid; grid-template-columns:150px 1fr 1fr; gap:10px; padding:8px 0; border-top:1px dashed #E2E8F0; font-size:.86rem }
  .row .k{ font-weight:800; color:#475569; font-size:.78rem }
  .row .old{ color:#94A3B8; white-space:pre-wrap }
  .row .new{ color:#0F172A; white-space:pre-wrap; font-weight:600 }
  .row .new.same{ color:#94A3B8; font-weight:400 }
  .hd{ display:grid; grid-template-columns:150px 1fr 1fr; gap:10px; font-size:.68rem; font-weight:800; letter-spacing:.08em; color:#94A3B8; text-transform:uppercase }
  .chips span{ display:inline-block; background:#FFF7ED; border:1px solid #FED7AA; color:#9A3412; border-radius:99px; padding:1px 8px; margin:2px 3px 2px 0; font-size:.76rem; font-weight:700 }
  .photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:10px }
  .photos label{ position:relative; display:block; border-radius:10px; overflow:hidden; border:2px solid #16A34A; cursor:pointer; aspect-ratio:1; background:#F1F5F9 }
  .photos label.off{ border-color:#E2E8F0; opacity:.45 }
  .photos img{ width:100%; height:100%; object-fit:cover; display:block }
  .photos input{ position:absolute; top:6px; left:6px; width:18px; height:18px }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center }
  .btn{ border:0; border-radius:9px; padding:9px 14px; font-weight:800; cursor:pointer; font-family:inherit; font-size:.86rem }
  .btn.ok{ background:linear-gradient(135deg,#16A34A,#15803D); color:#fff }
  .btn.no{ background:#fff; color:#B91C1C; border:1.5px solid #FCA5A5 }
  .note{ flex:1; min-width:180px; border:1px solid #CBD5E1; border-radius:9px; padding:8px 10px; font-family:inherit; font-size:.84rem }
  .empty{ text-align:center; color:#64748B; padding:40px 10px; background:#fff; border-radius:14px; border:1px dashed #CBD5E1 }
  .err{ color:#DC2626; background:#FEF2F2; border:1px solid #FECACA; padding:12px; border-radius:10px }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0F172A; color:#fff; padding:10px 16px; border-radius:10px; font-weight:700; font-size:.86rem; display:none; z-index:9 }
  @media (max-width:640px){ .row, .hd{ grid-template-columns:1fr } .hd{ display:none } .row .old::before{ content:'Abhi: '; font-weight:800 } .row .new::before{ content:'Naya: '; font-weight:800 } }
</style>
<script src="/assets/js/admin-error-monitor.js?v=20260921e"></script>
</head>
<body>
<header class="topbar">
  <a href="/admin/dashboard.html" class="brand">DukanList<span class="badge">ADMIN</span></a>
  <nav class="nav">
    <a href="/admin/dashboard.html">📊 Dashboard</a>
    <a href="/admin/incomplete-shops.html">🩹 Incomplete</a>
    <a href="/admin/shop-updates.html" class="active">📝 Shop Updates</a>
    <a href="#" onclick="logout(); return false">Logout</a>
  </nav>
</header>

<main class="page">
  <h1>📝 Shop Updates</h1>
  <div class="sub">Shopkeepers ne "page sudhaaro" link se jo bheja. Approve karte hi shop page par live ho jaata hai. Link banane ke liye: admin → shop kholo → 🔗 Page sudhaaro link.</div>
  <div class="tabs">
    <button class="tab on" data-s="pending" onclick="setTab(this)">⏳ Pending</button>
    <button class="tab" data-s="approved" onclick="setTab(this)">✅ Approved</button>
    <button class="tab" data-s="rejected" onclick="setTab(this)">✕ Rejected</button>
  </div>
  <div id="root"><div class="empty">Loading…</div></div>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js?v=20260921e"></script>
<script>
var STATUS = 'pending', ROWS = [];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 2600); }
async function logout(){ try { await ShopDB.client.auth.signOut(); } catch(_){} location.href = '/admin/login.html'; }
function setTab(b){ document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === b); }); STATUS = b.dataset.s; load(); }

function chips(a){ a = a || []; return a.length ? '<span class="chips">' + a.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</span>' : '<span style="color:#CBD5E1">—</span>'; }
function txt(v){ return (v == null || v === '') ? '<span style="color:#CBD5E1">—</span>' : esc(v); }
function row(k, oldHtml, newHtml, same){ return '<div class="row"><div class="k">' + k + '</div><div class="old">' + oldHtml + '</div><div class="new' + (same ? ' same' : '') + '">' + newHtml + '</div></div>'; }

async function load(){
  var root = document.getElementById('root');
  root.innerHTML = '<div class="empty">Loading…</div>';
  var r = await ShopDB.client.rpc('admin_list_shop_updates', { p_status: STATUS });
  if (r.error){ root.innerHTML = '<div class="err">' + esc(r.error.message) + (/admin_list_shop_updates/.test(r.error.message) ? ' — run db/249 first' : '') + '</div>'; return; }
  ROWS = r.data || [];
  if (!ROWS.length){ root.innerHTML = '<div class="empty">' + (STATUS === 'pending' ? 'Kuch pending nahi hai. 🎉' : 'Abhi kuch nahi.') + '</div>'; return; }
  root.innerHTML = ROWS.map(function(s){
    var n = s['new'] || {}, o = s.old || {};
    var when = new Date(s.submitted_at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
    var room = Math.max(0, 8 - (s.photo_count || 0));
    var h = '<div class="card" id="su' + s.id + '">'
      + '<h2><a href="/' + esc(s.slug) + '" target="_blank" rel="noopener">' + esc(s.name) + ' ↗</a></h2>'
      + '<div class="meta">Bheja: ' + esc(when) + ' · <a href="/admin/shop.html?id=' + esc(s.business_id) + '">admin mein kholo</a>' + (s.reviewed_at ? ' · reviewed ' + esc(new Date(s.reviewed_at).toLocaleDateString('en-IN')) : '') + (s.review_note ? ' · note: ' + esc(s.review_note) : '') + '</div>'
      + '<div class="hd"><div></div><div>Abhi</div><div>Naya (shopkeeper ne bheja)</div></div>'
      + row('Kya milta hai', chips(o.offerings), (n.offerings && n.offerings.length) ? chips(n.offerings) : '<span style="color:#CBD5E1">(nahi bheja — purana rahega)</span>', !(n.offerings && n.offerings.length))
      + row('Log kyon aate hain', txt(o.why_text), n.why_text ? esc(n.why_text) : '(purana rahega)', !n.why_text)
      + row('Since', txt(o.established_year), n.established_year ? esc(n.established_year) : '(purana rahega)', !n.established_year)
      + row('Kahani / about', txt(o.about_text), n.about_text ? esc(n.about_text) : '(purana rahega)', !n.about_text);
    var ph = n.photos || [];
    if (ph.length){
      h += '<div style="margin-top:10px;font-size:.8rem;font-weight:800;color:#475569">Photos (' + ph.length + ')' + (STATUS === 'pending' ? ' — jo nahi chahiye unka tick hatao. Shop par jagah: ' + room + ' / 8' : '') + '</div><div class="photos">'
        + ph.map(function(u, i){
            var thumb = String(u).replace('/upload/', '/upload/w_300,h_300,c_fill,q_auto,f_auto/');
            return '<label' + (STATUS === 'pending' && i >= room ? ' class="off"' : '') + '><a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(thumb) + '" alt=""></a>'
              + (STATUS === 'pending' ? '<input type="checkbox" data-su="' + s.id + '" value="' + esc(u) + '"' + (i < room ? ' checked' : '') + ' onchange="this.parentNode.classList.toggle(\'off\', !this.checked)">' : '') + '</label>';
          }).join('') + '</div>';
    }
    if (STATUS === 'pending'){
      h += '<div class="acts">'
        + '<button class="btn ok" onclick="review(' + s.id + ', true)">✅ Approve — live karo</button>'
        + '<input class="note" id="note' + s.id + '" placeholder="Note (optional) — reject karne ki wajah">'
        + '<button class="btn no" onclick="review(' + s.id + ', false)">✕ Reject</button>'
        + '</div>';
    }
    return h + '</div>';
  }).join('');
}

async function review(id, approve){
  if (!approve && !confirm('Reject this submission?')) return;
  var photos = Array.prototype.slice.call(document.querySelectorAll('input[data-su="' + id + '"]:checked')).map(function(i){ return i.value; });
  var note = (document.getElementById('note' + id) || {}).value || null;
  var r = await ShopDB.client.rpc('admin_review_shop_update', { p_id: id, p_approve: approve, p_note: note, p_photos: photos });
  if (r.error){ alert('Failed: ' + r.error.message); return; }
  toast(approve ? ('✓ Live ho gaya' + (r.data && r.data.photos_added ? ' · ' + r.data.photos_added + ' photo' : '')) : 'Rejected');
  var el = document.getElementById('su' + id); if (el) el.remove();
  if (!document.querySelector('.card')) load();
}

(async function(){
  var c = ShopDB.client;
  var u = await c.auth.getUser();
  if (!u.data || !u.data.user){ location.href = '/admin/login.html'; return; }
  var a = await c.rpc('is_admin');
  if (a.error || !a.data){ document.getElementById('root').innerHTML = '<div class="err">Admin access required.</div>'; return; }
  load();
})();
</script>
<script src="/assets/js/admin-auto-logout.js?v=20260921e"></script>
</body>
</html>
