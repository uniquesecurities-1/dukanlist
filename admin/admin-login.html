<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F172A">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login — DukanList</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;color:#f1f5f9;
  }
  .login-card{
    background:white;color:#0F172A;border-radius:16px;
    padding:32px 28px;width:100%;max-width:400px;
    box-shadow:0 25px 50px rgba(0,0,0,0.5);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:20px;font-weight:800}
  .brand .badge{font-size:11px;font-weight:700;background:#6366F1;color:white;padding:3px 8px;border-radius:6px;letter-spacing:0.5px}
  h1{font-size:24px;margin:18px 0 6px;font-weight:800}
  .sub{font-size:14px;color:#64748b;margin-bottom:22px}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
  .input{
    width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;
    font-size:16px;outline:none;font-family:inherit;transition:border-color .15s;
  }
  .input:focus{border-color:#6366F1;box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
  .help{font-size:12px;color:#94a3b8;margin-top:6px}
  .btn{
    width:100%;padding:13px 16px;background:#6366F1;color:white;border:none;
    border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;
    margin-top:14px;transition:background .15s;font-family:inherit;
  }
  .btn:hover:not(:disabled){background:#4F46E5}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .btn-ghost{background:transparent;color:#6366F1;border:1.5px solid #e2e8f0;margin-top:8px}
  .btn-ghost:hover:not(:disabled){background:#f1f5f9}
  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:flex;gap:8px}
  .alert.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .alert.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .alert.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .otp-input{
    text-align:center;letter-spacing:8px;font-size:22px;font-weight:700;
  }
  .form-group{margin-bottom:14px}
  a{color:#6366F1;text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  .footer{text-align:center;margin-top:18px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <span>🛡️</span>
    <span>Dukan<em style="font-style:normal;color:#6366F1">List</em></span>
    <span class="badge">ADMIN</span>
  </div>

  <h1>Admin Login</h1>
  <p class="sub">Mobile OTP-based access. Admin role required.</p>

  <!-- Phone block -->
  <div id="phoneBlock">
    <div class="form-group">
      <label for="phone">Admin Mobile Number</label>
      <input id="phone" class="input" type="tel" placeholder="+91 9541223377" inputmode="numeric" maxlength="13" autofocus>
      <div class="help">Registered admin mobile only</div>
    </div>
    <div class="alert error" id="phoneErr" style="display:none"></div>
    <button class="btn" id="sendBtn" onclick="handleSendOTP()">Send OTP →</button>
  </div>

  <!-- OTP block -->
  <div id="otpBlock" style="display:none">
    <div class="form-group">
      <label for="otp">6-digit OTP</label>
      <input id="otp" class="input otp-input" type="text" maxlength="6" inputmode="numeric" placeholder="------">
      <div class="help">
        Sent to <b id="phoneSent"></b>.
        <a href="#" onclick="changePhone(event)">Change</a>
      </div>
    </div>
    <div class="alert error" id="otpErr" style="display:none"></div>
    <button class="btn" id="verifyBtn" onclick="handleVerifyOTP()">Verify & Login →</button>
    <button class="btn btn-ghost" id="resendBtn" onclick="handleResend()" disabled>
      Resend OTP <span id="resendTmr"></span>
    </button>
  </div>

  <div class="footer">
    <a href="/">← Back to public site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script src="/assets/js/otp.js"></script>
<script>
let state = { phone: '' };
let resendCounter = 0, resendInterval = null;

async function handleSendOTP(){
  const btn = document.getElementById('sendBtn');
  const mobile = document.getElementById('phone').value.trim();
  const errEl = document.getElementById('phoneErr');
  errEl.style.display = 'none';
  if (!OTP.isValidIndianMobile(mobile)){
    errEl.textContent = 'Enter a valid 10-digit Indian mobile';
    errEl.style.display = 'flex'; return;
  }
  btn.disabled = true; btn.textContent = '⏳ Sending...';
  const res = await OTP.sendOTP(mobile);
  btn.disabled = false; btn.textContent = 'Send OTP →';
  if (!res.ok){
    errEl.textContent = res.error || 'Failed to send OTP';
    errEl.style.display = 'flex'; return;
  }
  state.phone = OTP.cleanMobile(mobile);
  document.getElementById('phoneSent').textContent = state.phone;
  document.getElementById('phoneBlock').style.display = 'none';
  document.getElementById('otpBlock').style.display = '';
  document.getElementById('otp').focus();
  startResendTimer();
}

function startResendTimer(){
  resendCounter = 30;
  const btn = document.getElementById('resendBtn');
  const tmr = document.getElementById('resendTmr');
  btn.disabled = true;
  if (resendInterval) clearInterval(resendInterval);
  resendInterval = setInterval(() => {
    resendCounter--;
    tmr.textContent = '(' + resendCounter + 's)';
    if (resendCounter <= 0){
      clearInterval(resendInterval);
      btn.disabled = false; tmr.textContent = '';
    }
  }, 1000);
}

async function handleResend(){
  const res = await OTP.sendOTP(state.phone);
  if (res.ok) startResendTimer();
}

function changePhone(e){
  e.preventDefault();
  document.getElementById('phoneBlock').style.display = '';
  document.getElementById('otpBlock').style.display = 'none';
  document.getElementById('phone').focus();
}

async function handleVerifyOTP(){
  const btn = document.getElementById('verifyBtn');
  const token = document.getElementById('otp').value.trim();
  const errEl = document.getElementById('otpErr');
  errEl.style.display = 'none';
  if (!/^\d{6}$/.test(token)){
    errEl.textContent = 'Enter the 6-digit OTP';
    errEl.style.display = 'flex'; return;
  }
  btn.disabled = true; btn.textContent = '⏳ Verifying...';
  const res = await OTP.verifyOTP(state.phone, token);
  if (!res.ok){
    btn.disabled = false; btn.textContent = 'Verify & Login →';
    errEl.textContent = res.error || 'Wrong OTP';
    errEl.style.display = 'flex'; return;
  }

  // OTP verified — now check admin role
  btn.textContent = '⏳ Checking admin role...';
  const c = ShopDB.client;
  const { data: isAdmin, error } = await c.rpc('is_admin');
  if (error || !isAdmin){
    btn.disabled = false; btn.textContent = 'Verify & Login →';
    errEl.innerHTML = '<span>🚫</span><div><b>Not authorized.</b> Your mobile is not registered as admin. Contact super-admin.</div>';
    errEl.style.display = 'flex';
    // Sign out (since not admin)
    await c.auth.signOut();
    return;
  }

  // Update last_login_at (best effort, ignore errors)
  try{
    await c.from('admin_users').update({ last_login_at: new Date().toISOString() })
      .eq('auth_user_id', res.user.id);
  }catch(e){ /* ignore */ }

  // All good — redirect to admin dashboard
  window.location.href = '/admin/dashboard.html';
}
</script>

</body>
</html>
