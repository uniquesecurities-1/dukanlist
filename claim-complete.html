<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3B82F6">
<meta name="robots" content="noindex,nofollow">
<title>Completing your claim… — DukanList</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📧</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:linear-gradient(135deg,#EEF2FF,#DBEAFE);color:#0F172A;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:18px;padding:32px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.1)}
  .emoji{font-size:3rem;margin-bottom:14px}
  h1{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;color:#0F172A;margin-bottom:8px}
  p{font-size:.95rem;line-height:1.55;color:#475569;font-weight:500;margin-bottom:14px}
  .biz{background:#EEF2FF;border:1px solid #C7D2FE;border-radius:11px;padding:14px;margin:14px 0;font-weight:700;color:#3730A3}
  .biz b{display:block;font-size:1.05rem;margin-bottom:3px;color:#1E1B4B}
  .sp{display:inline-block;width:36px;height:36px;border:3.5px solid #DBEAFE;border-top-color:#3B82F6;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;padding:12px 24px;border-radius:11px;font-weight:800;font-size:.95rem;text-decoration:none;border:0;cursor:pointer;font-family:inherit;margin-top:10px;box-shadow:0 6px 18px rgba(59,130,246,.3)}
  .btn:hover{transform:translateY(-1px)}
  .btn-2{background:#fff;color:#3B82F6;border:1.5px solid #C7D2FE;margin-left:6px}
  .err{background:#FEE2E2;border:1px solid #FCA5A5;color:#991B1B;padding:12px;border-radius:10px;font-weight:700;font-size:.85rem}
  .ok{background:#D1FAE5;color:#065F46}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="emoji">📧</div>
  <div class="sp"></div>
  <h1 id="title">Completing your claim…</h1>
  <p id="sub">Verifying your email and linking your listing.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script>
'use strict';

const C = (window.ShopDB && window.ShopDB.client) || null;
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';

// Supabase sends auth errors as URL params or hash fragment when magic
// link can't be redeemed (expired, already used, invalid).
const hashParams = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
const ERR_CODE = params.get('error_code') || hashParams.get('error_code') || '';
const ERR_TYPE = params.get('error') || hashParams.get('error') || '';
const ERR_DESC = params.get('error_description') || hashParams.get('error_description') || '';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function showState(emoji, title, subHTML, btnHTML, isErr){
  document.getElementById('card').innerHTML =
    '<div class="emoji">' + emoji + '</div>' +
    '<h1>' + esc(title) + '</h1>' +
    '<div style="margin-bottom:14px">' + subHTML + '</div>' +
    (btnHTML || '');
}

async function run(){
  if (!C){
    return showState('⚠️', 'Page failed to load', '<p>Please refresh the page.</p>', '');
  }

  // Check FIRST for an auth error param — magic link may have already
  // been used or expired. We want to show a friendly recovery message
  // instead of the generic "verify via email link" fallback.
  if (ERR_CODE === 'otp_expired' || ERR_TYPE === 'access_denied'){
    // Possibility: link was clicked twice. The FIRST click already
    // verified the email. Check if a session exists (might still be
    // logged in from the successful first click).
    let existingSession = null;
    try {
      const { data } = await C.auth.getSession();
      if (data && data.session) existingSession = data.session;
    } catch(_){}

    if (existingSession){
      // First click already worked — show success + go to panel
      return showState(
        '✅',
        'You are already verified',
        '<p>This link was already used successfully. You are logged in as <b>' + esc(existingSession.user.email) + '</b>.</p>',
        '<a class="btn" href="/panel/dashboard.html">→ Go to Owner Panel</a>' +
        '<a class="btn btn-2" href="/">View DukanList</a>'
      );
    }

    // Truly expired and no session — ask admin to resend
    return showState(
      '⏱',
      'Link expired',
      '<p>This invitation link is no longer valid. It may have been used once already, or has expired.</p>' +
      '<p style="font-size:.86rem;color:#475569">If you have not yet verified your email, please <b>contact the DukanList team</b> to send a fresh invite. We will WhatsApp you a new link.</p>' +
      (ERR_DESC ? '<p style="font-size:.75rem;color:#94A3B8">Details: ' + esc(ERR_DESC) + '</p>' : ''),
      '<a class="btn" href="https://wa.me/919876543210?text=' + encodeURIComponent('Hi DukanList Team, my claim link expired. Please send a fresh invite.') + '" target="_blank" rel="noopener">💬 WhatsApp Team</a>' +
      '<a class="btn btn-2" href="/panel/login.html">→ Try Login</a>'
    );
  }

  if (!TOKEN){
    return showState('⚠️', 'Missing claim token', '<p>The link is missing the <code>token</code> parameter. Please use the link from your invitation email.</p>', '');
  }

  // Wait briefly for Supabase to settle the magic-link session
  // (the auth callback updates session on page load)
  let session = null;
  for (let i = 0; i < 10; i++){
    const { data } = await C.auth.getSession();
    if (data && data.session){ session = data.session; break; }
    await new Promise(r => setTimeout(r, 300));
  }

  if (!session){
    return showState(
      '🔐',
      'Please verify via email link',
      '<p>This page completes your claim once you click the link in the invitation email. If you haven\'t received it yet, please ask the DukanList team to resend.</p>',
      '<a class="btn btn-2" href="/">← Back to DukanList</a>'
    );
  }

  // Call the existing claim RPC to link this business to the authenticated user
  try {
    const { data, error } = await C.rpc('claim_register_owner', {
      p_token:       TOKEN,
      p_owner_name:  null,
      p_owner_email: session.user.email || null
    });
    if (error) throw error;
    if (!data || !data.success){
      throw new Error((data && data.error) || 'Claim failed');
    }

    showState(
      '🎉',
      'Welcome to DukanList!',
      '<div class="biz"><b>🏪 ' + esc(data.business_name || 'Your listing') + '</b>Linked to <b>' + esc(session.user.email) + '</b></div>' +
      '<p>Your email is verified and you can now manage your listing. Add photos, hours, description, and respond to enquiries.</p>',
      '<a class="btn" href="/panel/dashboard.html">→ Go to Owner Panel</a>' +
      '<a class="btn btn-2" href="/golden-pages.html">View Directory</a>'
    );
  } catch(e){
    const msg = e.message || 'Unknown error';
    // Common case: token expired or already claimed by another user
    if (/already.*claimed|owner.*exists|claimed_verified/i.test(msg)){
      return showState(
        '✓',
        'Already claimed',
        '<p>This listing has already been linked to an account. If it\'s yours, please <a href="/panel/login.html">login</a> with the email you used.</p>',
        '<a class="btn" href="/panel/login.html">→ Login</a>'
      );
    }
    if (/invalid.*token|not found/i.test(msg)){
      return showState(
        '⚠️',
        'Invalid or expired link',
        '<p>This claim link is no longer valid. Please ask the DukanList team to send a fresh invitation.</p>',
        '<a class="btn btn-2" href="/">← Back to DukanList</a>'
      );
    }
    showState(
      '⚠️',
      'Could not complete claim',
      '<div class="err">' + esc(msg) + '</div><p>Please try refreshing, or contact the DukanList team.</p>',
      '<a class="btn btn-2" href="/">← Back to DukanList</a>'
    );
  }
}

run();
</script>
</body>
</html>
