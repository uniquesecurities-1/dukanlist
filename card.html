  .qa{

<script>
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

// Smart name prefix based on owner_role
function applyRolePrefix(name, role){
  if (!name) return '';
  var r = (role || '').toLowerCase();
  if (r.indexOf('doctor') >= 0) return 'Dr. ' + name;
  if (r.indexOf('chartered accountant') >= 0 || r === 'ca') return 'CA ' + name;
  if (r.indexOf('advocate') >= 0 || r.indexOf('lawyer') >= 0) return 'Adv. ' + name;
  if (r.indexOf('architect') >= 0) return 'Ar. ' + name;
  if (r.indexOf('engineer') >= 0 && r.indexOf('architect') < 0) return 'Er. ' + name;
  if (r.indexOf('pandit') >= 0 || r.indexOf('acharya') >= 0) return 'Pt. ' + name;
  return name;
}

// Trust tier from verified_score
function trustTier(score){
  var s = Number(score) || 0;
  if (s >= 5) return { label: 'GOLD' };
  if (s >= 3) return { label: 'SILVER' };
  if (s >= 1) return { label: 'BRONZE' };
  return null;
}

// Open/Closed Now from hours_json
function openStatus(hours){
  if (!hours || typeof hours !== 'object') return null;
  var dayKeys = ['sun','mon','tue','wed','thu','fri','sat'];
  var now = new Date();
  var today = hours[dayKeys[now.getDay()]];
  if (!today) return null;
  if (today.closed) return { open: false, text: 'Closed today' };
  var o = today.open || '', cl = today.close || '';
  if (!o || !cl) return null;
  function toMin(t){ var p = String(t).split(':'); return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0); }
  var nowMin = now.getHours()*60 + now.getMinutes();
  var oMin = toMin(o), cMin = toMin(cl);
  var isOpen = (cMin > oMin) ? (nowMin >= oMin && nowMin < cMin) : (nowMin >= oMin || nowMin < cMin);
  function fmt(t){ var p = String(t).split(':'); var h = parseInt(p[0],10)||0, m = parseInt(p[1],10)||0; var ampm = h>=12?'PM':'AM'; var h12 = h%12||12; return h12 + (m?':'+(m<10?'0':'')+m:'') + ' ' + ampm; }
  return { open: isOpen, text: isOpen ? ('Open · closes ' + fmt(cl)) : ('Closed · opens ' + fmt(o)) };
}

// Pick theme based on category/role
function pickTheme(role, catName, urlTheme){
  if (urlTheme && ['navy','medical','legal','finance','vibrant'].indexOf(urlTheme) >= 0) return urlTheme;
  var r = (role || '').toLowerCase() + ' ' + (catName || '').toLowerCase();
  if (/doctor|hospital|clinic|dentist|medical|pharma/.test(r)) return 'medical';
  if (/advocate|lawyer|legal/.test(r)) return 'legal';
  if (/chartered|tax|broker|mutual|insurance|financial|bank/.test(r)) return 'finance';
  return 'navy';
}

// Build vCard 3.0 string
function buildVCard(d){
  function esc(v){ return String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  var lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:' + esc(d.displayName || d.owner_name || d.business_name),
    'N:' + esc(d.last_name || '') + ';' + esc(d.first_name || d.owner_name || '') + ';;;',
    'ORG:' + esc(d.business_name || ''),
    'TITLE:' + esc(d.role || ''),
  ];
  if (d.mobile){
    lines.push('TEL;TYPE=CELL,VOICE:+91' + esc(d.mobile));
  }
  if (d.whatsapp && d.whatsapp !== d.mobile){
    lines.push('TEL;TYPE=WORK,VOICE:+91' + esc(d.whatsapp));
  }
  if (d.email){
    lines.push('EMAIL;TYPE=WORK,INTERNET:' + esc(d.email));
  }
  if (d.address_line1 || d.city){
    lines.push('ADR;TYPE=WORK:;;' + esc(d.address_line1 || '') + (d.address_line2 ? ', ' + esc(d.address_line2) : '') + ';' + esc(d.city || '') + ';' + esc(d.state || '') + ';' + esc(d.pincode || '') + ';India');
  }
  if (d.website){
    lines.push('URL:' + esc(d.website));
  }
  if (d.photo_data){
    // photo_data is "JPEG:base64..." or "PNG:base64..."
    var pp = d.photo_data.split(':');
    if (pp.length === 2){
      lines.push('PHOTO;TYPE=' + pp[0] + ';ENCODING=BASE64:' + pp[1]);
    }
  }
  lines.push('NOTE:Listed on DukanList — Mandi Dabwali\'s local directory · dukanlist.com');
  lines.push('END:VCARD');
  return lines.join('\r\n');
}

// Fetch photo URL → base64
async function photoToBase64(url){
  try {
    var r = await fetch(url, { mode: 'cors' });
    if (!r.ok) return null;
    var blob = await r.blob();
    if (blob.size > 500000) return null; // skip if >500KB
    return await new Promise(function(res){
      var rd = new FileReader();
      rd.onload = function(){
        var s = rd.result;
        var comma = s.indexOf(',');
        var type = s.indexOf('jpeg') >= 0 ? 'JPEG' : (s.indexOf('png') >= 0 ? 'PNG' : 'JPEG');
        res(type + ':' + s.slice(comma + 1));
      };
      rd.onerror = function(){ res(null); };
      rd.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}

function downloadVCard(vcfText, filename){
  // Detect platform — iOS handles vCard download poorly via blob URLs.
  // iOS Safari needs a navigation to a data: URL to trigger the "Add Contact" sheet.
  // Android downloads .vcf fine via blob + download attribute.
  var ua = (navigator.userAgent || '').toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua) || (ua.indexOf('mac') >= 0 && navigator.maxTouchPoints > 1);
  var safeName = (filename || 'contact') + '.vcf';

  // METHOD 1 (Android, Desktop): blob + <a download>
  // METHOD 2 (iOS): navigate to data: URL — iOS detects vCard MIME and prompts user
  try {
    if (isIOS) {
      // iOS: use data URL so Safari triggers "Add Contact" sheet
      var b64;
      try {
        // Use TextEncoder + btoa for proper UTF-8 base64 (handles names with Hindi/emoji)
        var bytes = new TextEncoder().encode(vcfText);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        b64 = btoa(bin);
      } catch(e) {
        b64 = btoa(unescape(encodeURIComponent(vcfText)));  // legacy fallback
      }
      var dataUrl = 'data:text/vcard;charset=utf-8;base64,' + b64;
      // Open in new tab so user can tap "Add Contact" without losing the page
      var w = window.open(dataUrl, '_blank');
      if (!w) {
        // Popup blocked — fall back to direct navigation
        window.location.href = dataUrl;
      }
      return;
    }
    // Android / Desktop: blob download (browser handles native .vcf import)
    var blob = new Blob([vcfText], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = safeName;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try { document.body.removeChild(a); } catch(_){}
      try { URL.revokeObjectURL(url); } catch(_){}
    }, 200);
  } catch(err) {
    // Final fallback: data URL navigation works everywhere
    try {
      var fallbackUrl = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcfText);
      window.location.href = fallbackUrl;
    } catch(_){
      alert('Could not download contact. Please copy the details manually.');
    }
  }
}

    +   '<div class="c-business">' + escapeHtml(d.business_name) + '</div>'
    +   (bizMeta.length ? '<div class="c-business-meta">' + bizMeta.map(function(x){ return '<span>' + escapeHtml(x) + '</span>'; }).join('') + '</div>' : '')
    +   statRow
    +   uspHtml
    +   proHtml
    +   catChips
    +   '<div class="c-divider"></div>'
    +   '<div class="c-meta">'
    +     metaRows.map(function(r){ return '<div class="c-meta-row"><span class="c-meta-ico">' + r.ico + '</span><span class="c-meta-val">' + escapeHtml(r.val) + '</span></div>'; }).join('')
    +   '</div>'
    +   payHtml
    +   featHtml
    +   socialHtml
    +   '<div class="c-brand-strip">'
    +     '<span><b>DukanList</b> Verified Local Establishment</span>'
    +     '<span class="c-brand-strip-right">dukanlist.com</span>'
    +   '</div>'
    + '</div>'
    + '<button class="save-cta" id="saveBtn" onclick="saveContact()">'
    +   '📥 Save ' + escapeHtml((d.displayName || d.business_name).split(/\s+/).slice(0,2).join(' ')) + ' to my Contacts'
    + '</button>'
    + '<div class="save-hint" style="font-size:.78rem;color:rgba(255,255,255,.78);text-align:center;margin-top:8px;line-height:1.45">'
    +   '💡 Tap the button → your phone will show '
    +   '<b style="color:#FBBF24">"Add Contact"</b> screen → tap to save'
    + '</div>'
    + '<div class="quick-actions" style="grid-template-columns:repeat(' + (mapsUrl ? 4 : 3) + ', 1fr)">'
    + (d.mobile ? '<a class="qa" href="tel:+91' + (function(r){var x=String(r||'').replace(/[^0-9]/g,'');if(x.length===12&&x.slice(0,2)==='91')x=x.slice(2);else if(x.length===11&&x[0]==='0')x=x.slice(1);return x.slice(-10);})(d.mobile) + '"><span class="qa-ico">📞</span>Call</a>' : '<span></span>')
    + (d.whatsapp ? '<a class="qa qa-wa" href="https://wa.me/91' + (function(r){var x=String(r||'').replace(/[^0-9]/g,'');if(x.length===12&&x.slice(0,2)==='91')x=x.slice(2);else if(x.length===11&&x[0]==='0')x=x.slice(1);return x.slice(-10);})(d.whatsapp) + '?text=' + encodeURIComponent('Hi, I got your digital card from DukanList. Could you help me with…') + '" target="_blank"><span class="qa-ico">💬</span>WhatsApp</a>' : '<span></span>')
    + (mapsUrl ? '<a class="qa" href="' + escapeHtml(mapsUrl) + '" target="_blank"><span class="qa-ico">📍</span>Directions</a>' : '')
    + '<a class="qa" href="' + escapeHtml('/business.html?slug=' + encodeURIComponent(d.slug || '')) + '" target="_blank"><span class="qa-ico">🌐</span>Profile</a>'
    + '</div>';

  document.getElementById('content').innerHTML = html;
}

async function saveContact(){
  var d = window.CARD_DATA;
  if (!d){ toast('Card not loaded yet'); return; }
  var btn = document.getElementById('saveBtn');

  // CRITICAL: Build vCard SYNCHRONOUSLY before navigator.share() —
  // any await between user click and share() expires the user-gesture
  // token, causing share() to silently fall through to download path.
  // Photo embed deliberately SKIPPED here (it requires async fetch +
  // base64 conversion which kills the gesture). Photo is fetched in
  // the background instead and used on subsequent saves.
  var vcf = buildVCard(d);  // SYNC — vCard text without photo (still complete contact)
  var safeName = (d.displayName || d.business_name || 'contact').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_').slice(0,40);

  var ua = (navigator.userAgent || '').toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua) || (ua.indexOf('mac') >= 0 && navigator.maxTouchPoints > 1);
  var isAndroid = /android/.test(ua);

  // ============================================================
  // STRATEGY 1: Web Share API with file — BEST for Android/iOS.
  // Must run SYNCHRONOUSLY after the user click.
  // Android Chrome blocks some MIME types — try alternates in order.
  // ============================================================
  var sharedViaApi = false;
  console.log('[saveContact] Attempting share. canShare available?', !!navigator.canShare);
  try {
    if (navigator.canShare && typeof File !== 'undefined') {
      // Try multiple MIME types — Chrome on Android sometimes blocks text/vcard
      var mimeAttempts = ['text/vcard', 'text/x-vcard', 'text/directory', 'text/plain'];
      var vcfFile = null;
      var pickedMime = null;
      for (var mi = 0; mi < mimeAttempts.length; mi++){
        var trial = new File([vcf], safeName + '.vcf', { type: mimeAttempts[mi] });
        var ok = false;
        try { ok = navigator.canShare({ files: [trial] }); } catch(_){ ok = false; }
        console.log('[saveContact] canShare', mimeAttempts[mi], '→', ok);
        if (ok){
          vcfFile = trial;
          pickedMime = mimeAttempts[mi];
          break;
        }
      }

      if (vcfFile){
        console.log('[saveContact] Sharing with MIME:', pickedMime);
        // Fire share() IMMEDIATELY — user gesture still active here.
        var sharePromise = navigator.share({
          files: [vcfFile],
          title: 'Add ' + (d.displayName || d.business_name || 'contact'),
          text: 'Tap "Contacts" to save'
        });
        btn.textContent = '📲 Opening share sheet…';
        await sharePromise;
        sharedViaApi = true;
        console.log('[saveContact] Share completed successfully');
      } else {
        console.warn('[saveContact] No MIME type accepted by canShare — falling through to download');
      }
    } else {
      console.warn('[saveContact] navigator.canShare not available');
    }
  } catch (e) {
    console.warn('[saveContact] Web Share failed:', e && e.name, e && e.message);
    if (e && e.name === 'AbortError') {
      btn.className = 'save-cta';
      btn.textContent = '📥 Save ' + ((d.displayName || d.business_name || '').split(/\s+/).slice(0,2).join(' ')) + ' to my Contacts';
      return;
    }
  }

  // ============================================================
  // STRATEGY 2: Platform-specific fallback with VISUAL guide
  // ============================================================
  if (!sharedViaApi) {
    btn.textContent = '⏳ Opening contact…';
    downloadVCard(vcf, safeName);

    // Show a BIG overlay with clear next-step instructions
    showSaveInstructions(isIOS, isAndroid, d);
  }

  // Visual confirmation
  btn.className = 'save-cta success';
  btn.textContent = sharedViaApi ? '✓ Share opened — pick Contacts' : '✓ Contact ready to add';
  setTimeout(function(){
    btn.className = 'save-cta';
    btn.textContent = '📥 Save again';
  }, 5000);

  // Track save action
  try {
    if (window.ShopDB && ShopDB.client && d.id) {
      ShopDB.client.rpc('log_lead', { p_business_id: d.id, p_action: 'card_save' }).catch(function(){});
    }
  } catch(_){}
}

async function loadCard(){
  var qs = new URLSearchParams(location.search);
  var slug = qs.get('slug') || qs.get('s');
  var id   = qs.get('id');
  if (!slug && !id){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">❌</div><div>No card specified.<br><small>Open via your DukanList listing link.</small></div></div>';
    return;
  }
  var c = ShopDB.client;
  // Use minimal query (no FK joins) to avoid 400 errors from
  // ambiguous category FK on businesses table. Fetch category
  // separately if needed (faster + safer pattern, same as dashboard).
  // Pull all card data in one query. No FK joins (avoids 400 ambiguity).
  var query = c.from('businesses')
    .select('id, slug, name, owner_name, owner_role, mobile, whatsapp, email, address_line1, address_line2, pincode, photos, verified_score, status, sub_category_id, category_id, city_id, rating_avg, rating_count, hours_json, established_year, usp_text, payment_methods, special_features, facebook_url, instagram_url, youtube_url, x_twitter_url, linkedin_url, website_url, geo_cities(name), is_professional_listing, professional_tier, membership_no, membership_authority, professional_qualification, practice_areas, prof_verified_at');
  if (slug) query = query.eq('slug', slug);
  else      query = query.eq('id', id);

  var r = await query.maybeSingle();
  if (r.error || !r.data){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">⚠️</div><div>Could not load this card.<br><small>The listing may have been removed.</small></div></div>';
    return;
  }
  var b = r.data;
  if (b.status !== 'active'){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">⏳</div><div>This card is not active yet.<br><small>The business is pending verification.</small></div></div>';
    return;
  }

  // Fetch primary category name (avoids FK ambiguity)
  var catName = '';
  var primaryCatId = b.sub_category_id || b.category_id;
  if (primaryCatId){
    try {
      var catRes = await c.from('categories').select('name').eq('id', primaryCatId).maybeSingle();
      if (catRes && catRes.data) catName = catRes.data.name;
    } catch(_){}
  }

  // Fetch ALL categories for multi-cat chips (best-effort)
  var allCats = catName ? [catName] : [];
  try {
    var mcRes = await c.rpc('get_business_categories', { p_business_id: b.id });
    if (mcRes && mcRes.data && mcRes.data.length){
      mcRes.data.sort(function(x, y){ return (y.is_primary ? 1 : 0) - (x.is_primary ? 1 : 0); });
      allCats = mcRes.data.map(function(x){ return x.name; }).filter(Boolean);
    }
  } catch(_){}

  // Build display data
  var firstPhoto = Array.isArray(b.photos) && b.photos.length ? b.photos[0] : null;
  var displayName = applyRolePrefix(b.owner_name, b.owner_role);
  var nameParts = (b.owner_name || '').trim().split(/\s+/);
  var firstName = nameParts[0] || '';
  var lastName  = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
  var data = {
    slug:          b.slug,
    business_id:   b.id,
    displayName:   displayName || b.name,
    owner_name:    b.owner_name,
    first_name:    firstName,
    last_name:     lastName,
    role:          b.owner_role || '',
    business_name: b.name,
    category_name: catName,
    mobile:        b.mobile,
    whatsapp:      b.whatsapp,
    email:         b.email,
    address_line1: b.address_line1,
    address_line2: b.address_line2,
    city:          b.geo_cities ? b.geo_cities.name : '',
    pincode:       b.pincode,
    photo_url:     firstPhoto,
    website:       'https://dukanlist.com/' + b.slug,
    verified:      (b.verified_score || 0) >= 3,
    verified_score: b.verified_score || 0,
    rating_avg:    Number(b.rating_avg) || 0,
    rating_count:  Number(b.rating_count) || 0,
    hours_json:    b.hours_json || null,
    established_year: b.established_year || null,
    usp_text:      (b.usp_text || '').toString().trim(),
    all_categories: allCats,
    payment_methods: Array.isArray(b.payment_methods) ? b.payment_methods : [],
    special_features: Array.isArray(b.special_features) ? b.special_features : [],
    socials: {
      facebook:  b.facebook_url   || '',
      instagram: b.instagram_url  || '',
      youtube:   b.youtube_url    || '',
      x_twitter: b.x_twitter_url  || '',
      linkedin:  b.linkedin_url   || '',
      website:   b.website_url    || ''
    },
    // ---- Professional Listing fields (db/145 onwards) ----
    is_pro:                b.is_professional_listing === true,
    pro_tier:              (b.professional_tier || '').toString().toLowerCase(),
    membership_no:         (b.membership_no || '').toString().trim(),
    membership_authority:  (b.membership_authority || '').toString().trim(),
    qualification:         (b.professional_qualification || '').toString().trim(),
    practice_areas:        Array.isArray(b.practice_areas) ? b.practice_areas : [],
    pro_verified_at:       b.prof_verified_at || null
  };
  // Convenience flags used by render() for compliance gating
  data.is_pro_strict  = data.is_pro && data.pro_tier === 'strict';
  data.is_pro_partial = data.is_pro && data.pro_tier === 'partial';
  data.pro_verified   = data.is_pro && !!data.pro_verified_at;

  // Page title + meta
  document.title = (data.displayName || data.business_name) + ' · Digital Business Card';
  var topTag = document.getElementById('topTag');
  if (topTag) topTag.innerHTML = '<em>📇 ' + escapeHtml(data.business_name) + '</em> · Digital Card';

  render(data);
}

loadCard();
</script>
