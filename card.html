<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B1E3F">
<title>Digital Business Card — DukanList</title>
<meta name="description" content="Save this contact to your phone in one tap. Powered by DukanList.">
<meta property="og:title" content="Digital Business Card">
<meta property="og:description" content="Tap to save this contact to your phone.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Manrope:wght@500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    background:linear-gradient(180deg, #F1F5F9 0%, #E2E8F0 100%);
    color:#0F172A; min-height:100vh; padding:24px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .page{ max-width:480px; margin:0 auto }

  /* Top tag */
  .top-tag{ text-align:center; margin-bottom:16px; font-size:12px; color:#64748b; letter-spacing:.1em; text-transform:uppercase; font-weight:700 }
  .top-tag em{ color:#0F172A; font-style:normal }

  /* ========== GLOSSY CARD (Apple Wallet style) ========== */
  .card{
    position:relative;
    border-radius:22px;
    padding:28px 24px 24px;
    color:#fff;
    box-shadow:
      0 24px 48px -12px rgba(15,23,42,.45),
      0 8px 18px -4px rgba(15,23,42,.20),
      inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
    isolation:isolate;
    min-height:280px;
  }
  /* Default theme: Imperial Navy + Gold */
  .card.theme-navy{
    background:
      radial-gradient(120% 80% at -10% -20%, rgba(245,158,11,.18) 0%, transparent 55%),
      radial-gradient(140% 100% at 110% 120%, rgba(30,58,138,.55) 0%, transparent 60%),
      linear-gradient(135deg, #0B1E3F 0%, #1E3A8A 50%, #0F172A 100%);
  }
  .card.theme-medical{
    background:
      radial-gradient(120% 80% at -10% -20%, rgba(16,185,129,.25) 0%, transparent 55%),
      linear-gradient(135deg, #ECFEFF 0%, #BAE6FD 50%, #F0F9FF 100%);
    color:#0F172A;
  }
  .card.theme-medical .c-name, .card.theme-medical .c-title-line{ color:#0F172A }
  .card.theme-medical .c-business{ color:#0369A1 }
  .card.theme-medical .c-meta-label{ color:#64748b }
  .card.theme-medical .c-meta-val{ color:#0F172A }
  .card.theme-medical .c-divider{ background:rgba(15,23,42,.12) }
  .card.theme-medical .c-brand-strip{ background:rgba(255,255,255,.6); color:#0F172A }

  .card.theme-legal{
    background:
      radial-gradient(120% 80% at -10% -20%, rgba(217,119,6,.22) 0%, transparent 55%),
      linear-gradient(135deg, #18181B 0%, #27272A 50%, #000 100%);
  }
  .card.theme-legal .c-name{ font-family:'Cinzel','Plus Jakarta Sans',serif }

  .card.theme-finance{
    background:
      radial-gradient(120% 80% at -10% -20%, rgba(255,255,255,.10) 0%, transparent 55%),
      linear-gradient(135deg, #1E40AF 0%, #1E3A8A 50%, #312E81 100%);
  }

  .card.theme-vibrant{
    background:
      radial-gradient(120% 80% at -10% -20%, rgba(251,191,36,.22) 0%, transparent 55%),
      linear-gradient(135deg, #C2410C 0%, #FF6B1A 50%, #B91C1C 100%);
  }

  /* Subtle holographic shimmer */
  .card::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(125deg, transparent 0%, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%, transparent 100%);
    z-index:0;
  }
  .card > *{ position:relative; z-index:1 }

  /* Top row: photo + verified badge */
  .c-top{ display:flex; align-items:center; gap:14px; margin-bottom:14px }
  .c-photo{
    width:64px; height:64px; border-radius:50%; overflow:hidden;
    border:2.5px solid rgba(255,255,255,.4); flex-shrink:0;
    background:rgba(255,255,255,.1); display:grid; place-items:center;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:900; font-size:24px; color:rgba(255,255,255,.85);
    box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
  .c-photo img{ width:100%; height:100%; object-fit:cover; display:block }
  .c-title-block{ flex:1; min-width:0 }
  .c-name{ font-family:'Plus Jakarta Sans',sans-serif; font-size:1.45rem; font-weight:800; letter-spacing:-.01em; line-height:1.15; word-break:break-word }
  .c-title-line{ font-size:.85rem; font-weight:600; color:rgba(255,255,255,.85); margin-top:3px; line-height:1.3 }
  .c-verified{
    background:linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    color:#78350F; padding:4px 9px; border-radius:5px;
    font-size:.62rem; font-weight:900; letter-spacing:.08em;
    box-shadow:0 2px 6px rgba(245,158,11,.4);
    flex-shrink:0; align-self:flex-start;
  }

  /* Business line */
  .c-business{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:1.05rem; font-weight:700;
    color:rgba(255,255,255,.95); margin-bottom:6px;
    letter-spacing:.01em; line-height:1.2;
  }
  .c-business-meta{
    font-size:.75rem; font-weight:600; color:rgba(255,255,255,.65);
    letter-spacing:.01em; margin-bottom:18px;
  }
  .c-business-meta span{ display:inline }
  .c-business-meta span + span::before{ content:' · '; opacity:.5 }

  .c-divider{
    height:1px; background:rgba(255,255,255,.15); margin:14px 0 12px;
  }

  /* Meta rows */
  .c-meta{ display:grid; gap:6px; font-size:.85rem; line-height:1.4 }
  .c-meta-row{ display:flex; gap:8px; align-items:flex-start }
  .c-meta-ico{ font-size:.92rem; opacity:.85; flex-shrink:0; width:18px; text-align:center }
  .c-meta-val{ color:rgba(255,255,255,.92); font-weight:600; word-break:break-word; flex:1 }

  /* Bottom DukanList strip */
  .c-brand-strip{
    margin-top:16px; padding:8px 12px;
    background:rgba(255,255,255,.08);
    border-radius:10px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; font-size:.7rem; font-weight:700; color:rgba(255,255,255,.78);
    letter-spacing:.04em;
  }
  .c-brand-strip b{ color:#fff }
  .c-brand-strip-right{ font-size:.65rem; opacity:.7 }

  /* ========== ACTIONS BELOW CARD ========== */
  .save-cta{
    display:block; width:100%;
    background:linear-gradient(135deg, #FF6B1A 0%, #EA580C 100%);
    color:#fff; border:none; padding:18px 20px;
    border-radius:14px; font-family:inherit; font-weight:800;
    font-size:1.05rem; cursor:pointer; margin-top:22px;
    box-shadow:0 12px 26px -8px rgba(255,107,26,.55), 0 4px 10px rgba(255,107,26,.25);
    transition:transform .12s, box-shadow .12s;
    letter-spacing:.01em;
  }
  .save-cta:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -8px rgba(255,107,26,.65) }
  .save-cta:active{ transform:translateY(0) }
  .save-cta.success{ background:linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow:0 12px 26px -8px rgba(16,185,129,.45) }

  /* Quick action chips */
  .quick-actions{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px;
  }
  .qa{
    background:#fff; color:#0F172A; border:1.5px solid #E2E8F0;
    padding:13px 8px; border-radius:12px; text-decoration:none;
    text-align:center; font-weight:700; font-size:.82rem;
    transition:.15s; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .qa:hover{ background:#F8FAFC; border-color:#CBD5E1; transform:translateY(-1px); box-shadow:0 4px 8px rgba(15,23,42,.06) }
  .qa-ico{ font-size:1.3rem; line-height:1 }
  .qa-wa{ background:#25D366; color:#fff; border-color:#25D366 }
  .qa-wa:hover{ background:#1DA851; border-color:#1DA851 }

  /* Footer */
  .footer{
    margin-top:30px; text-align:center; font-size:.74rem; color:#64748b;
    line-height:1.6;
  }
  .footer a{ color:#1E3A8A; font-weight:700; text-decoration:none }
  .footer .powered{ font-size:.7rem; color:#94a3b8; margin-top:6px }
  .footer .powered b{ color:#0F172A; font-weight:800 }

  /* Loading + Error */
  .state{ text-align:center; padding:80px 20px; color:#64748b }
  .state .ico{ font-size:2.5rem; margin-bottom:10px; opacity:.5 }

  /* Toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#0F172A; color:#fff; padding:11px 18px; border-radius:10px;
    font-size:14px; font-weight:600; z-index:1000;
    box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0;
    transition:opacity .2s, transform .2s;
    pointer-events:none; max-width:90%;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px) }

  @media (max-width:380px){
    .card{ padding:24px 20px 20px; min-height:260px }
    .c-name{ font-size:1.3rem }
    .c-photo{ width:56px; height:56px; font-size:22px }
    .quick-actions{ gap:8px }
    .qa{ padding:11px 6px; font-size:.78rem }
  }
</style>
</head>

<div class="page">

  <div class="top-tag" id="topTag">
    <em>📇 Digital Business Card</em>
  </div>

  <div id="content">
    <div class="state">
      <div class="ico">⏳</div>
      <div>Loading card…</div>
    </div>
  </div>

  <div class="footer">
    <div class="powered">
      Powered by <b>DukanList</b> · Bharat's local directory · <a href="https://dukanlist.com" target="_blank">dukanlist.com</a>
    </div>
    <div style="margin-top:4px;font-size:.68rem;color:#94a3b8">List your business <a href="https://dukanlist.com/register.html" target="_blank">free →</a></div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script>
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

// Smart name prefix based on owner_role
function applyRolePrefix(name, role){
  if (!name) return '';
  var r = (role || '').toLowerCase();
  if (r.indexOf('doctor') >= 0) return 'Dr. ' + name;
  if (r.indexOf('chartered accountant') >= 0 || r === 'ca') return 'CA ' + name;
  if (r.indexOf('advocate') >= 0 || r.indexOf('lawyer') >= 0) return 'Adv. ' + name;
  if (r.indexOf('architect') >= 0) return 'Ar. ' + name;
  if (r.indexOf('engineer') >= 0 && r.indexOf('architect') < 0) return 'Er. ' + name;
  if (r.indexOf('pandit') >= 0 || r.indexOf('acharya') >= 0) return 'Pt. ' + name;
  return name;
}

// Pick theme based on category/role
function pickTheme(role, catName, urlTheme){
  if (urlTheme && ['navy','medical','legal','finance','vibrant'].indexOf(urlTheme) >= 0) return urlTheme;
  var r = (role || '').toLowerCase() + ' ' + (catName || '').toLowerCase();
  if (/doctor|hospital|clinic|dentist|medical|pharma/.test(r)) return 'medical';
  if (/advocate|lawyer|legal/.test(r)) return 'legal';
  if (/chartered|tax|broker|mutual|insurance|financial|bank/.test(r)) return 'finance';
  return 'navy';
}

// Build vCard 3.0 string
function buildVCard(d){
  function esc(v){ return String(v == null ? '' : v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
  var lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'FN:' + esc(d.displayName || d.owner_name || d.business_name),
    'N:' + esc(d.last_name || '') + ';' + esc(d.first_name || d.owner_name || '') + ';;;',
    'ORG:' + esc(d.business_name || ''),
    'TITLE:' + esc(d.role || ''),
  ];
  if (d.mobile){
    lines.push('TEL;TYPE=CELL,VOICE:+91' + esc(d.mobile));
  }
  if (d.whatsapp && d.whatsapp !== d.mobile){
    lines.push('TEL;TYPE=WORK,VOICE:+91' + esc(d.whatsapp));
  }
  if (d.email){
    lines.push('EMAIL;TYPE=WORK,INTERNET:' + esc(d.email));
  }
  if (d.address_line1 || d.city){
    lines.push('ADR;TYPE=WORK:;;' + esc(d.address_line1 || '') + (d.address_line2 ? ', ' + esc(d.address_line2) : '') + ';' + esc(d.city || '') + ';' + esc(d.state || '') + ';' + esc(d.pincode || '') + ';India');
  }
  if (d.website){
    lines.push('URL:' + esc(d.website));
  }
  if (d.photo_data){
    // photo_data is "JPEG:base64..." or "PNG:base64..."
    var pp = d.photo_data.split(':');
    if (pp.length === 2){
      lines.push('PHOTO;TYPE=' + pp[0] + ';ENCODING=BASE64:' + pp[1]);
    }
  }
  lines.push('NOTE:Listed on DukanList — Bharat\'s local directory · dukanlist.com');
  lines.push('END:VCARD');
  return lines.join('\r\n');
}

// Fetch photo URL → base64
async function photoToBase64(url){
  try {
    var r = await fetch(url, { mode: 'cors' });
    if (!r.ok) return null;
    var blob = await r.blob();
    if (blob.size > 500000) return null; // skip if >500KB
    return await new Promise(function(res){
      var rd = new FileReader();
      rd.onload = function(){
        var s = rd.result;
        var comma = s.indexOf(',');
        var type = s.indexOf('jpeg') >= 0 ? 'JPEG' : (s.indexOf('png') >= 0 ? 'PNG' : 'JPEG');
        res(type + ':' + s.slice(comma + 1));
      };
      rd.onerror = function(){ res(null); };
      rd.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}

function downloadVCard(vcfText, filename){
  var blob = new Blob([vcfText], { type: 'text/vcard;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (filename || 'contact') + '.vcf';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

window.CARD_DATA = null;

function render(d){
  window.CARD_DATA = d;
  var theme = pickTheme(d.role, d.category_name, new URLSearchParams(location.search).get('theme'));

  var photoHtml = d.photo_url
    ? '<img src="' + escapeHtml(d.photo_url) + '" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + (d.displayName || 'X').charAt(0).toUpperCase() + '\'">'
    : escapeHtml((d.displayName || d.business_name || 'X').charAt(0).toUpperCase());

  var metaRows = [];
  if (d.mobile)    metaRows.push({ ico:'📞', val: '+91 ' + d.mobile });
  if (d.whatsapp && d.whatsapp !== d.mobile) metaRows.push({ ico:'💬', val: '+91 ' + d.whatsapp + ' (WhatsApp)' });
  if (d.email)     metaRows.push({ ico:'✉️', val: d.email });
  if (d.website)   metaRows.push({ ico:'🌐', val: d.website.replace(/^https?:\/\//, '') });
  var addr = [d.address_line1, d.address_line2, d.city, d.pincode].filter(Boolean).join(', ');
  if (addr) metaRows.push({ ico:'📍', val: addr });

  var bizMeta = [d.category_name, d.city].filter(Boolean);

  var html = ''
    + '<div class="card theme-' + theme + '" id="bcard">'
    +   '<div class="c-top">'
    +     '<div class="c-photo">' + photoHtml + '</div>'
    +     '<div class="c-title-block">'
    +       '<div class="c-name">' + escapeHtml(d.displayName || d.business_name) + '</div>'
    +       (d.role ? '<div class="c-title-line">' + escapeHtml(d.role) + '</div>' : '')
    +     '</div>'
    +     (d.verified ? '<span class="c-verified">✓ VERIFIED</span>' : '')
    +   '</div>'
    +   '<div class="c-business">' + escapeHtml(d.business_name) + '</div>'
    +   (bizMeta.length ? '<div class="c-business-meta">' + bizMeta.map(function(x){ return '<span>' + escapeHtml(x) + '</span>'; }).join('') + '</div>' : '')
    +   '<div class="c-divider"></div>'
    +   '<div class="c-meta">'
    +     metaRows.map(function(r){
            return '<div class="c-meta-row"><span class="c-meta-ico">' + r.ico + '</span><span class="c-meta-val">' + escapeHtml(r.val) + '</span></div>';
          }).join('')
    +   '</div>'
    +   '<div class="c-brand-strip">'
    +     '<span><b>DukanList</b> Verified Local Establishment</span>'
    +     '<span class="c-brand-strip-right">dukanlist.com</span>'
    +   '</div>'
    + '</div>'
    + '<button class="save-cta" id="saveBtn" onclick="saveContact()">'
    +   '📥 Save ' + escapeHtml((d.displayName || d.business_name).split(/\s+/).slice(0,2).join(' ')) + ' to my Contacts'
    + '</button>'
    + '<div class="quick-actions">'
    + (d.mobile ? '<a class="qa" href="tel:+91' + escapeHtml(d.mobile) + '"><span class="qa-ico">📞</span>Call</a>' : '<span></span>')
    + (d.whatsapp ? '<a class="qa qa-wa" href="https://wa.me/91' + escapeHtml(d.whatsapp) + '?text=' + encodeURIComponent('Hi, I got your digital card from DukanList. Could you help me with…') + '" target="_blank"><span class="qa-ico">💬</span>WhatsApp</a>' : '<span></span>')
    + '<a class="qa" href="' + escapeHtml(d.website || ('https://dukanlist.com/' + d.slug)) + '" target="_blank"><span class="qa-ico">🌐</span>View Profile</a>'
    + '</div>';

  document.getElementById('content').innerHTML = html;
}

async function saveContact(){
  var d = window.CARD_DATA;
  if (!d){ toast('Card not loaded yet'); return; }
  var btn = document.getElementById('saveBtn');
  btn.textContent = '⏳ Preparing contact…';
  // Try to embed photo (best-effort, doesn't block)
  if (d.photo_url && !d.photo_data){
    try { d.photo_data = await photoToBase64(d.photo_url); } catch(_){}
  }
  var vcf = buildVCard(d);
  var safeName = (d.displayName || d.business_name || 'contact').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  downloadVCard(vcf, safeName);
  btn.className = 'save-cta success';
  btn.textContent = '✓ Saved! Check your contacts';
  toast('Contact downloaded — phone will prompt to save');
  setTimeout(function(){
    btn.className = 'save-cta';
    btn.textContent = '📥 Save again';
  }, 4000);
}

async function loadCard(){
  var qs = new URLSearchParams(location.search);
  var slug = qs.get('slug') || qs.get('s');
  var id   = qs.get('id');
  if (!slug && !id){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">❌</div><div>No card specified.<br><small>Open via your DukanList listing link.</small></div></div>';
    return;
  }
  var c = ShopDB.client;
  // Use minimal query (no FK joins) to avoid 400 errors from
  // ambiguous category FK on businesses table. Fetch category
  // separately if needed (faster + safer pattern, same as dashboard).
  var query = c.from('businesses')
    .select('id, slug, name, owner_name, owner_role, mobile, whatsapp, email, address_line1, address_line2, pincode, photos, verified_score, status, sub_category_id, category_id, city_id, geo_cities(name)');
  if (slug) query = query.eq('slug', slug);
  else      query = query.eq('id', id);

  var r = await query.maybeSingle();
  if (r.error || !r.data){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">⚠️</div><div>Could not load this card.<br><small>The listing may have been removed.</small></div></div>';
    return;
  }
  var b = r.data;
  if (b.status !== 'active'){
    document.getElementById('content').innerHTML = '<div class="state"><div class="ico">⏳</div><div>This card is not active yet.<br><small>The business is pending verification.</small></div></div>';
    return;
  }

  // Fetch category name separately (avoids FK ambiguity)
  var catName = '';
  var primaryCatId = b.sub_category_id || b.category_id;
  if (primaryCatId){
    try {
      var catRes = await c.from('categories').select('name').eq('id', primaryCatId).maybeSingle();
      if (catRes && catRes.data) catName = catRes.data.name;
    } catch(_){}
  }

  // Build display data
  var firstPhoto = Array.isArray(b.photos) && b.photos.length ? b.photos[0] : null;
  var displayName = applyRolePrefix(b.owner_name, b.owner_role);
  var nameParts = (b.owner_name || '').trim().split(/\s+/);
  var firstName = nameParts[0] || '';
  var lastName  = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
  var data = {
    slug:          b.slug,
    business_id:   b.id,
    displayName:   displayName || b.name,
    owner_name:    b.owner_name,
    first_name:    firstName,
    last_name:     lastName,
    role:          b.owner_role || '',
    business_name: b.name,
    category_name: catName,
    mobile:        b.mobile,
    whatsapp:      b.whatsapp,
    email:         b.email,
    address_line1: b.address_line1,
    address_line2: b.address_line2,
    city:          b.geo_cities ? b.geo_cities.name : '',
    pincode:       b.pincode,
    photo_url:     firstPhoto,
    website:       'https://dukanlist.com/' + b.slug,
    verified:      (b.verified_score || 0) >= 3
  };

  // Page title + meta
  document.title = (data.displayName || data.business_name) + ' · Digital Business Card';
  var topTag = document.getElementById('topTag');
  if (topTag) topTag.innerHTML = '<em>📇 ' + escapeHtml(data.business_name) + '</em> · Digital Card';

  render(data);
}

loadCard();
</script>
