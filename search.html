<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<meta name="theme-color" content="#FF6B1A">
<title>Search Shops — dukanlist.com</title>
<meta name="description" content="Find local shops, services, doctors, carpenters, mechanics near you.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏪</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<style>
.search-bar{ background:#fff; padding:14px; border-radius:12px; box-shadow:var(--shadow-sm); display:grid; grid-template-columns:1.5fr 1fr 1fr auto; gap:8px; margin-bottom:18px }
@media (max-width:700px){ .search-bar{ grid-template-columns:1fr 1fr; gap:6px } .search-bar .search-btn{ grid-column:1/-1 } }
.search-bar input,.search-bar select{ padding:10px 12px 10px 36px; border:1px solid var(--line); border-radius:8px; font-size:.9rem; font-family:inherit; width:100%; color:var(--ink) }
.search-bar .field{ position:relative }
.search-bar .field .ico{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:.95rem; opacity:.6 }
.search-bar .search-btn{ background:linear-gradient(135deg,var(--saffron),var(--saffron-deep)); color:#fff; border:none; border-radius:8px; padding:0 18px; font-weight:800; cursor:pointer; font-family:inherit; font-size:.92rem; min-height:42px }

.result-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px }
.result-count{ font-size:.85rem; color:var(--muted); font-weight:700 }
.result-count b{ color:var(--ink) }

.biz-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px }
.biz-card{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:.18s; cursor:pointer; text-decoration:none; color:inherit; display:flex; flex-direction:column }
.biz-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--saffron); text-decoration:none }
.biz-photo{ aspect-ratio:16/10; background:linear-gradient(135deg,#FAFAFA,#F1F5F9); position:relative; overflow:hidden }
.biz-photo img{ width:100%; height:100%; object-fit:cover }
.biz-photo .ph-fb{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:3.5rem; opacity:.4 }
.biz-photo .verify{ position:absolute; top:8px; right:8px; background:rgba(5,150,105,.95); color:#fff; padding:3px 9px; border-radius:99px; font-size:.7rem; font-weight:800; backdrop-filter:blur(8px) }
.biz-info{ padding:13px 14px; flex:1; display:flex; flex-direction:column; gap:4px }
.biz-cat{ font-size:.72rem; color:var(--saffron-deep); font-weight:800; letter-spacing:.04em; text-transform:uppercase }
.biz-name{ font-family:'Plus Jakarta Sans',sans-serif; font-size:1.05rem; font-weight:800; color:var(--ink); line-height:1.2 }
.biz-usp{ font-size:.83rem; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.biz-meta{ display:flex; align-items:center; gap:10px; margin-top:6px; font-size:.78rem; color:var(--muted); padding-top:8px; border-top:1px dashed var(--line) }
.biz-meta .rating{ color:var(--ink); font-weight:700 }
.biz-meta .loc{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

.empty{ text-align:center; padding:50px 20px; color:var(--muted) }
.empty .ico{ font-size:3rem; opacity:.4; margin-bottom:10px; display:block }
.empty b{ display:block; color:var(--ink); font-size:1.05rem; margin-bottom:6px }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand"><span class="logo">🏪</span><span>Dukan<em>List</em></span></a>
    <nav class="nav-links">
      <div class="lang-toggle">
        <button onclick="setLang('en')" id="langBtnEn">EN</button>
        <button onclick="setLang('hi')" id="langBtnHi" class="keep-en">हिं</button>
      </div>
      <a href="/browse.html"><span data-i18n-en>Categories</span><span data-i18n-hi>श्रेणियाँ</span></a>
      <a href="/panel/login.html"><span data-i18n-en>Login</span><span data-i18n-hi>लॉगिन</span></a>
      <a href="/register.html" class="nav-cta">
        <span data-i18n-en>+ Register</span><span data-i18n-hi>+ रजिस्टर</span>
      </a>
    </nav>
  </div>
</header>

<div class="page">

  <h1 class="title">
    <span data-i18n-en>Find <span class="grad">Local</span> Shops</span>
    <span data-i18n-hi><span class="grad">लोकल</span> दुकान खोजें</span>
  </h1>

  <form class="search-bar" onsubmit="handleSearch(event)">
    <div class="field">
      <span class="ico">🔍</span>
      <input id="q" type="text" placeholder="Doctor, carpenter, mechanic..." autocomplete="off">
    </div>
    <div class="field">
      <span class="ico">📚</span>
      <select id="catSel"></select>
    </div>
    <div class="field">
      <span class="ico">📍</span>
      <select id="citySel"><option value="">All cities</option></select>
    </div>
    <button type="submit" class="search-btn">
      <span data-i18n-en>Search</span><span data-i18n-hi>खोजें</span>
    </button>
  </form>

  <div class="result-head">
    <div class="result-count" id="countDisp"></div>
    <div style="font-size:.78rem;color:var(--muted)">
      <span data-i18n-en>Sorted by relevance + trust score</span>
      <span data-i18n-hi>प्रासंगिकता + ट्रस्ट स्कोर के अनुसार</span>
    </div>
  </div>

  <div id="results"><div class="empty"><span class="ico">⏳</span>Loading...</div></div>

</div>

<footer class="site">
  © 2026 DigiMutual Goals Pvt. Ltd. · dukanlist.com
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-init.js"></script>
<script src="/assets/js/geo.js"></script>
<script>
function setLang(lang){
  if (lang!=='en'&&lang!=='hi') lang='en';
  document.documentElement.setAttribute('data-lang',lang);
  document.documentElement.setAttribute('lang',lang);
  localStorage.setItem('shop_lang',lang);
  document.getElementById('langBtnEn').classList.toggle('active',lang==='en');
  document.getElementById('langBtnHi').classList.toggle('active',lang==='hi');
}

let CATEGORIES = [], CITIES = [];

async function loadDropdowns(){
  // Categories
  try{
    const r = await fetch('/assets/data/categories.json');
    CATEGORIES = (await r.json()).categories;
    const sel = document.getElementById('catSel');
    sel.innerHTML = '<option value="">All categories</option>';
    CATEGORIES.forEach(c => sel.innerHTML += `<option value="${c.slug}">${c.icon} ${c.name}</option>`);
  }catch(e){ console.error(e); }

  // Cities — load from Supabase if available, else fallback
  const c = ShopDB.client;
  if (c){
    const { data } = await c.from('geo_cities').select('id, name').eq('active', true).order('name');
    if (data){
      CITIES = data;
      const sel = document.getElementById('citySel');
      data.forEach(ct => sel.innerHTML += `<option value="${ct.id}">${ct.name}</option>`);
    }
  }
}

async function runSearch(){
  const params = new URLSearchParams(location.search);
  const q       = params.get('q')    || '';
  const catSlug = params.get('cat')  || '';
  const cityId  = +params.get('city')|| null;

  document.getElementById('q').value = q;
  document.getElementById('catSel').value = catSlug;
  if (cityId) document.getElementById('citySel').value = cityId;

  const c = ShopDB.client;
  const resEl = document.getElementById('results');
  const countEl = document.getElementById('countDisp');
  resEl.innerHTML = '<div class="empty"><span class="ico">⏳</span>Searching...</div>';

  if (!c){
    resEl.innerHTML = `<div class="empty"><span class="ico">⚠️</span><b>Backend not configured</b>Configure Supabase URL in /assets/js/supabase-init.js</div>`;
    return;
  }

  const { data, error } = await c.rpc('search_businesses', {
    p_query   : q || null,
    p_category: catSlug || null,
    p_city_id : cityId,
    p_state_id: null,
    p_limit   : 50,
    p_offset  : 0
  });

  if (error){
    console.error(error);
    resEl.innerHTML = `<div class="empty"><span class="ico">⚠️</span><b>Search failed</b>${error.message}</div>`;
    return;
  }

  if (!data || !data.length){
    countEl.textContent = '';
    resEl.innerHTML = `
      <div class="empty">
        <span class="ico">🔍</span>
        <b><span data-i18n-en>No shops found</span><span data-i18n-hi>कोई दुकान नहीं मिली</span></b>
        <span data-i18n-en class="block">Try different keywords or browse all categories.</span>
        <span data-i18n-hi class="block">अलग कीवर्ड्स या सभी श्रेणियाँ ब्राउज़ करें।</span>
        <a href="/browse.html" style="display:inline-block;margin-top:10px;color:var(--saffron-deep);font-weight:700">
          <span data-i18n-en>← Browse all categories</span><span data-i18n-hi>← सभी श्रेणियाँ</span>
        </a>
      </div>`;
    return;
  }

  countEl.innerHTML = `<b>${data.length}</b> <span data-i18n-en>shop${data.length===1?'':'s'} found</span><span data-i18n-hi>दुकान मिली</span>`;
  resEl.innerHTML = `<div class="biz-grid">${data.map(renderCard).join('')}</div>`;
}

function renderCard(b){
  const photo = (b.photos && b.photos.length) ? b.photos[0] : null;
  const photoHTML = photo
    ? `<img src="${photo}" alt="${escapeHTML(b.name)}" loading="lazy">`
    : `<div class="ph-fb">${b.category_icon || '🏪'}</div>`;
  const verified = b.verified_score >= 3 ? '<span class="verify">✓ Verified</span>' : '';
  const rating = b.rating_avg > 0 ? `<span class="rating">⭐ ${Number(b.rating_avg).toFixed(1)} <span style="font-weight:500;color:var(--muted)">(${b.rating_count})</span></span>` : '<span style="color:var(--muted)">No reviews yet</span>';
  return `
    <a class="biz-card" href="/business.html?slug=${b.slug}">
      <div class="biz-photo">${photoHTML}${verified}</div>
      <div class="biz-info">
        <div class="biz-cat">${b.category_icon || '🏪'} ${escapeHTML(b.category_name || '')}</div>
        <div class="biz-name">${escapeHTML(b.name)}</div>
        <div class="biz-usp">${escapeHTML(b.usp_text || '')}</div>
        <div class="biz-meta">
          ${rating}
          <span class="loc">📍 ${escapeHTML(b.city_name || '')}</span>
        </div>
      </div>
    </a>`;
}

function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function handleSearch(e){
  e.preventDefault();
  const params = new URLSearchParams();
  const q = document.getElementById('q').value.trim();
  const cat = document.getElementById('catSel').value;
  const city = document.getElementById('citySel').value;
  if (q) params.set('q', q);
  if (cat) params.set('cat', cat);
  if (city) params.set('city', city);
  const url = '/search.html' + (params.toString() ? '?' + params.toString() : '');
  history.pushState({}, '', url);
  runSearch();
}

window.addEventListener('DOMContentLoaded', async () => {
  setLang(localStorage.getItem('shop_lang') || 'en');
  await loadDropdowns();
  runSearch();
});
window.addEventListener('popstate', runSearch);
</script>

</body>
</html>
