/* ===== Search bar (Apple-grade prominence) ===== */
.search-bar{
  background:#fff;
  padding:10px;
  border-radius:22px;
  box-shadow:0 20px 50px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
  display:grid;
  grid-template-columns:1.6fr 1fr 1fr auto;
  gap:8px;
  margin-bottom:36px;
  border:1px solid rgba(15,23,42,.04);
  transition:box-shadow .35s cubic-bezier(.22,.61,.36,1);
}
.search-bar:focus-within{ box-shadow:0 30px 80px rgba(15,23,42,.10), 0 1px 3px rgba(15,23,42,.04) }
@media (max-width:700px){ .search-bar{ grid-template-columns:1fr 1fr; gap:6px } .search-bar .search-btn{ grid-column:1/-1 } }
.search-bar input,.search-bar select{
  padding:14px 14px 14px 44px;
  border:none;
  background:transparent;
  border-radius:14px;
  font-size:.98rem;
  font-family:inherit;
  width:100%;
  color:var(--ink);
  font-weight:500;
  letter-spacing:-.005em;
}
.search-bar input:focus, .search-bar select:focus{ outline:none; background:#FAFAFA }
.search-bar .field{ position:relative }
.search-bar .field .ico{ position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1.05rem; opacity:.55 }
.search-bar .search-btn{
  background:linear-gradient(135deg,var(--saffron),var(--saffron-deep));
  color:#fff;
  border:none;
  border-radius:14px;
  padding:0 26px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  font-size:.96rem;
  min-height:50px;
  letter-spacing:-.005em;
  transition:transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .3s cubic-bezier(.22,.61,.36,1);
}
.search-bar .search-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 28px rgba(255,107,26,.4) }

.result-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:8px }
.result-count{ font-size:.95rem; color:#5A6573; font-weight:500; letter-spacing:-.005em }
.result-count b{ color:var(--ink); font-weight:600 }

/* ===== Result cards (Apple-grade) ===== */
.biz-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px }
.biz-card{
  background:#fff;
  border:1px solid rgba(15,23,42,.04);
  border-radius:20px;
  overflow:hidden;
  transition:transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s cubic-bezier(.22,.61,.36,1);
  cursor:pointer;
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
}
.biz-card:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 50px rgba(15,23,42,.08);
  text-decoration:none;
}
.biz-photo{ aspect-ratio:16/10; background:linear-gradient(135deg,#FAFAFA,#F1F5F9); position:relative; overflow:hidden }
.biz-photo img{ width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.22,.61,.36,1) }
.biz-card:hover .biz-photo img{ transform:scale(1.04) }
.biz-photo .ph-fb{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:3.5rem; opacity:.35 }
.biz-photo .verify{
  position:absolute; top:12px; right:12px;
  background:rgba(5,150,105,.94); color:#fff;
  padding:5px 12px; border-radius:99px;
  font-size:.72rem; font-weight:600;
  backdrop-filter:blur(10px);
  letter-spacing:-.005em;
}
.biz-info{ padding:18px 20px 18px; flex:1; display:flex; flex-direction:column; gap:5px }
.biz-cat{ font-size:.76rem; color:var(--saffron-deep); font-weight:600; letter-spacing:.01em; margin-bottom:2px }
.biz-name{ font-family:'Manrope',sans-serif; font-size:1.15rem; font-weight:700; color:var(--ink); line-height:1.25; letter-spacing:-.015em }
.biz-usp{ font-size:.88rem; color:#5A6573; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.biz-meta{ display:flex; align-items:center; gap:10px; margin-top:10px; font-size:.82rem; color:var(--muted); padding-top:12px; border-top:1px solid rgba(15,23,42,.05) }
.biz-meta .rating{ color:var(--ink); font-weight:600 }
.biz-meta .loc{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

/* Overlay link pattern — entire card clickable, but inner action buttons take priority */

.biz-card-link{ position:absolute; inset:0; z-index:1; border-radius:inherit; }
.biz-card-link:focus-visible{ outline:2px solid var(--saffron); outline-offset:-2px }
.biz-card .biz-meta, .biz-card .biz-actions{ position:relative; z-index:2 }

.open-toggle .sw::after{

<script>
function setLang(lang){
  if (lang!=='en'&&lang!=='hi') lang='en';
  document.documentElement.setAttribute('data-lang',lang);
  document.documentElement.setAttribute('lang',lang);
  localStorage.setItem('shop_lang',lang);
  document.getElementById('langBtnEn').classList.toggle('active',lang==='en');
  document.getElementById('langBtnHi').classList.toggle('active',lang==='hi');
}

let CATEGORIES = [], CITIES = [];
let LAST_RESULTS = [];        // last unfiltered result-set (for client-side filters)
let OPEN_NOW = false;          // active toggle state
let RATING_FILTER = false;     // ⭐ 4.0+
let VERIFIED_FILTER = false;   // ✓ Verified
let DEALS_FILTER = false;      // 🎁 With active deals
let SORT_BY = 'relevance';     // relevance | featured | rating | reviews | newest
let CAT_FILTER = new Set();    // sidebar multi-select category slugs
let RATING_BUCKET = 0;         // sidebar rating radio: 0 (any) / 2 / 3 / 4

function setSort(val){
  SORT_BY = String(val || 'relevance');
  try{ localStorage.setItem('shop_sort', SORT_BY); }catch(_){}
  renderResults();
}

function applySort(rows){
  if (!Array.isArray(rows) || rows.length < 2) return rows;
  const sorted = rows.slice();
  switch (SORT_BY){
    case 'featured':
      sorted.sort((a, b) => {
        const af = a.is_featured ? 1 : 0;
        const bf = b.is_featured ? 1 : 0;
        if (bf !== af) return bf - af;
        return (Number(b.rating_avg) || 0) - (Number(a.rating_avg) || 0);
      });
      break;
    case 'rating':
      sorted.sort((a, b) => {
        const ar = Number(a.rating_avg) || 0;
        const br = Number(b.rating_avg) || 0;
        if (br !== ar) return br - ar;
        return (Number(b.rating_count) || 0) - (Number(a.rating_count) || 0);
      });
      break;
    case 'reviews':
      sorted.sort((a, b) => (Number(b.rating_count) || 0) - (Number(a.rating_count) || 0));
      break;
    case 'newest':
      sorted.sort((a, b) => {
        const at = a.created_at ? Date.parse(a.created_at) : Number(a.id) || 0;
        const bt = b.created_at ? Date.parse(b.created_at) : Number(b.id) || 0;
        return bt - at;
      });
      break;
    case 'relevance':
    default:
      break;
  }
  return sorted;
}

async function loadDropdowns(){
  const c = ShopDB.client;
  const sel = document.getElementById('catSel');
  sel.innerHTML = '<option value="">All categories</option>';

  // ----- Categories: prefer Supabase live data (hierarchical) -----
  let loaded = false;
  if (c){
    try{
      const { data: rows, error } = await c.from('categories')
        .select('id, slug, name, icon, parent_id, sort_order')
        .eq('active', true)
        .order('sort_order');
      if (!error && rows && rows.length){
        const parents = rows.filter(r => r.parent_id == null);
        parents.forEach(p => {
          const og = document.createElement('optgroup');
          og.label = (p.icon || '') + '  ' + p.name;
          // "All in parent" option
          const allOpt = document.createElement('option');
          allOpt.value = p.slug;
          allOpt.textContent = 'All ' + p.name;
          og.appendChild(allOpt);
          // Sub-categories under this parent
          rows.filter(s => s.parent_id === p.id).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.slug;
            opt.textContent = (s.icon || '') + '  ' + s.name;
            og.appendChild(opt);
          });
          sel.appendChild(og);
        });
        CATEGORIES = rows;
        loaded = true;
      }
    }catch(e){ console.warn('Supabase categories fetch failed', e); }
  }

  // ----- Fallback: bundled JSON (handles both old flat + new hierarchical structures) -----
  if (!loaded){
    try{
      const r = await fetch('/assets/data/categories.json', { cache:'no-cache' });
      const data = await r.json();
      if (Array.isArray(data.parents)){
        data.parents.forEach(p => {
          const og = document.createElement('optgroup');
          og.label = (p.icon || '') + '  ' + p.name;
          const allOpt = document.createElement('option');
          allOpt.value = p.slug;
          allOpt.textContent = 'All ' + p.name;
          og.appendChild(allOpt);
          (p.subs || []).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.slug;
            opt.textContent = (s.icon || '') + '  ' + s.name;
            og.appendChild(opt);
          });
          sel.appendChild(og);
        });
        CATEGORIES = [];
        data.parents.forEach(p => {
          CATEGORIES.push({ slug:p.slug, name:p.name, icon:p.icon });
          (p.subs || []).forEach(s => CATEGORIES.push({ slug:s.slug, name:s.name, icon:s.icon }));
        });
      } else if (Array.isArray(data.categories)){
        CATEGORIES = data.categories;
        CATEGORIES.forEach(cat => {
          sel.innerHTML += `<option value="${cat.slug}">${cat.icon || ''} ${cat.name}</option>`;
        });
      }
    }catch(e){ console.error('Categories load fail', e); }
  }

  // ----- Cities from Supabase -----
  if (c){
    try{
      const { data } = await c.from('geo_cities').select('id, name').eq('active', true).order('name');
      if (data){
        CITIES = data;
        const citySel = document.getElementById('citySel');
        data.forEach(ct => citySel.innerHTML += `<option value="${ct.id}">${ct.name}</option>`);
      }
    }catch(e){ console.warn('Cities load fail', e); }
  }
}

// Resolve a city param that might be either a numeric ID or a slug like
// 'bathinda' (homepage sends slug; search.html / browse.html send ID).
// Returns the integer city_id or null.
function resolveCityParam(raw){
  if (!raw) return null;
  const n = +raw;
  if (Number.isFinite(n) && n > 0) return n;
  const slug = String(raw).toLowerCase().trim();
  if (!CITIES || !CITIES.length) return null;
  const match = CITIES.find(c => {
    if (!c || !c.name) return false;
    const nm = String(c.name).toLowerCase().trim();
    const nmSlug = nm.replace(/\s+/g, '-');
    return nm === slug || nmSlug === slug || nm.includes(slug) || slug.includes(nm);
  });
  return match ? match.id : null;
}

async function runSearch(){
  const params = new URLSearchParams(location.search);
  const q       = params.get('q')    || '';
  const catSlug = params.get('cat')  || '';
  const cityId  = resolveCityParam(params.get('city'));
  const pin     = (params.get('pin') || '').replace(/\D/g, '').slice(0, 6);

  document.getElementById('q').value = q;
  document.getElementById('catSel').value = catSlug;
  if (cityId) document.getElementById('citySel').value = cityId;
  if (pin) document.getElementById('pinSel').value = pin;

  // Render active filter chips (above results)
  if (window.DukanChips){
    const rmAndSearch = (key) => () => {
      const p = new URLSearchParams(location.search);
      p.delete(key);
      const url = '/search.html' + (p.toString() ? '?' + p.toString() : '');
      history.pushState({}, '', url);
      runSearch();
    };
    const cityLabel = cityId ? (document.querySelector('#citySel option[value="' + cityId + '"]')?.textContent || 'City') : null;
    const catLabel  = catSlug ? (document.querySelector('#catSel option[value="' + catSlug + '"]')?.textContent || catSlug) : null;
    DukanChips.render('filterChipsSlot', {
      q:    q       ? { label: q,         remove: rmAndSearch('q') }    : null,
      cat:  catLabel ? { label: catLabel, remove: rmAndSearch('cat') }  : null,
      city: cityLabel ? { label: cityLabel.replace(/^.*?\s/,''), remove: rmAndSearch('city') } : null,
      pin:  pin     ? { label: pin,       remove: rmAndSearch('pin') }  : null
    });
  }

  const c = ShopDB.client;
  const resEl = document.getElementById('results');
  const countEl = document.getElementById('countDisp');
  if (window.DukanSkeleton) resEl.innerHTML = DukanSkeleton.cards(6);
  else resEl.innerHTML = '<div class="empty"><span class="ico">⏳</span>Searching...</div>';

  if (!c){
    resEl.innerHTML = `<div class="empty"><span class="ico">⚠️</span><b>Backend not configured</b>Configure Supabase URL in /assets/js/supabase-init.js</div>`;
    return;
  }

  const { data, error } = await c.rpc('search_businesses', {
    p_query   : q || null,
    p_category: catSlug || null,
    p_city_id : cityId,
    p_state_id: null,
    p_limit   : 50,
    p_offset  : 0,
    p_pincode : pin || null
  });

  if (error){
    console.error(error);
    resEl.innerHTML = `<div class="empty"><span class="ico">⚠️</span><b>Search failed</b>${error.message}</div>`;
    return;
  }

  LAST_RESULTS = Array.isArray(data) ? data : [];
  renderResults();
}

function renderResults(){
  // Sync map view if active
  if (CURRENT_VIEW === 'map' && _mapInstance){ renderMapPins(); }
  return _renderResultsInner();
}

function _renderResultsInner(){
  const resEl = document.getElementById('results');
  const countEl = document.getElementById('countDisp');
  const hint = document.getElementById('openFilterHint');
  let rows = LAST_RESULTS.slice();
  let filteredOutByOpen = 0;

  if (OPEN_NOW){
    const before = rows.length;
    const anyHasHours = rows.some(b => b.hours_json && Object.keys(b.hours_json).length);
    if (!anyHasHours){
      const hint = document.getElementById('openFilterHint');
      hint.textContent = '(hours data not returned by search — filter skipped)';
    } else {
      rows = rows.filter(b => {
        if (!b.hours_json) return false;
        const st = (typeof getOpenStatus === 'function') ? getOpenStatus(b.hours_json) : null;
        return !!(st && st.isOpen);
      });
      filteredOutByOpen = before - rows.length;
    }
  }

  if (RATING_FILTER || RATING_BUCKET >= 2){
    const threshold = RATING_BUCKET >= 2 ? RATING_BUCKET : 4.0;
    rows = rows.filter(b => Number(b.rating_avg) >= threshold);
  }
  if (CAT_FILTER.size > 0){
    rows = rows.filter(b => {
      const slug = (b.category_slug || '').toLowerCase();
      if (CAT_FILTER.has(slug)) return true;
      const cats = Array.isArray(b.categories) ? b.categories : [];
      return cats.some(c => CAT_FILTER.has(String(c.slug || c).toLowerCase()));
    });
  }
  if (VERIFIED_FILTER){
    rows = rows.filter(b => Number(b.verified_score) >= 3);
  }
  if (DEALS_FILTER && BIZ_WITH_DEALS.size){
    rows = rows.filter(b => BIZ_WITH_DEALS.has(b.id));
  }

  if (!rows.length){
    countEl.textContent = '';
    if (OPEN_NOW && LAST_RESULTS.length){
      resEl.innerHTML = `
        <div class="empty">
          <span class="ico">🕒</span>
          <b><span data-i18n-en>No shops open right now</span><span data-i18n-hi>अभी कोई दुकान खुली नहीं है</span></b>
          <span data-i18n-en class="block">Turn off "Open Now" to see all ${LAST_RESULTS.length} results.</span>
          <span data-i18n-hi class="block">सभी ${LAST_RESULTS.length} परिणाम देखने के लिए "अभी खुले" बंद करें।</span>
        </div>`;
    } else {
      resEl.innerHTML = `
        <div class="empty">
          <span class="ico">🔍</span>
          <b><span data-i18n-en>No shops found</span><span data-i18n-hi>कोई दुकान नहीं मिली</span></b>
          <span data-i18n-en class="block">Try different keywords or browse all categories.</span>
          <span data-i18n-hi class="block">अलग कीवर्ड्स या सभी श्रेणियाँ ब्राउज़ करें।</span>
          <a href="/browse.html" style="display:inline-block;margin-top:10px;color:var(--saffron-deep);font-weight:700">
            <span data-i18n-en>← Browse all categories</span><span data-i18n-hi>← सभी श्रेणियाँ</span>
          </a>
        </div>`;
    }
    hint.textContent = '';
    return;
  }

  // Apply sort (relevance keeps server order)
  rows = applySort(rows);

  countEl.innerHTML = `<b>${rows.length}</b> <span data-i18n-en>shop${rows.length===1?'':'s'} found</span><span data-i18n-hi>दुकान मिली</span>`;
  if (OPEN_NOW && filteredOutByOpen > 0){
    hint.textContent = '(' + filteredOutByOpen + ' hidden — closed)';
  } else {
    hint.textContent = '';
  }
  resEl.innerHTML = `<div class="biz-grid stagger">${rows.map(renderCard).join('')}</div>`;
}

let _mapInstance = null;
let _mapPins = [];
let _mapLeafletLoaded = false;
let CURRENT_VIEW = 'list';

function setView(v){
  CURRENT_VIEW = v;
  document.getElementById('viewListBtn').classList.toggle('active', v === 'list');
  document.getElementById('viewMapBtn').classList.toggle('active', v === 'map');
  document.getElementById('viewListBtn').setAttribute('aria-pressed', v === 'list' ? 'true' : 'false');
  document.getElementById('viewMapBtn').setAttribute('aria-pressed', v === 'map' ? 'true' : 'false');
  document.getElementById('results').style.display = v === 'list' ? '' : 'none';
  document.getElementById('mapView').style.display = v === 'map' ? '' : 'none';
  try{ localStorage.setItem('shop_view', v); }catch(_){}
  if (v === 'map') initMap();
}

async function loadLeaflet(){
  if (_mapLeafletLoaded) return;
  return new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => { _mapLeafletLoaded = true; resolve(); };
    js.onerror = reject;
    document.head.appendChild(js);
  });
}

async function initMap(){
  const hint = document.getElementById('mapLoadHint');
  try{
    await loadLeaflet();
    hint.style.display = 'none';
    if (!_mapInstance){
      // Default centre on Mandi Dabwali (Sirsa)
      _mapInstance = L.map('mapView', { zoomControl: true, scrollWheelZoom: true })
        .setView([29.95, 74.7], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(_mapInstance);
    }
    renderMapPins();
  } catch(e){
    hint.style.display = 'grid';
    hint.innerHTML = '⚠️ Map failed to load. <a href="javascript:initMap()" style="color:var(--saffron-deep);font-weight:700">Retry</a>';
  }
}

function renderMapPins(){
  if (!_mapInstance) return;
  // Clear existing pins
  _mapPins.forEach(m => _mapInstance.removeLayer(m));
  _mapPins = [];

  const rows = LAST_RESULTS.filter(b => b.lat && b.lng);
  if (!rows.length){
    const hint = document.getElementById('mapLoadHint');
    hint.style.display = 'grid';
    hint.innerHTML = '📍 No shops with location data in current results. Showing all of Sirsa-Bathinda region.';
    return;
  }

  document.getElementById('mapLoadHint').style.display = 'none';

  const bounds = [];
  rows.forEach(b => {
    const isFeatured = !!b.is_featured;
    const icon = L.divIcon({
      className: '',
      html: `<div class="dl-pin ${isFeatured ? 'featured' : ''}"><span>${b.category_icon || '🏪'}</span></div>`,
      iconSize: [32, 40],
      iconAnchor: [16, 38],
      popupAnchor: [0, -34]
    });
    const marker = L.marker([Number(b.lat), Number(b.lng)], { icon }).addTo(_mapInstance);
    const photo = (b.photos && b.photos[0]) || '';
    const rating = Number(b.rating_avg) > 0 ? `⭐ ${Number(b.rating_avg).toFixed(1)} (${b.rating_count})` : 'No reviews';
    const popupHtml = `<div class="popup-card">
      ${photo ? `<div class="pc-photo"><img src="${escapeHTML(photo)}" alt=""></div>` : ''}
      <div class="pc-body">
        <div class="pc-name">${escapeHTML(b.name)}${isFeatured ? ' ⭐' : ''}</div>
        <div class="pc-meta">${escapeHTML(b.category_name || '')} · ${escapeHTML(b.city_name || '')}<br>${rating}</div>
        <a class="pc-cta" href="/business.html?slug=${encodeURIComponent(b.slug)}">View Shop →</a>
      </div>
    </div>`;
    marker.bindPopup(popupHtml);
    _mapPins.push(marker);
    bounds.push([Number(b.lat), Number(b.lng)]);
  });
  if (bounds.length > 1){
    _mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  } else if (bounds.length === 1){
    _mapInstance.setView(bounds[0], 14);
  }
}

function populateSidebar(){

  if (!list || !Array.isArray(CATEGORIES) || !CATEGORIES.length) return;

    parents.forEach(p => {
      const subs = CATEGORIES.filter(s => s.parent_id === p.id);
      html += '<div class="ss-cat-group">'

        + '</div>'
        + '<div class="ss-cat-children">';
      html += '<label class="ss-row"><input type="checkbox" value="' + escapeHTML(p.slug) + '" onchange="ssToggleCat(this.value, this.checked)">All ' + escapeHTML(p.name) + '</label>';
      subs.forEach(s => {
        html += '<label class="ss-row"><input type="checkbox" value="' + escapeHTML(s.slug) + '" onchange="ssToggleCat(this.value, this.checked)"><span class="ss-icon">' + (s.icon || '') + '</span>' + escapeHTML(s.name) + '</label>';
      });
      html += '</div></div>';
    });
  } else {
    CATEGORIES.forEach(c => {
      html += '<label class="ss-row"><input type="checkbox" value="' + escapeHTML(c.slug) + '" onchange="ssToggleCat(this.value, this.checked)"><span class="ss-icon">' + (c.icon || '') + '</span>' + escapeHTML(c.name) + '</label>';
    });
  }
  list.innerHTML = html;
}

function ssToggleCatGroup(headerEl){ headerEl.classList.toggle('open'); }

function ssToggleCat(slug, checked){
  if (!slug) return;
  if (checked) CAT_FILTER.add(slug);
  else CAT_FILTER.delete(slug);
  try { localStorage.setItem('shop_catFilter', JSON.stringify(Array.from(CAT_FILTER))); } catch(_){}
  renderResults();
}

function ssSetRating(bucket){
  RATING_BUCKET = Number(bucket) || 0;
  try { localStorage.setItem('shop_ratingBucket', String(RATING_BUCKET)); } catch(_){}
  if (RATING_BUCKET === 4){
    RATING_FILTER = true;
    const btn = document.getElementById('ratingToggle');
    if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
  } else if (RATING_FILTER && RATING_BUCKET !== 4){
    RATING_FILTER = false;
    const btn = document.getElementById('ratingToggle');
    if (btn){ btn.classList.remove('on'); btn.setAttribute('aria-pressed','false'); }
  }
  renderResults();
}

function ssSyncToggle(kind, checked){
  if (kind === 'openNow'){
    OPEN_NOW = !!checked;
    const btn = document.getElementById('openNowToggle');
    if (btn){ btn.classList.toggle('on', OPEN_NOW); btn.setAttribute('aria-pressed', OPEN_NOW ? 'true' : 'false'); }
    try { localStorage.setItem('shop_openNow', OPEN_NOW ? '1' : '0'); } catch(_){}
  } else if (kind === 'verified'){
    VERIFIED_FILTER = !!checked;
    const btn = document.getElementById('verifiedToggle');
    if (btn){ btn.classList.toggle('on', VERIFIED_FILTER); btn.setAttribute('aria-pressed', VERIFIED_FILTER ? 'true' : 'false'); }
    try { localStorage.setItem('shop_verifiedFilter', VERIFIED_FILTER ? '1' : '0'); } catch(_){}
  } else if (kind === 'deals'){
    DEALS_FILTER = !!checked;
    const btn = document.getElementById('dealsToggle');
    if (btn){ btn.classList.toggle('on', DEALS_FILTER); btn.setAttribute('aria-pressed', DEALS_FILTER ? 'true' : 'false'); }
    try { localStorage.setItem('shop_dealsFilter', DEALS_FILTER ? '1' : '0'); } catch(_){}
  }
  renderResults();
}

function clearAllFilters(e){
  if (e) e.preventDefault();
  CAT_FILTER.clear();
  RATING_BUCKET = 0;
  OPEN_NOW = false;
  RATING_FILTER = false;
  VERIFIED_FILTER = false;
  DEALS_FILTER = false;
  try {
    localStorage.removeItem('shop_catFilter');
    localStorage.removeItem('shop_ratingBucket');
    localStorage.setItem('shop_openNow', '0');
    localStorage.setItem('shop_ratingFilter', '0');
    localStorage.setItem('shop_verifiedFilter', '0');
    localStorage.setItem('shop_dealsFilter', '0');
  } catch(_){}
  ['openNowToggle','ratingToggle','verifiedToggle','dealsToggle'].forEach(id => {
    const b = document.getElementById(id);
    if (b){ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); }
  });
  ['ssOpenNow','ssVerified','ssDeals'].forEach(id => {
    const cb = document.getElementById(id);
    if (cb) cb.checked = false;
  });
  const ratingAny = document.querySelector('input[name="ssRating"][value="0"]');
  if (ratingAny) ratingAny.checked = true;
  document.querySelectorAll('#ssCatList input[type="checkbox"]').forEach(cb => { cb.checked = false; });
  document.querySelectorAll('.ss-cat-parent.open').forEach(el => el.classList.remove('open'));
  renderResults();
}

function restoreSidebarState(){
  try {
    const savedCats = JSON.parse(localStorage.getItem('shop_catFilter') || '[]');
    if (Array.isArray(savedCats)) savedCats.forEach(s => CAT_FILTER.add(s));
    const savedBucket = Number(localStorage.getItem('shop_ratingBucket') || '0');
    if ([0, 2, 3, 4].includes(savedBucket)) RATING_BUCKET = savedBucket;
  } catch(_){}
  setTimeout(() => {
    document.querySelectorAll('#ssCatList input[type="checkbox"]').forEach(cb => {
      if (CAT_FILTER.has(cb.value)) cb.checked = true;
    });
    const r = document.querySelector('input[name="ssRating"][value="' + RATING_BUCKET + '"]');
    if (r) r.checked = true;
    const ssOn = document.getElementById('ssOpenNow'); if (ssOn) ssOn.checked = OPEN_NOW;
    const ssVf = document.getElementById('ssVerified'); if (ssVf) ssVf.checked = VERIFIED_FILTER;
    const ssDl = document.getElementById('ssDeals'); if (ssDl) ssDl.checked = DEALS_FILTER;
  }, 50);
}

function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

function handleSearch(e){
  e.preventDefault();
  const params = new URLSearchParams();
  const q = document.getElementById('q').value.trim();
  const cat = document.getElementById('catSel').value;
  const city = document.getElementById('citySel').value;
  const pin = (document.getElementById('pinSel')?.value || '').replace(/\D/g, '').slice(0, 6);
  if (q && window.DukanAutocomplete) DukanAutocomplete.saveQuery(q);
  if (q) params.set('q', q);
  if (cat) params.set('cat', cat);
  if (city) params.set('city', city);
  if (pin && pin.length === 6) params.set('pin', pin);
  const url = '/search.html' + (params.toString() ? '?' + params.toString() : '');
  history.pushState({}, '', url);
  runSearch();
}

window.addEventListener('DOMContentLoaded', async () => {
  setLang(localStorage.getItem('shop_lang') || 'en');
  // Restore Open-Now toggle preference
  try{
    if (localStorage.getItem('shop_openNow') === '1'){
      OPEN_NOW = true;
      const btn = document.getElementById('openNowToggle');
      if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
    }
    if (localStorage.getItem('shop_ratingFilter') === '1'){
      RATING_FILTER = true;
      const btn = document.getElementById('ratingToggle');
      if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
    }
    if (localStorage.getItem('shop_verifiedFilter') === '1'){
      VERIFIED_FILTER = true;
      const btn = document.getElementById('verifiedToggle');
      if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
    }
    if (localStorage.getItem('shop_dealsFilter') === '1'){
      DEALS_FILTER = true;
      const btn = document.getElementById('dealsToggle');
      if (btn){ btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
    }
    // Restore sort preference
    const savedSort = localStorage.getItem('shop_sort');
    if (savedSort){
      const ok = ['relevance','featured','rating','reviews','newest'];
      if (ok.indexOf(savedSort) !== -1){
        SORT_BY = savedSort;
        const sel = document.getElementById('sortSel');
        if (sel) sel.value = SORT_BY;
      }
    }
  }catch(_){}
  await loadDropdowns();
  // Populate sidebar filter rail (desktop only — CSS hides on mobile)
  populateSidebar();
  restoreSidebarState();
  try{
    const v = localStorage.getItem('shop_view');
    if (v === 'map'){ setView('map'); }
  }catch(_){}
  runSearch();
});
window.addEventListener('popstate', runSearch);
</script>
