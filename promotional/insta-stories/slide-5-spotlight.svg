<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Nirmala UI','Mangal','Noto Sans Devanagari',Arial,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="bloom" cx="80%" cy="-5%" r="80%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="-10%" cy="105%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  <rect width="1080" height="1920" fill="url(#bloom)"/>
  <rect width="1080" height="1920" fill="url(#bloom2)"/>
  <!-- decorative circles -->
  <circle cx="980" cy="180" r="140" fill="rgba(255,255,255,0.10)"/>
  <circle cx="120" cy="1700" r="180" fill="rgba(255,255,255,0.08)"/>
  <circle cx="900" cy="1800" r="60" fill="rgba(255,255,255,0.12)"/>

  <!-- Top brand pill -->
  <rect x="340" y="80" width="400" height="80" rx="40" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.40)" stroke-width="3"/>
  <text x="540" y="135" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">DUKANLIST</text>

  <!-- Feature number tag -->
  <rect x="80" y="260" width="200" height="80" rx="40" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.40)" stroke-width="3"/>
  <text x="180" y="318" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">FEATURE 4</text>

  <!-- Heading -->
  <text x="540" y="460" font-size="48" font-weight="700" fill="#FBBF24" text-anchor="middle">★</text>
  <text x="540" y="560" font-size="74" font-weight="900" fill="#ffffff" text-anchor="middle">Spotlight</text>
  <text x="540" y="650" font-size="74" font-weight="900" fill="#ffffff" text-anchor="middle">of the Week</text>

  <!-- Big spotlight stage -->
  <ellipse cx="540" cy="1100" rx="380" ry="60" fill="rgba(0,0,0,0.25)"/>
  <rect x="240" y="780" width="600" height="320" rx="30" fill="rgba(255,255,255,0.98)" stroke="#FBBF24" stroke-width="6"/>

  <!-- Crown / star above featured biz -->
  <text x="540" y="780" font-size="80" font-weight="900" fill="#FBBF24" text-anchor="middle">★</text>

  <!-- Featured business mock -->
  <circle cx="540" cy="900" r="60" fill="#FF6B1A"/>
  <text x="540" y="924" font-size="60" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  <text x="540" y="1020" font-size="40" font-weight="900" fill="#0F172A" text-anchor="middle">Anand Gift House</text>
  <text x="540" y="1065" font-size="26" font-weight="700" fill="#10B981" text-anchor="middle">★ 4.9 — 32 reviews this week</text>

  <!-- "FEATURED" ribbon -->
  <rect x="380" y="1140" width="320" height="60" rx="30" fill="#FBBF24"/>
  <text x="540" y="1182" font-size="28" font-weight="900" fill="#0F172A" text-anchor="middle">★ FEATURED THIS WEEK</text>

  <!-- Description -->
  <text x="540" y="1320" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">हर हफ्ते सक्रिय व्यवसाय को</text>
  <text x="540" y="1380" font-size="42" font-weight="700" fill="#ffffff" text-anchor="middle">मुफ्त प्रमोशन — होमपेज पर</text>

  <!-- How to get there -->
  <rect x="100" y="1480" width="880" height="220" rx="25" fill="rgba(0,0,0,0.20)" stroke="rgba(255,255,255,0.30)" stroke-width="3"/>
  <text x="540" y="1540" font-size="32" font-weight="800" fill="#FBBF24" text-anchor="middle">कैसे आएगा आपका नाम?</text>
  <text x="540" y="1605" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">► प्रोफाइल पूरी रखिए</text>
  <text x="540" y="1655" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle">► ग्राहकों से नए रिव्यू लीजिए</text>

  <!-- Bottom website -->
  <text x="540" y="1820" font-size="34" font-weight="700" fill="rgba(255,255,255,0.95)" text-anchor="middle" letter-spacing="3">dukanlist.com</text>
  <text x="540" y="1870" font-size="22" font-weight="500" fill="rgba(255,255,255,0.70)" text-anchor="middle" letter-spacing="2">Powered by DigiMutual Goals Pvt. Ltd.</text>
</svg>