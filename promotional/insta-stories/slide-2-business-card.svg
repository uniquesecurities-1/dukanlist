  <text x="400" y="1332" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">✓ Verified on DukanList</text>

  <!-- Photo / hours hint -->
  <rect x="240" y="1380" width="600" height="60" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text x="540" y="1422" font-size="26" font-weight="700" fill="#9A3412" text-anchor="middle">Photos · Hours · USP · Direct Contact</text>

